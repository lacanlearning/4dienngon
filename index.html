iện thoại xuống. Cảm giác trống vẫn còn, nhưng bây giờ nó có một câu hỏi đi kèm: “Mình đang thiếu cái gì, và ai bảo mình phải có thứ đó?”"], "read": "Khoảng dừng làm vòng khép kín hở ra: chủ thể ($) đặt câu hỏi với mệnh lệnh (S₁) thay vì lao thẳng vào nó. Đây là cấu trúc Cuồng loạn. Nó chưa phải lời giải, chỉ là chỗ vòng lặp bị ngắt.", "choices": [{"t": "Rút cuốn sổ đầu giường, viết ra ba điều mình thật sự muốn trong tuần này, rồi ngủ.", "go": "eC3", "fb": "Bạn để câu hỏi ở lại thay vì lấp nó ngay."}, {"t": "Mở ứng dụng AI, gõ: “cách hết cảm giác trống rỗng”.", "go": "c1", "fb": "Bạn đưa câu hỏi cho bộ máy trả lời (S₂). Câu trả lời có ngay và vòng khép kín nối lại. Sơ đồ xoay về Tư bản."}]}, "eC1": {"d": "capitalist", "end": 1, "title": "Hai giờ sau", "scene": ["Khi bạn đặt điện thoại xuống thì trời gần sáng. Bạn không nhớ đã xem gì, chỉ nhớ cảm giác trống vẫn ở đó."], "insight": "Mỗi lần lướt cho một phần dư (a), rồi phần dư ấy làm bạn muốn thêm. Chủ thể ($) càng bất mãn thì vòng càng chạy, và không có khoảng dừng tự nhiên nào."}, "eC2": {"d": "capitalist", "end": 1, "title": "Món hàng đến, cảm giác thì không", "scene": ["Hai ngày sau món hàng đến và bạn vui một buổi tối. Sáng hôm sau một thông báo hiện lên: phiên bản mới hơn vừa ra mắt."], "insight": "Món hàng không phải đối tượng a; nó chỉ là vật thế chỗ tạm thời cho a, nên hào quang tan ngay khi hàng về tay. Vòng lặp được thiết kế để tạo ra thiếu hụt chứ không lấp nó, nên cảm giác thỏa mãn chỉ kéo dài đến khi có món mới."}, "eC3": {"d": "hysteric", "end": 1, "title": "Một câu hỏi được gọi tên", "scene": ["Bạn viết ra: ngủ đủ, gặp bạn cũ, và đừng xem điện thoại trước 9 giờ. Bạn nhìn ba dòng ấy và nhận ra hai trong ba điều không cần mua gì."], "insight": "Một khoảng dừng không đưa bạn ra khỏi diễn ngôn Tư bản; nó chỉ làm vòng tròn hở ra một chút. Ở Lacan, chuyện này mang tính cấu trúc, không giải bằng ý chí hay một thói quen. Kịch bản chỉ minh họa chỗ vòng khép kín có thể bị ngắt, không phải lời khuyên chữa bệnh."}}}, {"id": "gia", "title": "Bao giờ con tính chuyện vợ chồng?", "sub": "Bạn ba mươi mốt tuổi, về nhà ăn cơm cuối tuần. Mẹ bỗng nhắc chuyện vợ chồng.", "start": "n0", "nodes": {"n0": {"d": "master", "q": "Bạn đáp thế nào?", "scene": ["Chiều Chủ nhật, cả nhà ngồi ăn cơm. Mẹ gắp thêm miếng cá vào bát bạn, không ngẩng lên: “Con ba mươi mốt rồi đấy. Bao giờ con tính chuyện vợ chồng? Con nhà bà Hai bằng tuổi con, giờ có hai đứa rồi.” Bố húng hắng ho, không nói gì, nhưng cũng không bênh bạn."], "read": "Mẹ nói câu này như một điều hiển nhiên: “đến tuổi thì phải lập gia đình” (S₁), không kèm lý do, và bạn bị đặt vào chỗ phải thi hành (S₂). Phía sau là điều bà ít khi nói ra: nỗi lo của chính bà ($), về tuổi già, về lời bàn tán của họ hàng. Đây là cấu trúc Chủ nhân. Vị trí này không gắn với vai mẹ hay thế hệ nào: ai nói “đến tuổi rồi thì phải” theo cách này cũng đang đứng ở đó, và điều ấy chưa nói gì về tình thương của họ.", "choices": [{"t": "“Mẹ ơi, bây giờ ai cũng cưới muộn mà. Con muốn ổn định công việc đã, ba năm nữa tính.”", "go": "n1u", "fb": "Bạn đáp bằng một lý lẽ và một kế hoạch: tri thức (S₂) đứng ở vị trí tác nhân, còn mối bận tâm của mẹ bị quy thành một mốc thời gian cần bàn lại (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Chuyện của con, con tự lo. Mẹ đừng hỏi nữa.”", "go": "n1m", "fb": "Bạn đáp bằng một tuyên bố cắt ngang, không kèm lý do: S₁ của bạn đứng ra đối đầu với S₁ của mẹ. Sơ đồ vẫn ở Chủ nhân."}, {"t": "“Sao hôm nay mẹ nhắc chuyện này vậy mẹ? Mẹ đang lo gì ạ?”", "go": "n1a", "fb": "Bạn không đưa lý lẽ mà giữ một khoảng trống để mẹ tự nói tiếp: a ở vị trí tác nhân, $ của mẹ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1u": {"d": "university", "scene": ["Bạn nói xong, nghe có lý. Mẹ gật gật rồi vẫn hỏi: “Thế ba năm nữa con ba mươi bốn. Lúc đó ai còn…” Bà không nói hết câu, rồi quay sang: “Bà Hai bảo để mẹ nhờ người giới thiệu cho.”"], "read": "Lý lẽ và kế hoạch của bạn (S₂) đứng ở vị trí tác nhân; mẹ bị xếp thành một “đối tượng cần thuyết phục” (a). Phía sau vẫn là mệnh lệnh chưa ai nói ra (S₁: “đến tuổi thì phải”), nên mẹ nghe kế hoạch của bạn như một lời hoãn chứ chưa phải một câu trả lời. Phần không khớp với lý lẽ, tức nỗi lo của mẹ ($), chưa có chỗ để nói: câu “lúc đó ai còn…” bỏ lửng chính là chỗ ấy.", "choices": [{"t": "“Mẹ đừng nhờ ai. Con có dùng ứng dụng hẹn hò rồi, tuần này có mấy người nhắn.”", "go": "n2c", "fb": "Bạn chuyển câu hỏi sang một kênh có sẵn của thị trường: chủ thể thiếu ($) đi thẳng tới khẩu hiệu “tìm người phù hợp” (S₁) mà không có khoảng dừng. Sơ đồ xoay sang Tư bản."}, {"t": "“Con biết mẹ sốt ruột. Mà mẹ lo nhất chuyện gì, mẹ kể con nghe với.”", "go": "n1a", "fb": "Bạn dừng việc giải thích và mời mẹ nói về nỗi lo của chính bà: a ở vị trí tác nhân, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Để con lập cái bảng tiến độ, cuối năm mẹ con mình xem lại.”", "go": "eU", "fb": "Bạn khép câu hỏi bằng một lịch trình: tri thức (S₂) tiếp tục ở vị trí tác nhân."}]}, "n1m": {"d": "master", "scene": ["Mẹ đặt đũa xuống: “Mẹ hỏi một câu mà con gắt lên. Mẹ nuôi con từng này năm, đâu phải để con nói với mẹ như thế.” Bố nhìn bạn, rồi nhìn xuống bát."], "read": "Hai mệnh lệnh chạm nhau: “đến tuổi phải lập gia đình” (S₁ của mẹ) và “chuyện của con” (S₁ của bạn). Mẹ chuyển sang lấy công ơn làm nền cho lệnh của mình, một cách để S₁ đứng vững khi không có lý do. Bên dưới vẫn chưa ai nói ra điều gì: nỗi sợ bị bỏ lại ($) của mẹ, và cả sự không chắc của chính bạn về điều mình muốn ($).", "choices": [{"t": "“Con xin lỗi mẹ. Thôi, năm nay con đi xem mắt, mẹ đừng buồn.”", "go": "eM", "fb": "Bạn nhận lệnh để chấm dứt cảnh căng thẳng: S₂ của bạn bắt đầu làm việc cho S₁ của mẹ."}, {"t": "“Con không gắt. Chỉ là con cũng không biết mình có muốn không, hay chỉ muốn mẹ khỏi buồn.”", "go": "n2h", "fb": "Bạn nói ra điều mình chưa chắc, thay vì đối đầu hay nhận lệnh: $ của bạn đứng ở vị trí tác nhân và đặt câu hỏi vào chính mệnh lệnh. Sơ đồ xoay sang Cuồng loạn."}]}, "n2c": {"d": "capitalist", "scene": ["Mẹ bán tín bán nghi: “Ứng dụng là cái gì?” Bạn mở điện thoại cho mẹ xem. Màn hình hiện hàng chục khuôn mặt, mỗi tấm kèm vài dòng giới thiệu. Bạn vuốt qua một người, rồi một người nữa; đến người thứ mười, bạn không nhớ người thứ ba tên gì. Mẹ hỏi: “Nhiều thế này, sao chưa ai được?”"], "read": "Cảm giác thiếu ($) đi thẳng tới khẩu hiệu thị trường “tìm người phù hợp nhất” (S₁), thuật toán (S₂) không có ai để hỏi, và mỗi khuôn mặt là một phần dư vừa đủ hấp dẫn (a) để bạn vuốt tiếp. Vòng $ → S₁ → S₂ → a → $ không có điểm dừng, và “chọn kỹ hơn” cũng thành một lý do để chưa chọn. Đây là cách diễn ngôn Tư bản vận hành; nó không nói rằng ứng dụng hẹn hò là xấu hay người dùng nó là nạn nhân.", "choices": [{"t": "“Để con vuốt thêm chút nữa, kiểu gì cũng có người hợp.”", "go": "eC", "fb": "Bạn để vòng chạy tiếp."}, {"t": "“Mẹ hỏi đúng đấy. Con cũng không biết mình đang tìm người, hay đang tìm cho mẹ yên tâm.”", "go": "n2h", "fb": "Bạn ngắt vòng bằng một câu hỏi. Sơ đồ xoay sang Cuồng loạn."}]}, "n2h": {"d": "hysteric", "scene": ["Câu bạn vừa nói không phải câu bạn định nói. Cả bàn ăn im đi. Bố đặt đũa xuống. Mẹ hỏi chậm, không còn giọng ra lệnh: “Thế… con muốn gì?”"], "read": "Bạn ($) vừa đặt câu hỏi vào đúng mệnh lệnh “đến tuổi thì phải” (S₁): mình muốn, hay chỉ muốn mẹ khỏi buồn? Đây là cấu trúc Cuồng loạn. Câu trả lời nào (S₂) cũng sẽ có vẻ “gần đúng nhưng chưa phải”, vì điều thúc đẩy câu hỏi (a) chưa gọi tên được. Nó chưa phải lời giải, chỉ là chỗ cảnh căng thẳng hở ra.", "choices": [{"t": "“Con chưa biết. Mẹ kể con nghe hồi mẹ lấy bố, mẹ có biết mình muốn gì không?”", "go": "n1a", "fb": "Bạn không vội đưa đáp án mà mời mẹ kể chuyện của chính bà: a ở tác nhân, $ của mẹ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Con không biết. Để con dọn bát rồi nghĩ thêm.”", "go": "eH", "fb": "Bạn để câu hỏi ở lại với mình thay vì lấp nó ngay."}]}, "n1a": {"d": "analyst", "scene": ["Bạn hỏi xong thì im lặng, không giục. Mẹ nhìn mâm cơm một lúc rồi nói, như nói với chính mình: “Hồi mẹ lấy bố con, ai cũng bảo đến tuổi là phải. Mẹ cũng nghe theo thôi.” Bà khựng lại: “Mà thôi, chuyện của mẹ khác, chắc không liên quan.”"], "read": "Bạn giữ chỗ trống (a), mẹ ($) nói và vấp ở một câu. “Ai cũng bảo đến tuổi là phải” là một chữ trồi lên từ lời bà mà bà gạt đi ngay (“chuyện của mẹ khác”): tri thức chưa được thừa nhận (S₂) đang vận hành, và một cái biểu đạt mới (S₁) có thể hình thành quanh nó.", "choices": [{"t": "“Mẹ nói ‘ai cũng bảo đến tuổi là phải’. Mẹ kể con nghe thêm về hồi đó được không?”", "go": "eA", "fb": "Bạn nhắc lại đúng chữ mẹ vừa gạt đi và để bà nói tiếp, không giải thích thay."}, {"t": "“Mẹ đừng nghĩ nhiều. Mẹ với bố sống hạnh phúc mà. Con chỉ hỏi cho biết thôi.”", "go": "eK", "fb": "Bạn trấn an và khép lại bằng một nhận định thay mẹ: tri thức (S₂) quay lại ở vị trí tác nhân. Sơ đồ xoay sang Học thuật."}]}, "eU": {"d": "university", "end": 1, "title": "Một bảng tiến độ, một nỗi lo còn nguyên", "scene": ["Mẹ nhìn bảng tiến độ bạn gõ trên điện thoại, gật đầu: “Ừ, thế thì được.” Cả nhà quay sang chuyện khác. Nhưng đến cuối năm mẹ vẫn hỏi đúng câu cũ, lần này kèm một câu nữa: “Bảng của con đến đâu rồi?”"], "insight": "Lý lẽ và lịch trình (S₂) đã làm đúng việc của chúng: biến một câu hỏi thành một việc có tiến độ. Phần mẹ chưa nói ra, nỗi lo ($), không có ô nào trong bảng nên nó quay lại dưới dạng câu hỏi cũ. Đây là cách diễn ngôn Học thuật vận hành khi nó là diễn ngôn duy nhất: không sai, nhưng nó xử lý vấn đề chứ chưa nghe người nói."}, "eM": {"d": "master", "end": 1, "title": "“Con sẽ đi xem mắt”, và câu hỏi không được hỏi lại", "scene": ["Mẹ dịu xuống, gắp thêm cá cho bạn. Tuần sau bà gửi bạn số điện thoại của “con một người bạn của mẹ”. Bạn đi gặp, lịch sự, về nhà nói “cũng được”. Cả nhà yên tâm, còn bạn không biết mình đang cảm thấy gì."], "insight": "Lệnh được nhận mà không được hỏi lại. Bạn thi hành (S₂), mẹ được yên lòng (a), nhưng nỗi lo của mẹ ($) vẫn chưa được nói, và câu hỏi của chính bạn về điều mình muốn cũng chưa có chỗ. Đi xem mắt không có gì sai; điều đáng chú ý là nó được làm để chấm dứt một cảnh căng thẳng chứ không để trả lời một câu hỏi."}, "eC": {"d": "capitalist", "end": 1, "title": "Một tối vuốt thêm", "scene": ["Bạn vuốt đến khuya. Có ba người nhắn, hai người nhắn lại, một người hẹn cà phê rồi hủy. Sáng hôm sau ứng dụng báo: “Có 12 người mới gần bạn.”"], "insight": "Mỗi lượt vuốt cho một phần dư (a), rồi phần dư ấy làm bạn muốn thêm. Sự thiếu ($) không được lấp mà được dùng làm nhiên liệu, và “tìm người phù hợp nhất” (S₁) biến việc chọn thành việc không bao giờ xong. Kịch bản không nói ứng dụng hẹn hò là sai; nó chỉ cho thấy chỗ vòng khép kín khiến sự thiếu chạy mà không có điểm dừng."}, "eH": {"d": "hysteric", "end": 1, "title": "Câu hỏi đi theo bạn về nhà", "scene": ["Bạn dọn bát, đứng lâu ở bồn rửa. Câu mẹ hỏi, “con muốn gì?”, đi theo bạn suốt tuần. Mỗi lần nghĩ ra một đáp án, bạn lại thấy nó chưa trúng."], "insight": "Mỗi đáp án (S₂) bạn nghĩ ra lại sinh thêm câu hỏi, vì điều thật sự thúc đẩy ham muốn của bạn (a) không nằm trong những đáp án ấy. Đó là cái “không bao giờ đủ” của Cuồng loạn: không phải bệnh, cũng không phải sự thiếu quyết đoán. Nó chính là chỗ câu hỏi “mình muốn gì” còn sống."}, "eA": {"d": "analyst", "end": 1, "title": "Một câu của mẹ", "scene": ["Mẹ im một lúc rồi kể: ngày xưa bà chưa kịp biết mình muốn hay không thì họ hàng đã định ngày. Bà không trách ai, nhưng nhớ rất rõ cảm giác “ai cũng bảo đến tuổi là phải”. Bố lặng lẽ rót thêm trà."], "insight": "Cụm “ai cũng bảo đến tuổi là phải” là một cái biểu đạt-chủ mới (S₁), bật ra từ lời của chính mẹ chứ không do bạn đặt. Nó cho thấy câu “bao giờ con tính chuyện vợ chồng?” có thể đang mang một mệnh lệnh mà bà từng nhận và nay chuyển tiếp, không đơn giản là mong muốn riêng của bà. Nó chưa quyết định chuyện cưới hay không cưới của bạn, chỉ khiến câu hỏi nghe khác đi. Lưu ý: Nhà phân tâm là một vị trí cấu trúc; một câu hỏi mở với cha mẹ không phải liệu pháp, và không phải lời hối thúc nào cũng giấu một câu chuyện như vậy."}, "eK": {"d": "university", "end": 1, "title": "Lời trấn an đúng, câu chuyện lặng đi", "scene": ["Mẹ cười: “Ừ, mẹ với bố vẫn thế.” Bà gắp thêm cá cho bạn. Câu “ai cũng bảo đến tuổi là phải” không ai nhắc lại, và bữa cơm quay về chuyện giá rau."], "insight": "Lời trấn an hợp lý của bạn (S₂) khép lại cánh cửa vừa hé. Mẹ nhận một nhận định thay vì tự nghe lại điều bà vừa nói. Không phải lúc nào cũng sai, nhưng cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra bị bỏ lại."}}, "me": "Con", "alt": [{"n": "Mẹ", "sub": "Cùng bữa cơm ấy, nhưng bạn là mẹ, người mở chuyện. Bạn quyết định nhắc thế nào, và con sẽ đáp theo cách bạn nhắc.", "start": "r0", "nodes": {"r0": {"d": "master", "scene": ["Chiều Chủ nhật, cả nhà ngồi ăn cơm. Bạn là mẹ. Tuần trước bà Hai sang chơi, khoe cháu nội hai đứa, bạn cười theo mà thấy như có gì nghẹn. Con bạn năm nay ba mươi mốt, chưa thấy dẫn ai về.", "Bạn gắp thêm miếng cá vào bát con. Bố húng hắng ho, không nói gì, nhưng cũng không ngăn."], "read": "Bạn đang ở chỗ có thể nói một câu như điều hiển nhiên: “đến tuổi thì phải lập gia đình” (S₁), không kèm lý do, và con bị đặt vào chỗ phải thi hành (S₂). Phía sau là điều bạn ít khi nói ra: nỗi lo của chính bạn ($), về tuổi già, về lời bàn tán của họ hàng. Đây là cấu trúc Chủ nhân, và lần này bạn là người đang cầm lời. Chỗ này không gắn với mẹ hay thế hệ nào: ai nói câu này theo cách này cũng đang đứng ở đó, và điều ấy chưa nói gì về tình thương của họ. Cách bạn mở lời sẽ quyết định con đáp lại bằng giọng nào.", "q": "Bạn mở lời thế nào?", "choices": [{"t": "“Con ba mươi mốt rồi đấy. Bao giờ con tính chuyện vợ chồng? Con nhà bà Hai bằng tuổi con, giờ có hai đứa rồi.”", "go": "r1m", "fb": "Bạn nói như một điều hiển nhiên, không kèm lý do: S₁ đứng ở vị trí tác nhân và con bị đặt vào chỗ phải thi hành. Con đáp lại bằng một lệnh khác. Sơ đồ ở lại Chủ nhân."}, {"t": "“Mẹ tính rồi: ba mươi lăm là khó, mẹ nhờ bà Hai giới thiệu, tháng này con đi xem mắt.”", "go": "r1u", "fb": "Bạn đưa lý do và kế hoạch: tri thức (S₂) đứng ở vị trí tác nhân, con thành đối tượng cần sắp xếp (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Mẹ không ép đâu. Nhưng con nghĩ sao về chuyện vợ chồng, nói mẹ nghe với?”", "go": "r1a", "fb": "Bạn không ra lệnh cũng không đưa kế hoạch, mà hỏi con nghĩ gì và để một khoảng trống: a ở vị trí tác nhân, $ của con được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1m": {"d": "master", "scene": ["Con đặt đũa xuống, giọng gắt hơn thường lệ: “Chuyện của con, con tự lo. Mẹ đừng hỏi nữa.”", "Bố nhìn con, rồi nhìn xuống bát. Cả bàn ăn tĩnh đến mức nghe được tiếng quạt trần."], "read": "Hai mệnh lệnh chạm nhau: “đến tuổi phải lập gia đình” (S₁ của bạn) và “chuyện của con” (S₁ của con). Không bên nào đưa căn cứ. Bạn có thể giữ lệnh bằng công ơn, một cách để S₁ đứng vững khi không có lý do, hoặc nghe câu gắt ấy như một câu hỏi. Dưới cả hai vẫn có hai điều chưa ai nói: nỗi sợ bị bỏ lại của bạn ($), và sự không chắc của con về điều con muốn ($).", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Mẹ hỏi một câu mà con gắt lên. Mẹ nuôi con từng này năm, đâu phải để con nói với mẹ như thế.”", "go": "rM", "fb": "Bạn lấy công ơn làm nền cho lệnh: S₁ đứng vững bằng cách đặt con vào chỗ mắc nợ. Con nhận lệnh để chấm dứt căng thẳng. Sơ đồ ở lại Chủ nhân."}, {"t": "“Mẹ có nói gì quá đâu mà con gắt? Con nghĩ sao thì nói thật mẹ nghe đi.”", "go": "r2h", "fb": "Bạn hạ giọng và hỏi con thật sự nghĩ sao. Con không đáp bằng một lời tuyên bố mà bằng một câu hỏi đặt vào chính mệnh lệnh của bạn. Sơ đồ xoay sang Cuồng loạn."}]}, "r1u": {"d": "university", "scene": ["Con nghe xong, gật gật: “Mẹ tính chi tiết quá. Nhưng nếu con đi xem mắt rồi mà vẫn chưa thấy muốn lập gia đình thì sao ạ?”", "Bạn chưa nghĩ tới trường hợp đó. Bố cúi xuống nhặt hạt cơm rơi."], "read": "Kế hoạch của bạn (S₂) ở vị trí tác nhân, con bị xếp thành một “đối tượng cần sắp xếp” (a). Phía sau vẫn là lệnh chưa ai nói ra (S₁: “đến tuổi thì phải”), nên câu hỏi của con không có ô nào trong kế hoạch: nó chạm vào chỗ bạn chưa nghĩ tới, và cả vào điều bạn chưa nói ($, nỗi lo thật sự của bạn).", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Thì mình thử tiếp, thử đến khi nào hợp. Mẹ sẽ lập danh sách.”", "go": "rU", "fb": "Bạn tiếp tục kế hoạch: S₂ vẫn giữ ghế tác nhân."}, {"t": "“Nghe con hỏi mà mẹ cũng chưa nghĩ ra. Con nói mẹ nghe, con đang nghĩ gì?”", "go": "r2h", "fb": "Bạn dừng kế hoạch và hỏi con nghĩ gì. Con trả lời bằng một câu hỏi đặt vào chính mệnh lệnh “đến tuổi thì phải”. Sơ đồ xoay sang Cuồng loạn."}]}, "r1a": {"d": "analyst", "scene": ["Con im một lúc rồi cười nhẹ: “Con chưa biết, mẹ ạ.” Con nhìn bạn: “Mà mẹ hỏi con thì con hỏi lại: hồi mẹ lấy bố, mẹ có biết mình muốn gì không?”", "Câu hỏi nhẹ như hỏi chuyện thường. Bố ngừng nhai. Bạn nghe tim mình đập chậm lại một nhịp."], "read": "Con giữ chỗ trống (a) và bạn ($) là người được mời nói. Bạn đang ở chỗ mà ở một cảnh khác con bạn có thể đứng: chỗ của người nói mà chưa biết mình sẽ nói ra điều gì. Bạn hỏi để nghe con, và câu hỏi quay lại chạm vào chuyện bạn ít khi nhắc: lúc bằng tuổi con, bạn đã được nghe điều gì?", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Hồi đó mẹ chưa kịp biết mình muốn hay không thì họ hàng đã định ngày. Ai cũng bảo đến tuổi là phải.”", "go": "rA", "fb": "Bạn trả lời thật và nói vấp vào một câu: bạn ($) đang ở chỗ người nói. Sơ đồ ở lại Nhà phân tâm."}, {"t": "“Thôi, chuyện của mẹ khác. Mẹ chỉ lo cho con thôi.”", "go": "rK", "fb": "Bạn gạt câu hỏi bằng một lời trấn an: tri thức (S₂) quay lại ở vị trí tác nhân. Sơ đồ xoay sang Học thuật."}]}, "r2h": {"d": "hysteric", "scene": ["Con im một lúc, rồi nói chậm, như không định nói câu đó: “Con cũng không biết mình có muốn lập gia đình không, hay chỉ muốn mẹ khỏi buồn.”", "Bố đặt đũa xuống. Bạn nhìn con và chợt không biết nên đáp bằng giọng nào."], "read": "Con ($) vừa đặt câu hỏi vào đúng mệnh lệnh “đến tuổi thì phải” (S₁) của bạn: muốn thật, hay chỉ muốn mẹ khỏi buồn? Đây là cấu trúc Cuồng loạn, và bạn đang ở chỗ của S₁ bị chất vấn: người được giả định là biết, nên bị buộc phải sản xuất tri thức (S₂). Câu trả lời nào bạn đưa cũng sẽ có vẻ gần đúng nhưng chưa phải, vì điều thúc đẩy câu hỏi của con (a) chưa gọi tên được. Nó chưa phải lời giải, chỉ là chỗ cảnh căng thẳng hở ra, và bạn quyết định để nó hở thêm hay khép lại.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Mẹ cũng chưa biết trả lời con thế nào. Con kể mẹ nghe, con sợ điều gì?”", "go": "rA2", "fb": "Bạn không vội đưa đáp án mà giữ chỗ trống cho con: a ở vị trí tác nhân, $ của con được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Con muốn yên bề gia thất, mẹ biết mà. Cứ đi xem mắt đi, mẹ lo cho.”", "go": "rM", "fb": "Bạn trả lời thay con bằng một lời tuyên bố: S₁ đứng ở vị trí tác nhân, con phải chấp nhận. Sơ đồ xoay sang Chủ nhân."}, {"t": "“Thôi, con nghĩ nhiều quá. Cứ ăn cơm đi, chuyện đó để từ từ.”", "go": "rK", "fb": "Bạn khép câu hỏi bằng một lời trấn an hợp lý: S₂ quay lại ở vị trí tác nhân. Sơ đồ xoay sang Học thuật."}]}, "rU": {"d": "university", "end": 1, "title": "Một danh sách việc, một nỗi lo còn nguyên", "scene": ["Con nhìn danh sách bạn nhắn qua Zalo, gật đầu: “Dạ, vậy cũng được.” Đến cuối năm bạn vẫn hỏi đúng câu cũ, và con vẫn đáp bằng một bảng tiến độ."], "insight": "Kế hoạch (S₂) làm đúng việc của nó: biến một nỗi lo thành một việc có tiến độ. Phần bạn chưa nói ra ($) không có ô nào trong danh sách nên quay lại dưới dạng câu hỏi cũ. Ở vai mẹ bạn thấy điều khó thấy từ ghế con: người đưa kế hoạch cũng là người không có chỗ để nói nỗi lo của mình."}, "rM": {"d": "master", "end": 1, "title": "“Con cứ đi xem mắt”, và nỗi lo vẫn chưa được nói", "scene": ["Con thở ra, nói “dạ, con sẽ đi xem mắt.” Bạn gắp thêm cá cho con. Cả nhà yên tâm, và bạn chợt nhận ra mình vừa nói đúng câu mà ngày trước người ta từng nói với bạn."], "insight": "Lệnh (S₁) được thi hành mà không được hỏi lại. Bạn có sự yên ổn, nhưng nỗi lo của chính bạn ($) vẫn chưa được nói, và câu hỏi của con cũng chưa có chỗ. Người ra lệnh hôm nay có thể là người nhận lệnh hôm qua: chỗ S₁ không thuộc riêng ai, và bạn vừa trở thành một mắt xích chuyển nó đi tiếp."}, "rK": {"d": "university", "end": 1, "title": "“Con đừng nghĩ nhiều”, và câu hỏi của con lặng đi", "scene": ["Con nhìn bạn một lúc rồi nói “dạ”. Bạn gắp thêm cá. Câu con vừa hỏi không ai nhắc lại, và bữa cơm quay về chuyện giá rau."], "insight": "Lần này bạn là người khép cánh cửa vừa hé bằng một lời trấn an hợp lý. Không phải lúc nào cũng sai, nhưng cái giá là điều con vừa định nói, và điều bạn vừa định nói ($), đều không có chỗ."}, "rA": {"d": "analyst", "end": 1, "title": "Một câu của mẹ", "scene": ["Con ngồi nghe, không giục. Bạn nói chậm rằng ngày xưa bạn chưa kịp biết mình muốn hay không thì họ hàng đã định ngày; bạn không trách ai, nhưng nhớ rất rõ cảm giác “ai cũng bảo đến tuổi là phải”. Bố lặng lẽ rót thêm trà."], "insight": "Cụm “ai cũng bảo đến tuổi là phải” là một cái biểu đạt-chủ mới (S₁) bật ra từ lời của chính bạn, không phải do con đặt. Nó cho thấy câu “bao giờ con tính chuyện vợ chồng?” có thể mang một mệnh lệnh bạn từng nhận và nay chuyển tiếp. Nó chưa quyết định chuyện của con, chỉ khiến câu hỏi nghe khác đi. Lưu ý: Nhà phân tâm là một vị trí cấu trúc; một câu hỏi của con không phải liệu pháp, và không phải lời hối thúc nào cũng giấu một câu chuyện như vậy."}, "rA2": {"d": "analyst", "end": 1, "title": "Con nói điều con chưa nói", "scene": ["Con im một lúc rồi nói: con sợ cưới rồi mới biết mình chưa muốn, mà lúc đó đã khó lùi, và con sợ làm mẹ buồn nếu nói thẳng. Bạn ngạc nhiên vì nghe nhẹ hơn mình tưởng. Bố lặng lẽ rót thêm trà."], "insight": "Khi bạn giữ chỗ trống bằng một câu hỏi thay vì một mệnh lệnh hay một đáp án, con ($) nói được điều nó chưa nói: “sợ làm mẹ buồn” là cái biểu đạt mới (S₁) bật ra từ chính con. Điều này không giải quyết chuyện cưới hỏi, và không phải câu hỏi nào của cha mẹ cũng làm lộ ra điều như vậy."}}}]}, {"id": "dan", "title": "Họp dân về phương án đền bù", "sub": "Bạn có nhà trong diện giải tỏa. Tối nay tổ dân phố họp về phương án bồi thường.", "start": "n0", "nodes": {"n0": {"d": "master", "q": "Bạn đáp thế nào?", "scene": ["Tối thứ Ba, nhà văn hóa tổ dân phố kê kín ghế nhựa. Cán bộ phường đọc xong phương án, đặt tập giấy xuống bàn: “Đây là dự án chung của thành phố, vì lợi ích chung. Phương án đã niêm yết, hôm nay ai đồng ý thì ký biên bản để kịp mốc bàn giao mặt bằng.”", "Một hộ giơ tay hỏi nhỏ: “Căn tái định cư giá bao nhiêu hả anh?” Anh đáp: “Thành phố chưa duyệt đơn giá, có sẽ thông báo.” Rồi anh nhìn cả phòng, chờ."], "read": "“Vì lợi ích chung” là một câu đứng được nhờ chỗ người nói đứng, không cần kèm lý do (S₁); bà con được đặt vào chỗ phải thi hành bằng việc ký (S₂). Phía sau là điều ít khi được nói ra ($): áp lực mốc tiến độ đè lên người làm việc, và phần chưa biết (đơn giá tái định cư chưa duyệt) vẫn bị bỏ lửng. Đây là cấu trúc Chủ nhân. Vị trí này không gắn với cán bộ hay người dân: ai nói “vì lợi ích chung, cứ làm đi” theo cách này cũng đang đứng ở đó, và điều ấy chưa nói gì về thiện chí hay đúng sai của họ.", "choices": [{"t": "“Anh cho tôi xem bảng tính chi tiết: diện tích nào, đơn giá nào, hệ số theo văn bản nào. Tôi đối chiếu từng dòng rồi mới tính chuyện ký.”", "go": "n1u", "fb": "Bạn đáp bằng quy trình và văn bản: tri thức (S₂) đứng ở vị trí tác nhân, còn nỗi lo của bạn bị quy thành một thửa đất có thông số cần đối chiếu (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Tôi không ký. Nhà tôi, tôi không đi đâu hết.”", "go": "n1m", "fb": "Bạn đáp bằng một tuyên bố cắt ngang, không kèm căn cứ: S₁ của bạn đứng ra đối đầu với S₁ của phía bên kia. Sơ đồ vẫn ở Chủ nhân."}, {"t": "“Từ nãy giờ bác Ba ngồi cuối phòng chưa nói câu nào. Bác thấy sao hả bác?”", "go": "n1a", "fb": "Bạn không đưa lý lẽ cũng không đối đầu, mà quay sang mời một người đang im lặng: a ở vị trí tác nhân, $ của bác được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1u": {"d": "university", "scene": ["Anh cán bộ mở bảng tính: “Căn cứ bảng giá đất của thành phố, nhân hệ số điều chỉnh, cộng khoản hỗ trợ ổn định đời sống, tổng cộng đúng như phương án đã niêm yết.” Bạn hỏi hệ số ấy do đâu mà có. “Hệ số do cấp trên xác định, chúng tôi chỉ áp dụng.”", "Ngoài hiên, một người môi giới đang đưa tờ rơi cho vài hộ."], "read": "Văn bản, bảng giá và hệ số (S₂) đứng ở vị trí tác nhân, và các hộ dân thành những thửa đất có thông số (a). Phía sau là quyết định về chủ trương và phạm vi dự án (S₁), nay xuất hiện như “con số hiển nhiên”. Câu “hệ số do cấp trên xác định” cho thấy chỗ giải thích luôn ở một bậc khác với chỗ quyết định. Điều này không có nghĩa bảng tính sai; nó chỉ cho thấy phần không khớp với mẫu, tức nỗi lo của từng hộ ($), chưa có ô nào để điền.", "choices": [{"t": "“Nghe bảo mua đất khu mới bây giờ đang lên giá. Anh môi giới kia nói có suất sớm, để tôi ra nghe thử.”", "go": "n2c", "fb": "Bạn chuyển khoản bồi thường chưa nhận thành vốn cho một vòng mới: sự bất an ($) đi thẳng tới khẩu hiệu “đón đầu, đừng bỏ lỡ” (S₁). Sơ đồ xoay sang Tư bản."}, {"t": "“Tôi hiểu các anh làm theo bảng. Nhưng từ nãy bác Ba chưa nói gì, bác có điều gì lo không ạ?”", "go": "n1a", "fb": "Bạn dừng việc đối chiếu số liệu và mời một người đang im lặng nói: a ở vị trí tác nhân, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Vậy cho tôi xin bản sao phương án, về tôi đối chiếu, tuần sau tôi góp ý bằng văn bản.”", "go": "eU", "fb": "Bạn chọn kênh văn bản: tri thức (S₂) tiếp tục ở vị trí tác nhân, và ý kiến của bạn sẽ đi qua một biểu mẫu."}]}, "n1m": {"d": "master", "scene": ["Anh cán bộ vẫn giữ giọng mềm nhưng chắc: “Đây là dự án chung của thành phố, một hộ chưa bàn giao thì cả đoạn không thi công được. Anh chị suy nghĩ lại; nếu không thì theo quy định còn các bước tiếp theo.”", "Cả phòng nhìn bạn. Vài hộ nhìn đi chỗ khác."], "read": "Hai mệnh lệnh chạm nhau: “vì lợi ích chung” (S₁ của phía cán bộ) và “nhà tôi, tôi không đi” (S₁ của bạn). Không bên nào đưa căn cứ; mỗi bên viện đến chỗ mình đứng. Bên dưới có hai điều chưa ai nói: áp lực mốc bàn giao đè lên người làm việc ($ của họ), và nỗi bất an không biết sẽ ở đâu, sống ra sao ($ của bạn).", "choices": [{"t": "“Thôi được, tôi ký. Mong các anh tính cho đúng.”", "go": "eM", "fb": "Bạn nhận lệnh để chấm dứt căng thẳng: S₂ của bạn bắt đầu làm việc cho S₁ của phía bên kia."}, {"t": "“Anh nói ‘lợi ích chung’. Lợi ích chung ấy ai tính, và nhà tôi nằm ở chỗ nào trong đó?”", "go": "n2h", "fb": "Bạn không từ chối cũng không nhận lệnh, mà đặt câu hỏi vào đúng cụm từ đang làm nền cho mệnh lệnh: $ ở vị trí tác nhân, S₁ bị đòi căn cứ. Sơ đồ xoay sang Cuồng loạn."}]}, "n2c": {"d": "capitalist", "scene": ["Ngoài hiên, anh môi giới đưa bạn tờ rơi: “Khu mới sát tuyến đường, nghe nói sắp có quy hoạch, giá tháng sau là khác. Bên em còn ba suất, anh chị nhận đền bù xong là kịp.” Nhóm Zalo của tổ dân phố nhảy liên tục mấy tin: “Lô A vừa nhích giá”, “Còn hai suất”. Điện thoại trong túi bạn rung không ngớt."], "read": "Cảm giác bất an ($) tìm thẳng tới khẩu hiệu “đón đầu, đừng bỏ lỡ” (S₁); bộ máy tin đồn, bảng giá và nhóm chat (S₂) chạy mà không ai đứng ra chịu trách nhiệm, và mỗi lô đất được rao là một phần dư vừa đủ hấp dẫn (a) để nghĩ tới lô tiếp theo. Tiền chưa nhận đã được tính trước vào một vòng mới: $ → S₁ → S₂ → a → $, không có chỗ dừng. Kịch bản không nói mua đất hay làm môi giới là xấu; nó chỉ cho thấy cách một vòng khép kín biến nỗi lo mất chỗ ở thành nhiên liệu.", "choices": [{"t": "“Cho tôi giữ một suất. Chưa nhận tiền thì đặt cọc trước được không?”", "go": "eC", "fb": "Bạn để vòng chạy tiếp."}, {"t": "“Khoan đã. Tôi muốn nghe bác Ba nói trước khi tính chuyện mua bán.”", "go": "n1a", "fb": "Bạn ngắt vòng bằng cách quay lại nghe một người đang im lặng. Sơ đồ xoay sang Nhà phân tâm."}]}, "n2h": {"d": "hysteric", "scene": ["Anh cán bộ khựng lại, nhìn sang người cầm hồ sơ bên cạnh. Một lúc sau anh nói: “Câu này tôi ghi nhận và báo cáo Hội đồng. Có thể sẽ phải đối thoại thêm.” Ông tổ trưởng húng hắng ho. Hai hộ phía sau thì thầm: “Ừ, hỏi vậy đúng đấy.”"], "read": "Bạn ($) hỏi thẳng vào cụm “lợi ích chung” (S₁) và đòi nó đưa căn cứ (S₂). Câu hỏi không đòi một con số cụ thể; nó thử xem mệnh lệnh đứng trên cái gì, và phía bên kia buộc phải sản xuất thêm tri thức (giải trình, đối thoại) thay vì lặp lại mệnh lệnh. Đây là cấu trúc Cuồng loạn. Nó không có nghĩa bạn đúng hay phía bên kia sai, và điều thúc đẩy câu hỏi (a) có thể không nằm trong câu trả lời nào sắp được đưa ra.", "choices": [{"t": "“Vậy nhờ các anh ghi câu hỏi của tôi vào biên bản và hẹn ngày đối thoại bằng văn bản.”", "go": "eH", "fb": "Bạn biến câu hỏi thành một yêu cầu được ghi lại thay vì để nó trôi theo không khí cuộc họp."}, {"t": "“Trước khi đối thoại, tôi muốn nghe bà con mình nói. Bác Ba, bác thấy sao ạ?”", "go": "n1a", "fb": "Bạn chuyển câu hỏi từ phía cán bộ sang người đang im lặng: a ở tác nhân, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1a": {"d": "analyst", "scene": ["Bạn hỏi xong thì im lặng, không giục. Bác Ba ngồi ở cuối phòng, nhìn tờ phương án một lúc rồi nói chậm: “Tôi có ý kiến gì đâu. Tiền thì họ tính cả rồi. Chỉ là cái nhà này ông nhà tôi tự tay xây từng viên gạch…” Bác dừng lại: “Mà thôi, nhà thì cũng tính bằng mét vuông, nói làm gì.”"], "read": "Bạn giữ chỗ trống (a), bác Ba ($) nói và vấp ở một câu. “Tự tay xây” là một chữ trồi lên từ lời bác rồi bị bác gạt đi ngay (“tính bằng mét vuông, nói làm gì”): tri thức chưa được thừa nhận (S₂) đang vận hành, và một cái biểu đạt mới (S₁) có thể hình thành quanh nó.", "choices": [{"t": "“Bác nói ‘tự tay xây’. Bác kể thêm về căn nhà được không ạ?”", "go": "eA", "fb": "Bạn nhắc lại đúng chữ bác vừa gạt đi và để bác nói tiếp, không giải thích thay."}, {"t": "“Bác yên tâm, họ tính theo luật rồi. Có tiền là mua được nhà mới thôi mà.”", "go": "eK", "fb": "Bạn trấn an và khép lại bằng một nhận định thay bác: tri thức (S₂) quay lại ở vị trí tác nhân. Sơ đồ xoay sang Học thuật."}]}, "eU": {"d": "university", "end": 1, "title": "Đúng quy trình, câu hỏi nằm ngoài biểu mẫu", "scene": ["Biên bản ghi gọn: “Hộ xin sao phương án, sẽ góp ý bằng văn bản.” Tuần sau bạn nộp một trang ý kiến, nhận lại phiếu tiếp nhận và lời hẹn giải trình. Bác Ba ký vào biên bản như mọi người, không nói thêm gì."], "insight": "Kênh văn bản có ích thật: nó cho ý kiến một chỗ để được ghi nhận và phải có giải trình. Cái giá là chỉ phần nói được thành mục (diện tích, loại đất, hệ số) mới có ô để điền (S₂), còn nỗi lo chưa thành lời ($) như mất xóm, mất chỗ ở thì không có ô nào, nên bác Ba ký mà chưa ai nghe. Đây là cách diễn ngôn Học thuật vận hành khi nó là diễn ngôn duy nhất. Kịch bản không nói phương án đúng hay sai."}, "eM": {"d": "master", "end": 1, "title": "“Ký cho xong”, và câu hỏi không được hỏi lại", "scene": ["Bạn ký. Biên bản ghi “đa số hộ đồng thuận”. Ít hôm sau bạn nhận thông báo kiểm đếm, mọi việc đúng tiến độ. Tối đó bạn ngồi ở bậc thềm nhìn căn nhà, không rõ mình đang thấy gì."], "insight": "Mệnh lệnh có hiệu lực vì đứng ở chỗ quyền, không phải vì đã được giải thích. Bạn thi hành (S₂), mặt bằng được bàn giao (a), còn áp lực tiến độ của người làm việc ($) lẫn nỗi bất an của bạn ($) đều chưa được nói. Ký không sai, và “đồng thuận” cũng có thể là thật; điều đáng chú ý là chữ ấy được ghi vào biên bản trước khi ai kịp nói điều mình lo."}, "eC": {"d": "capitalist", "end": 1, "title": "Một suất đón đầu", "scene": ["Bạn đặt cọc một suất, tiền đền bù chưa về nhưng đã được tiêu. Tuần sau có tin mới: lô khác lên giá, còn lô của bạn chưa có hướng. Trong nhóm Zalo người ta đã bàn sang lô kế tiếp."], "insight": "Khoản bồi thường chưa nhận đã thành vốn cho vòng tiếp theo: mỗi lô là một phần dư (a), và phần dư ấy làm bạn muốn thêm. Nỗi lo mất chỗ ở ($) không được nghe mà được dùng làm nhiên liệu cho khẩu hiệu “đón đầu” (S₁). Kịch bản không nói mua bán đất là sai, chỉ cho thấy chỗ vòng khép kín chạy mà không có điểm dừng."}, "eH": {"d": "hysteric", "end": 1, "title": "Một câu hỏi được ghi vào biên bản", "scene": ["Biên bản ghi: “Hộ đề nghị giải trình căn cứ tính và hẹn đối thoại.” Hai tuần sau buổi đối thoại có thêm tài liệu, bạn đọc xong lại có thêm một câu: ai quyết định phạm vi của tuyến này? Câu hỏi ấy chưa có ô nào để hỏi."], "insight": "Mỗi lời giải trình (S₂) lại sinh thêm một câu hỏi, vì điều thúc đẩy câu hỏi của bạn (a) không nằm trọn trong câu trả lời nào. Đó là cái “không bao giờ đủ” của Cuồng loạn: không phải sự ngang bướng, cũng không bảo đảm kết quả bạn mong. Nó là cách một quyết định buộc phải nói ra căn cứ của mình, và cũng làm cuộc đối thoại kéo dài, một cái giá có thật với cả hai phía."}, "eA": {"d": "analyst", "end": 1, "title": "Một chữ không có ô trong bảng", "scene": ["Bác Ba im một lúc rồi kể: ông nhà bác xây căn nhà ấy từng đợt, mỗi đợt dành dụm xong mới xây thêm một gian, và ngõ này ai cũng biết bác là “bà Ba nhà cuối ngõ”. Bác không nói sẽ ký hay không. Ông tổ trưởng lặng lẽ rót thêm nước cho bác."], "insight": "Cụm “tự tay xây” là một cái biểu đạt-chủ mới (S₁), bật ra từ lời của chính bác Ba chứ không do bạn đặt. Nó chỉ ra phần không có ô trong bảng tính: giá trị của căn nhà với người đã sống trong đó không đồng nhất với số mét vuông. Nó không phải lý do để từ chối hay chấp nhận phương án, chỉ khiến cuộc họp nghe được điều trước đó không có chỗ để nói. Lưu ý: Nhà phân tâm là một vị trí cấu trúc; một câu hỏi mở trong cuộc họp dân không thay được đối thoại, giải trình hay pháp lý, và không phải lúc nào cũng làm lộ ra một câu chuyện như vậy."}, "eK": {"d": "university", "end": 1, "title": "Lời trấn an đúng, câu chuyện lặng đi", "scene": ["Bác Ba cười gượng: “Ừ, chắc vậy.” Chuyện “tự tay xây” không ai nhắc lại, và cuộc họp quay về chuyện ngày kiểm đếm."], "insight": "Lời trấn an hợp lý của bạn (S₂) khép lại cánh cửa vừa hé. Bác Ba nhận một nhận định thay vì tự nghe lại điều bác vừa nói. Không phải lúc nào cũng sai, nhưng cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra bị bỏ lại ngoài biên bản."}}, "me": "Người dân", "alt": [{"n": "Cán bộ phường", "sub": "Cùng buổi họp, nhưng bạn là cán bộ phường, người đọc phương án. Mốc bàn giao còn hai tuần, và bạn phải quyết định nói với bà con thế nào.", "start": "r0", "nodes": {"r0": {"d": "master", "scene": ["Tối thứ Ba, nhà văn hóa tổ dân phố kê kín ghế nhựa. Bạn là cán bộ phường. Mốc bàn giao mặt bằng còn hai tuần, sáng nay lãnh đạo phường nhắc bạn thêm lần nữa, và sau buổi họp này bạn còn phải báo cáo.", "Bạn vừa đọc xong phương án bồi thường. Một hộ giơ tay hỏi nhỏ: “Căn tái định cư giá bao nhiêu hả anh?” Bạn biết thành phố chưa duyệt đơn giá. Cả phòng nhìn bạn, chờ."], "read": "Bạn đang ở chỗ có thể nói “vì lợi ích chung”, một câu đứng được nhờ chỗ bạn đứng và không cần kèm lý do (S₁); bà con được đặt vào chỗ phải thi hành bằng việc ký (S₂). Phía sau là điều ít khi được nói ra ($): áp lực mốc tiến độ đè lên chính bạn, và phần chưa biết (đơn giá chưa duyệt) vẫn bị bỏ lửng. Đây là cấu trúc Chủ nhân, và lần này bạn là người đang cầm lời. Chỗ này không gắn với cán bộ hay người dân: ai nói “vì lợi ích chung, cứ làm đi” theo cách này cũng đang đứng ở đó, và điều ấy chưa nói gì về thiện chí hay đúng sai của họ.", "q": "Bạn nói với bà con thế nào?", "choices": [{"t": "“Đây là dự án chung của thành phố, vì lợi ích chung. Phương án đã niêm yết, hôm nay ai đồng ý thì ký biên bản để kịp mốc bàn giao.”", "go": "r1h", "fb": "Bạn nói như một điều hiển nhiên, không kèm căn cứ: S₁ đứng ở vị trí tác nhân, bà con được đặt vào chỗ phải ký. Một hộ đứng lên hỏi thẳng vào chữ “lợi ích chung”. Sơ đồ xoay sang Cuồng loạn."}, {"t": "“Mời bà con xem bảng tính: diện tích, đơn giá đất, hệ số, theo văn bản của thành phố. Ai thắc mắc dòng nào tôi giải thích dòng đó.”", "go": "r1u", "fb": "Bạn đáp bằng văn bản và con số: tri thức (S₂) đứng ở vị trí tác nhân, các hộ thành những thửa đất có thông số (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Căn tái định cư thì thành phố chưa duyệt giá, tôi không dám nói bừa. Trước khi bàn tiếp, bà con còn ai lo điều gì chưa nói được không? Cứ nói, tôi ghi lại.”", "go": "r1a", "fb": "Bạn nhận chỗ chưa biết thay vì lấp nó, rồi mời bà con nói: a ở vị trí tác nhân, $ của bà con được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1h": {"d": "hysteric", "scene": ["Một hộ đứng lên, giọng không to nhưng cả phòng nghe rõ: “Anh nói ‘lợi ích chung’. Lợi ích chung ấy ai tính, và nhà tôi nằm ở chỗ nào trong đó?”", "Hai hộ phía sau thì thầm: “Ừ, hỏi vậy đúng đấy.” Ông tổ trưởng húng hắng ho."], "read": "Một hộ ($) hỏi thẳng vào cụm “lợi ích chung” (S₁) và đòi nó đưa căn cứ (S₂). Câu hỏi không đòi một con số cụ thể; nó thử xem mệnh lệnh đứng trên cái gì. Bạn đang ở chỗ bị hỏi, chỗ của người được giả định biết câu trả lời, trong khi chính bạn cũng chỉ áp dụng một phương án mình không đặt ra. Đây là cấu trúc Cuồng loạn. Nó không có nghĩa họ đúng hay bạn sai.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Phương án đã niêm yết, đã qua các bước theo quy định. Nếu không ký thì còn các bước tiếp theo.”", "go": "r2m", "fb": "Bạn lấy quy định làm nền cho lệnh và nhắc đến hậu quả: S₁ đứng ở vị trí tác nhân mà vẫn không đưa căn cứ. Sơ đồ xoay sang Chủ nhân."}, {"t": "“Anh nói đúng, tôi chưa trả lời câu anh hỏi. Tôi sẽ ghi lại, báo cáo và hẹn một buổi đối thoại.”", "go": "rH", "fb": "Bạn nhận câu hỏi và hẹn đối thoại: người bị hỏi buộc phải nói ra căn cứ của mình. Sơ đồ ở lại Cuồng loạn."}, {"t": "“Câu này tôi ghi nhận. Nhưng còn ai lo điều gì chưa nói được không? Cứ nói, tôi nghe.”", "go": "r1a", "fb": "Bạn không đưa căn cứ ngay mà mở chỗ trống cho cả phòng: a ở vị trí tác nhân, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "r2m": {"d": "master", "scene": ["Hộ ấy không ngồi xuống. Giọng anh run: “Anh nói ‘các bước tiếp theo’. Thế là không ai nghe tôi hỏi gì à?”", "Vài hộ nhìn đi chỗ khác. Bạn thấy tay mình đang nắm chặt tập giấy."], "read": "Bạn dùng quy định làm nền cho lệnh để S₁ đứng vững khi không có lý do. Hộ ấy ($) chỉ ra chỗ hở: câu hỏi chưa được trả lời, chỉ được thay bằng một lời nhắc về hậu quả. Và phía sau, chính bạn cũng đang bị một mệnh lệnh khác đè lên ($): mốc bàn giao, báo cáo cuối tuần.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Tôi chỉ nói theo quy định. Ai không ký thì theo quy định mà xử lý.”", "go": "rM", "fb": "Bạn nhắc lại quy định như một lời không kèm lý do: S₁ đứng ở vị trí tác nhân, người đối diện phải chấp nhận. Sơ đồ ở lại Chủ nhân."}, {"t": "“Anh nói đúng, tôi chưa trả lời anh. Để tôi báo cáo lên phường và hẹn một buổi đối thoại riêng.”", "go": "rH", "fb": "Bạn nhận câu hỏi và hẹn đối thoại: người ra lệnh buộc phải nói ra căn cứ của mình. Sơ đồ xoay sang Cuồng loạn."}]}, "r1u": {"d": "university", "scene": ["Bạn mở bảng tính: “Căn cứ bảng giá đất của thành phố, nhân hệ số điều chỉnh, cộng khoản hỗ trợ ổn định đời sống, tổng cộng đúng như phương án đã niêm yết.” Hộ ấy hỏi hệ số do đâu mà có. Bạn đáp: “Hệ số do cấp trên xác định, chúng tôi chỉ áp dụng.” Có tiếng thì thầm: “Thế ai chịu trách nhiệm?”", "Ngoài hiên, một người môi giới đang đưa tờ rơi cho vài hộ."], "read": "Văn bản và bảng giá (S₂) ở vị trí tác nhân, các hộ thành những thửa đất có thông số (a). Phía sau là quyết định về chủ trương (S₁) mà chính bạn cũng không quyết, nay xuất hiện như “con số hiển nhiên”. Bạn đứng ở chỗ trung gian: nói thay một mệnh lệnh mình không phải người ra. Bảng tính không sai; chỉ là phần không khớp với mẫu, tức nỗi lo của từng hộ ($), chưa có ô nào để điền.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Tôi xin ghi ý kiến của hộ vào biên bản và hẹn giải trình bằng văn bản.”", "go": "rU", "fb": "Bạn dùng kênh văn bản: S₂ vẫn giữ ghế tác nhân, và ý kiến của bà con sẽ đi qua một biểu mẫu."}, {"t": "“Tôi chỉ áp dụng được, nhưng tôi thấy bà con còn điều chưa nói được. Ai muốn nói thêm cứ nói.”", "go": "r1a", "fb": "Bạn thừa nhận giới hạn của mình và mở chỗ trống: a ở vị trí tác nhân, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1a": {"d": "analyst", "scene": ["Bạn nói xong thì im lặng, không giục. Cả phòng nhìn nhau. Bác Ba ở cuối phòng nhìn tờ phương án một lúc rồi nói chậm: “Tôi có ý kiến gì đâu. Tiền thì họ tính cả rồi. Chỉ là cái nhà này ông nhà tôi tự tay xây từng viên gạch…” Bác dừng lại: “Mà thôi, nhà thì cũng tính bằng mét vuông, nói làm gì.”"], "read": "Bạn giữ chỗ trống (a), bác Ba ($) nói và vấp ở một câu. “Tự tay xây” trồi lên rồi bị bác gạt đi ngay: tri thức chưa được thừa nhận (S₂) đang vận hành, và một cái biểu đạt mới (S₁) có thể bật ra. Một cán bộ ở chỗ của người nghe, không phải chỗ của người ra lệnh: đó là chỗ trống, không phải chức vụ.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Bác nói ‘tự tay xây’. Bác kể thêm về căn nhà được không ạ?”", "go": "rA", "fb": "Bạn giữ lại đúng chữ bác vừa gạt đi và để bác nói tiếp, không giải thích thay."}, {"t": "“Bác yên tâm, phương án tính theo đúng luật rồi. Có tiền là mua được nhà mới.”", "go": "rK", "fb": "Bạn trấn an bằng một nhận định đúng lý: S₂ khép cánh cửa vừa hé. Sơ đồ xoay sang Học thuật."}]}, "rU": {"d": "university", "end": 1, "title": "Đúng quy trình, câu hỏi nằm ngoài biểu mẫu", "scene": ["Bạn ghi vào biên bản: “Hộ đề nghị giải trình căn cứ tính.” Tuần sau bạn gửi bản giải trình đúng hạn. Cuối buổi, bác Ba ký như mọi người, không nói thêm gì."], "insight": "Kênh văn bản có ích thật: nó cho ý kiến một chỗ được ghi nhận. Cái giá là chỉ phần nói được thành mục mới có ô để điền (S₂), còn nỗi lo chưa thành lời ($) thì không, nên bác Ba ký mà chưa ai nghe. Lần này bạn là người cầm biểu mẫu: người ở chỗ S₂ nhiều khi không phải người muốn như vậy mà chỉ là người có biểu mẫu trong tay. Kịch bản không nói phương án đúng hay sai."}, "rM": {"d": "master", "end": 1, "title": "“Theo quy định”, và câu hỏi không được trả lời", "scene": ["Hộ ấy ngồi xuống, im lặng. Biên bản ghi “đa số hộ đồng thuận”. Việc đúng tiến độ, còn bạn về nhà với cảm giác nhẹ vì mốc đã giữ được và khó chịu vì chưa rõ vì sao."], "insight": "Mệnh lệnh (S₁) có hiệu lực vì đứng ở chỗ quyền, không vì đã được giải thích. Mặt bằng được bàn giao (a), nhưng áp lực tiến độ của bạn ($) và nỗi bất an của hộ dân đều chưa được nói. Viện đến quy định không sai; điều đáng chú ý là nó được dùng thay cho một câu trả lời."}, "rH": {"d": "hysteric", "end": 1, "title": "Một câu hỏi được ghi vào biên bản", "scene": ["Biên bản ghi: “Hộ đề nghị giải trình căn cứ và hẹn đối thoại.” Hai tuần sau buổi đối thoại có thêm tài liệu, nhưng hộ ấy lại có thêm một câu: ai quyết định phạm vi của tuyến này? Bạn nhận ra câu đó cũng không thuộc quyền bạn trả lời."], "insight": "Mỗi lời giải trình (S₂) sinh thêm một câu hỏi, vì điều thúc đẩy câu hỏi của hộ dân (a) không nằm trọn trong câu trả lời nào. Đó là cái “không bao giờ đủ” của Cuồng loạn, và ở đây nó buộc một quyết định phải nói ra căn cứ của mình. Nó cũng kéo dài tiến trình, một cái giá có thật với cả hai phía, và không bảo đảm kết quả."}, "rA": {"d": "analyst", "end": 1, "title": "Một chữ không có ô trong bảng", "scene": ["Bác Ba nói thêm: ông nhà bác xây căn nhà ấy từng đợt, mỗi đợt dành dụm xong mới xây thêm một gian. Bạn ghi cụm “tự tay xây” vào sổ riêng, không phải vào mục nào của biểu mẫu. Bác không nói sẽ ký hay không. Cuộc họp chậm lại hai mươi phút."], "insight": "“Tự tay xây” là một cái biểu đạt-chủ mới (S₁) bật ra từ lời của chính bác Ba. Nó chỉ ra phần không có ô trong bảng tính. Việc nghe không thay được giải trình, đối thoại hay pháp lý, và mốc tiến độ vẫn còn đó. Lưu ý: Nhà phân tâm là một vị trí cấu trúc; một cán bộ biết lắng nghe không phải nhà phân tâm."}, "rK": {"d": "university", "end": 1, "title": "Lời trấn an đúng, câu chuyện lặng đi", "scene": ["Bác Ba cười gượng: “Ừ, chắc vậy.” Chuyện “tự tay xây” không ai nhắc lại, và cuộc họp quay về ngày kiểm đếm."], "insight": "Lời trấn an hợp lý của bạn (S₂) khép lại cánh cửa vừa hé. Bác Ba nhận một nhận định thay vì tự nghe lại điều bác vừa nói. Cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra bị bỏ ngoài biên bản."}}}, {"n": "Bác Ba", "sub": "Cùng buổi họp, nhưng bạn là bác Ba, người ngồi cuối phòng chưa nói gì. Cây bút ký đang chuyền về phía bạn.", "start": "r0", "nodes": {"r0": {"d": "master", "scene": ["Tối thứ Ba, nhà văn hóa tổ dân phố kê kín ghế nhựa. Bạn là bác Ba, ngồi ở cuối phòng, nhà bạn trong diện giải tỏa. Cán bộ phường vừa đọc xong phương án và nói “vì lợi ích chung, ai đồng ý thì ký biên bản”. Từ đầu buổi bạn chưa nói gì.", "Tập biên bản và cây bút chuyền từ hàng ghế trên xuống. Người hàng xóm ngồi cạnh liếc nhìn bạn, chờ xem bác tính sao. Trong đầu bạn là căn nhà ông nhà bạn đã xây từng đợt suốt mấy chục năm."], "read": "Lệnh “ký đi” (S₁) chuyền xuống đến bạn, và bạn đang ở chỗ nhận (S₂). Điều bạn đang nghĩ ($, căn nhà do chồng bạn tự tay xây) chưa có chỗ nào trong cuộc họp, vì cuộc trao đổi nãy giờ diễn ra giữa cán bộ và vài hộ, còn bạn ngồi ngoài. Chỗ này không gắn với tuổi hay giới tính: ai ngồi ngoài cuộc nói chuyện cũng đang đứng ở đó. Bạn có thể thi hành, ra lệnh lại, hỏi bằng con số, hoặc nói điều đang nghĩ.", "q": "Bạn làm gì?", "choices": [{"t": "Cầm bút ký luôn, nói nhỏ: “Ký sớm cho người ta về, mai còn đi chợ.”", "go": "rM", "fb": "Bạn nhận lệnh và thi hành ngay: S₂ làm việc cho S₁ và không ai phải hỏi gì. Sơ đồ ở lại Chủ nhân."}, {"t": "“Mấy đứa trẻ biết gì. Bác ở tổ này lâu nhất, bác bảo cứ ký đi cho xong, đừng làm khó cán bộ.”", "go": "r1m", "fb": "Bạn nói bằng chỗ của người lớn tuổi, không kèm lý do: S₁ đứng ở vị trí tác nhân, và bà con quanh bạn thành người thi hành. Sơ đồ ở lại Chủ nhân."}, {"t": "Giơ tay: “Cho tôi hỏi, nhà tôi tính ra bao nhiêu? Cái hệ số này ở đâu ra vậy anh?”", "go": "r1u", "fb": "Bạn hỏi bằng con số và văn bản: bạn đang dùng ngôn ngữ của S₂ để nói về căn nhà, và phía bên kia đáp bằng bảng tính. Sơ đồ xoay sang Học thuật."}, {"t": "Nói nhỏ với người ngồi cạnh: “Cái nhà này ông nhà tôi tự tay xây từng viên gạch… Mà thôi, nhà thì cũng tính bằng mét vuông, nói làm gì.”", "go": "r1a", "fb": "Bạn để một chữ trồi lên rồi gạt nó đi ngay. Người ngồi cạnh nghe thấy và giữ lại chỗ trống: a ở vị trí tác nhân, $ của bạn được mời nói tiếp. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1m": {"d": "master", "scene": ["Cả phòng im. Vài hộ gật đầu như được bác cho phép, vài hộ nhìn xuống. Người hàng xóm nói nhỏ: “Dạ, bác bảo vậy thì cháu ký.” Giọng anh không còn hỏi nữa."], "read": "Lời bạn (S₁) đứng được nhờ chỗ bạn ngồi: người lớn tuổi nhất tổ, không cần lý do. Cả phòng thi hành (S₂). Nhưng chính bạn vừa chuyển từ người nhận lệnh sang người ra lệnh, và điều bạn mang trong lòng ($, căn nhà do chồng bạn tự tay xây) bị che đi bằng giọng chắc chắn.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Ừ, ký cho xong. Mai còn đi chợ sớm.”", "go": "rM", "fb": "Bạn khép lại bằng một lời không kèm lý do: S₁ giữ ghế tác nhân. Sơ đồ ở lại Chủ nhân."}, {"t": "“…Khoan. Bác nói thế mà trong bụng bác không yên. Để bác nói thật.”", "go": "r1a", "fb": "Bạn bỏ giọng ra lệnh và nói từ chỗ $. Người hàng xóm quay lại nghe. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1u": {"d": "university", "scene": ["Cán bộ mở bảng tính, đọc chậm: “Căn cứ bảng giá đất của thành phố, nhân hệ số điều chỉnh, cộng khoản hỗ trợ, tổng cộng đúng như phương án đã niêm yết.” Bạn hỏi hệ số do đâu mà có, anh đáp: “Hệ số do cấp trên xác định, chúng tôi chỉ áp dụng.”", "Người hàng xóm ngồi cạnh nghiêng sang, nói nhỏ cho bạn yên tâm: “Bác yên tâm, họ tính theo luật rồi. Có tiền là mua được nhà mới thôi mà.”"], "read": "Văn bản và bảng giá (S₂) ở vị trí tác nhân, bạn thành một thửa đất có thông số (a). Người hàng xóm trấn an bằng một nhận định đúng lý, cũng là S₂. Điều bạn vừa hỏi (“nhà tôi tính ra bao nhiêu”) được trả lời đúng ở mặt số, nhưng điều bạn chưa hỏi ($, căn nhà do chồng bạn tự tay xây) không có ô nào trong bảng.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Ừ, chắc vậy. Chú nói đúng.”", "go": "rK", "fb": "Bạn nhận lời trấn an: tri thức (S₂) giữ ghế tác nhân. Sơ đồ ở lại Học thuật."}, {"t": "“Chú nói chuyện tiền. Nhưng cái nhà này ông nhà tôi tự tay xây từng viên gạch…”", "go": "r1a", "fb": "Bạn quay lại điều vừa gạt đi và để nó nói ra một nửa. Người hàng xóm im lại nghe. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Cho tôi xin bản sao phương án, về tôi nhờ thằng cháu đọc lại cho kỹ.”", "go": "rU", "fb": "Bạn chọn kênh văn bản: S₂ tiếp tục ở vị trí tác nhân, và nỗi lo của bạn sẽ đi qua một biểu mẫu. Sơ đồ ở lại Học thuật."}]}, "r1a": {"d": "analyst", "scene": ["Người hàng xóm quay lại, nghe, không ngắt lời. Anh hỏi nhỏ: “Bác nói đi bác, về căn nhà ấy. Cháu nghe.”", "Hàng ghế cuối chợt yên, dù ở phía trên cán bộ vẫn đang nói."], "read": "Người hàng xóm giữ chỗ trống (a), bạn ($) nói và có thể vấp ở một câu. “Tự tay xây” trồi lên rồi dễ bị gạt đi ngay: tri thức chưa được thừa nhận (S₂) đang vận hành, và một cái biểu đạt mới (S₁) có thể bật ra. Chỗ này không do bạn có chức vụ, mà do có người dành cho bạn một khoảng trống.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Ông nhà tôi xây từng đợt, dành dụm xong mới xây thêm một gian…”", "go": "rA", "fb": "Bạn nói tiếp từ chữ vừa trồi lên. Sơ đồ ở lại Nhà phân tâm."}, {"t": "“Thôi, không có gì đâu. Chú cứ lo việc của chú.”", "go": "rK", "fb": "Bạn gạt chữ ấy thêm một lần nữa: cánh cửa khép lại. Sơ đồ xoay sang Học thuật."}]}, "rM": {"d": "master", "end": 1, "title": "“Ký cho xong”, và điều bác không nói", "scene": ["Bạn ký. Thấy bác ký, mấy hộ quanh đó cũng ký theo. Biên bản ghi “đa số hộ đồng thuận”. Tối đó bạn ngồi ở bậc thềm nhìn căn nhà, không rõ mình đang thấy gì."], "insight": "Chữ ký của bạn (S₂ thi hành) kéo theo cả hàng ghế: người vừa ngồi im ở chỗ $ lại có lúc ngồi ở chỗ S₁, vì ở tổ này bác ký là người ta ký. Chỗ ra lệnh không thuộc riêng cán bộ. Điều bạn mang trong lòng ($, căn nhà do chồng bạn tự tay xây) vẫn chưa được nói. Ký không sai, và “đồng thuận” cũng có thể là thật; điều đáng chú ý là chữ ấy được ghi vào biên bản trước khi ai kịp hỏi bạn một câu."}, "rU": {"d": "university", "end": 1, "title": "Về nhờ cháu đọc, và căn nhà không có ô nào", "scene": ["Cán bộ đưa bạn một bản sao phương án. Tối đó thằng cháu ngồi đọc cho bạn nghe: diện tích, đơn giá, hệ số, khoản hỗ trợ. Nó tính rất kỹ, bảo “cũng đúng cả bà ạ”. Hôm sau bạn ký vào biên bản như mọi người, không nói thêm gì."], "insight": "Kênh văn bản có ích thật: bạn có một bản để đối chiếu và có người đọc giúp. Cái giá là chỉ phần nói được thành mục (diện tích, loại đất, hệ số) mới có ô để điền (S₂), còn điều bạn chưa nói được ($), như căn nhà do chồng bạn tự tay xây, thì không có ô nào, nên bạn ký mà chưa ai nghe. Ở vai bác Ba bạn thấy điều mà người cầm biểu mẫu khó thấy: người nằm trong biểu mẫu cũng có thể thấy mình chỉ còn là một dòng số."}, "rK": {"d": "university", "end": 1, "title": "Lời trấn an đúng, câu chuyện lặng đi", "scene": ["Bạn cười gượng: “Ừ, chắc vậy.” Chuyện căn nhà không ai nhắc lại, và cuộc họp quay về ngày kiểm đếm. Tối đó bạn ký như mọi người."], "insight": "Bạn nhận một nhận định thay vì nói ra điều mình định nói. Lần này người đóng cánh cửa không phải người hàng xóm mà là chính bạn: câu “chắc vậy” khép lại điều bạn vừa hé. Không phải lúc nào cũng sai, nhưng cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra không có chỗ trong biên bản."}, "rA": {"d": "analyst", "end": 1, "title": "Một chữ không có ô trong bảng", "scene": ["Bạn kể: ông nhà bạn xây căn nhà ấy từng đợt, mỗi đợt dành dụm xong mới xây thêm một gian, và ngõ này ai cũng gọi bạn là “bà Ba nhà cuối ngõ”. Người hàng xóm ngồi xuống cạnh bạn, không ngắt lời. Bạn chưa nói sẽ ký hay không."], "insight": "“Tự tay xây” là một cái biểu đạt-chủ mới (S₁) bật ra từ lời của chính bạn khi có người giữ chỗ trống cho bạn nói. Nó chỉ ra phần không có ô trong bảng tính, nhưng không quyết định chuyện ký hay không ký. Người giữ chỗ trống ở đây là một người hàng xóm, không phải nhà phân tâm; một câu hỏi mở không thay được đối thoại, giải trình hay pháp lý."}}}]}, {"id": "mxh", "title": "Mừng cưới 200 nghìn có bị chê không?", "sub": "Bạn đăng một câu hỏi vu vơ lên Facebook lúc nghỉ trưa. Đến chiều nó có hơn ba nghìn bình luận.", "start": "n0", "me": "Người đăng bài", "nodes": {"n0": {"d": "hysteric", "scene": ["Trưa thứ Năm, bạn ngồi ăn cơm hộp ở công ty và gõ một bài lên Facebook: “Hôm qua mình đi đám cưới đồng nghiệp, mừng 200k. Tiệc nhà hàng, khách gần 500 người, mình thấy hơi ngại. Cho mình hỏi mừng vậy có thất lễ không ạ?” Chế độ công khai, vì bạn quên chỉnh.", "Một tiếng sau, bình luận đứng đầu có hơn 1,2 nghìn lượt thích: “200k mà đi tiệc nhà hàng? Ăn của người ta một suất gần 800k rồi bạn ơi 😂” Bên dưới, người ta đang cãi nhau xem một suất ăn đáng giá bao nhiêu. Chưa ai hỏi bạn thực sự ngại điều gì."], "read": "Bạn ($) hỏi đám đông (S₁, “ai biết thì chỉ giùm”) và đòi nó tạo ra tri thức (S₂) về điều bạn không chắc. Đây là cấu trúc Cuồng loạn, quen đến mức gần như là định nghĩa của mục “Mọi người cho mình hỏi” trên mạng. Điều thật sự thúc bạn hỏi (a) chưa nằm trong câu hỏi nào: bạn ngại vì tiền, vì sợ bị coi nhẹ, hay vì chị đồng nghiệp? Còn phía bên kia, nhiều người vừa được trả lời một câu hỏi khác, câu “mình có đúng không” của chính họ.", "q": "Bạn trả lời bình luận đầu tiên thế nào?", "choices": [{"t": "“Mình ngồi bàn cuối, ăn có ba món, lương 9 triệu nên 200k là gần 2% rồi. Mình tính kỹ lắm mà.”", "go": "n1u", "fb": "Bạn đáp bằng con số: tri thức (S₂) lên ghế tác nhân, và cuộc cãi chuyển sang chuyện ai tính đúng. Sơ đồ xoay sang Học thuật."}, {"t": "“Ai không đồng ý thì lướt qua. Mình hỏi để biết, không cần ai dạy đời.”", "go": "n1m", "fb": "Bạn đóng cuộc hỏi bằng một câu ra lệnh: S₁ đứng ở vị trí tác nhân và người đọc bị đặt vào chỗ phải nghe. Sơ đồ xoay sang Chủ nhân."}, {"t": "“Cảm ơn mọi người. Cho mình hỏi thật: ai từng rơi vào cảnh ngại kiểu này chưa? Mình thấy lấn cấn mà không rõ vì sao.”", "go": "n1a", "fb": "Bạn bỏ cuộc tranh con số và hỏi người đọc từng ngại điều gì: a ở vị trí tác nhân, $ của họ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Ủa bài lên top rồi à? Để mình quay clip trả lời bình luận, phần 1 nha mọi người ❤️”", "go": "n2c", "fb": "Bạn biến sự chú ý thành nội dung: bình luận thành nguyên liệu, lượt xem thành thứ bạn đuổi theo. Sơ đồ xoay sang Tư bản."}]}, "n1u": {"d": "university", "scene": ["Bạn dán một bình luận dài, đủ số liệu. Trong mười phút có bốn mươi người trả lời. Người thì tính giá suất ăn theo bảng giá nhà hàng, người thì tính tỉ lệ trên lương, người thì nhắc “đọc kỹ bài trước khi cãi”. Một bạn dán cả ảnh chụp bảng Excel “chi phí thực tế một khách”.", "Rồi có người viết: “Chủ thớt đăng ảnh đi Đà Lạt năm ngày hồi tháng trước, có tiền đi chơi mà không có tiền mừng à?” Dưới đó 300 lượt thích. Cuộc cãi không còn là chuyện 200k."], "read": "Bạn và đám đông đang trao nhau tri thức (S₂): số liệu, bảng tính, “đọc kỹ đi”. Người đọc bị đặt vào chỗ cần được dạy (a). Phía sau là một chuẩn mực chưa ai gọi tên (S₁: “mừng cưới phải sòng phẳng”, đúng hay không chưa ai bàn), và sản phẩm sinh ra là một người luôn thấy mình phải biện hộ ($). Khi chuẩn mực không được đem ra bàn, cuộc cãi trượt từ con số sang con người: đó là chuyển động rất quen, không riêng của nhóm nào.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Ảnh Đà Lạt đó là cơ quan đi team building, mình có trả đồng nào đâu. Mọi người đừng suy diễn.”", "go": "eU", "fb": "Bạn tiếp tục biện hộ bằng chứng cứ: S₂ giữ ghế tác nhân, và cuộc cãi tiếp diễn ở cấp độ bằng chứng."}, {"t": "Xóa bài, tắt thông báo, úp điện thoại xuống bàn.", "go": "eK", "fb": "Bạn rút khỏi cuộc cãi bằng cách xóa nguồn của nó. Sơ đồ xoay sang Tư bản."}, {"t": "“Cho mình hỏi lại một câu nữa: các bạn từng ngại điều gì kiểu này chưa?”", "go": "n1a", "fb": "Bạn bỏ cuộc tranh số liệu và hỏi người đọc từng ngại điều gì: a ở vị trí tác nhân, $ của họ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1m": {"d": "master", "scene": ["Bình luận của bạn nhận ba trăm lượt “haha”, phần lớn từ những người không đồng ý. Có người chụp màn hình gửi vào nhóm “Hóng Drama Cưới Hỏi”: “Chủ thớt hỏi mà gắt, mời anh chị em vào xem 🍿”. Bình luận mới đứng đầu: “Đã hỏi còn gắt. Tưởng cầu thị, hóa ra cầu like.”", "Câu hỏi 200k không còn ai nhắc. Cả thread giờ bàn về thái độ của bạn."], "read": "Bạn đóng cuộc hỏi bằng một mệnh lệnh (S₁), nhưng lệnh này không có chỗ đứng: bạn chỉ là một người lạ trên mạng, không ai buộc phải nghe. Người đọc không thi hành (S₂ không làm việc) mà phản công. Cuộc cãi chuyển từ nội dung sang thái độ, nơi mỗi bên đều có thể chắc mình đúng mà không cần dẫn chứng. Phía sau mệnh lệnh của bạn có thể là một nỗi ngại ($) bạn chưa nói.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Mình xin lỗi nếu lời mình làm ai phật ý. Mình sẽ đọc kỹ các góp ý.”", "go": "eM", "fb": "Bạn xin lỗi theo công thức quen thuộc: S₁ lùi lại mà chưa nói gì về điều mình ngại. Sơ đồ ở lại Chủ nhân."}, {"t": "“Còn bạn kia, nhà bạn mừng cưới bao nhiêu mà dạy đời? Nói xem nào.”", "go": "n2h", "fb": "Bạn quay câu hỏi sang người chê: $ ở vị trí tác nhân, đòi một S₁ khác đưa căn cứ. Sơ đồ xoay sang Cuồng loạn."}]}, "n2h": {"d": "hysteric", "scene": ["Bạn kia trả lời trong năm giây: “Nhà mình mừng 500k, nên mới dám nói.” Rồi thêm: “Còn chủ thớt, tránh né câu hỏi kìa.” Ba người khác nhảy vào: “Ủa thế rốt cuộc chủ thớt hỏi để làm gì?” “Câu view chứ gì nữa.” “Mình thấy bài này seeding.”", "Mỗi câu bạn đáp lại sinh ra thêm hai câu hỏi về chính bạn."], "read": "Bạn ($) đặt câu hỏi vào một người đối diện (S₁) và đòi anh ta đưa căn cứ, rồi chính bạn bị hỏi lại: “hỏi để làm gì?”, “câu view à?”. Mỗi câu trả lời (S₂) sinh thêm câu hỏi vì điều thúc đẩy (a) không nằm ở “mừng bao nhiêu” mà ở chỗ ai có quyền phán xét ai. Đây là Cuồng loạn ở dạng tập thể: nhiều $ cùng đòi một S₁ mà chưa ai nắm.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Mình hỏi thật mà, không câu view. Các bạn muốn mình chứng minh bằng cách nào?”", "go": "eH", "fb": "Bạn tiếp tục trả lời từng câu hỏi: mỗi S₂ bạn đưa lại sinh thêm một câu hỏi. Sơ đồ ở lại Cuồng loạn."}, {"t": "“Thật ra mình ngại vì chị đồng nghiệp từng giúp mình nhiều lắm. Mình sợ chị nghĩ mình coi nhẹ chị.”", "go": "n1a", "fb": "Bạn thôi chứng minh và nói điều thúc mình hỏi. Vài người ngừng cãi nhau để nghe. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1a": {"d": "analyst", "scene": ["Câu hỏi của bạn làm thread chậm lại. Vài người ngừng cãi nhau. Một chị viết: “Hồi mình cưới, có bạn mừng 100k, mình nhớ mãi, không phải vì ít, mà vì bạn ấy đến từ sớm giúp mình kê bàn.” Một anh: “Mình từng bị mẹ vợ nhắc ba năm vì mừng thiếu một trăm.”", "Vẫn có người viết “drama queen”, nhưng hôm nay nó chìm xuống bên dưới. Có người nhắn riêng cho bạn: “Chị đồng nghiệp biết bạn đăng bài này chưa?”"], "read": "Câu hỏi của bạn đã đổi chỗ: thay vì đòi một phán quyết, bạn hỏi người đọc từng ngại điều gì. Người đọc ($) bắt đầu nói bằng chuyện của chính họ, và bạn đang ở chỗ nghe (a). Đây không phải phép màu của mạng xã hội: đa số vẫn tiếp tục cãi và thread này chỉ là một mẩu nhỏ của nó. Nhưng nó cho thấy cùng một bài đăng có thể sinh ra hai kiểu nói chuyện, tùy câu nào được hỏi.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Nhắn riêng cho chị đồng nghiệp: “Chị ơi, hôm qua em mừng hơi ít, chị có buồn không ạ?”", "go": "eA", "fb": "Bạn rời đám đông và hỏi thẳng người trong cuộc: $ nói với người thật sự có mặt trong câu hỏi. Sơ đồ ở lại Nhà phân tâm."}, {"t": "Quay lại bình luận đầu tiên: “Mình vẫn chưa nghe ai trả lời: 200k là thất lễ hay không?”", "go": "n1u", "fb": "Bạn quay lại đòi phán quyết: S₂ trở lại ghế tác nhân. Sơ đồ xoay sang Học thuật."}]}, "n2c": {"d": "capitalist", "scene": ["Bạn quay clip trước cửa sổ, nhạc nền đang thịnh hành, chữ chạy trên màn hình: “Phần 1: mừng 200k có xấu không?” Mười bốn nghìn lượt xem trong một giờ. Có tài khoản nhắn xin hợp tác quảng cáo dịch vụ cưới.", "Bình luận chê và bình luận khen đều đẩy clip lên cao hơn: thuật toán không phân biệt. Có người viết: “Có tiền làm TikTok mà không có tiền mừng à?” Tim bạn đập nhanh, và lạ là bạn muốn có thêm một bình luận nữa."], "read": "Đây là chu trình Tư bản: $ → S₁ → S₂ → a → $. Sự không chắc của bạn ($) gặp một nền tảng (S₁, “thuật toán”), nó biến bình luận thành nguyên liệu (S₂), sản phẩm là chỉ số (a) mà bạn đuổi theo, rồi chỉ số lại sinh thêm thiếu hụt ($). Khác với các diễn ngôn kia, ở đây không ai cần câu trả lời cho câu hỏi ban đầu: câu hỏi chỉ là chất đốt. Làm nội dung không sai tự thân; vấn đề bắt đầu khi câu hỏi 200k không còn là điều bạn muốn biết.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Làm tiếp phần 2: “Trả lời anti-fan: bạn nào bảo mình nghèo?” kèm #drama", "go": "eC", "fb": "Bạn tiếp tục chu trình: mỗi phần mới cần một thiếu hụt mới để chạy. Sơ đồ ở lại Tư bản."}, {"t": "Tắt máy quay. Mở tin nhắn của chị đồng nghiệp, gõ: “Chị ơi, hôm qua em mừng hơi ít, chị có buồn không ạ?”", "go": "eA", "fb": "Bạn rời chu trình và hỏi thẳng người trong cuộc. Sơ đồ xoay sang Nhà phân tâm."}]}, "eU": {"d": "university", "end": 1, "title": "Thắng từng con số, thua cả cuộc cãi", "scene": ["Ba tiếng, một trăm hai mươi bình luận, hai bảng Excel. Không ai đổi ý. Bài của bạn được ghim vào một nhóm với tiêu đề “Cuộc chiến phong bì”, và có người phản hồi bằng meme: “Tôi đã đọc hết, và tôi vẫn không biết mừng bao nhiêu.”"], "insight": "Tri thức (S₂) làm đúng việc của nó: mỗi bên đều có chứng cứ. Nhưng chuẩn mực phía sau (S₁: mừng bao nhiêu thì đủ lễ) không bao giờ được đem ra bàn, nên số liệu chỉ đổi chỗ chứ không thuyết phục ai. Sản phẩm ($) là một người luôn phải biện hộ. Tranh số liệu không vô ích; nó chỉ không đủ khi điều đang tranh thật ra là lòng tự trọng và chỗ đứng."}, "eK": {"d": "capitalist", "end": 1, "title": "Bài đã xóa, ảnh chụp thì không", "scene": ["Bạn xóa bài, tắt thông báo. Mười phút sau, nhóm “Hóng Drama Cưới Hỏi” đăng ảnh chụp màn hình kèm dòng: “Chủ thớt xóa bài rồi, có tật giật mình, ai còn ảnh gốc không?” Hai nghìn lượt thích. Một tài khoản làm clip tổng hợp “Drama phong bì: diễn biến mới nhất”."], "insight": "Xóa bài tưởng là chấm dứt, nhưng bài đã thành nguyên liệu (S₂) cho một chu trình không còn cần bạn. Sản phẩm (a) là lượt tương tác, và việc bạn biến mất còn thành một tình tiết mới. Đây là điểm đặc trưng của Tư bản: nội dung tách khỏi người tạo ra nó. Rút lui vì mệt là chính đáng; điều đáng chú ý là mạng không để việc rút lui là một việc im lặng."}, "eM": {"d": "master", "end": 1, "title": "“Nếu có làm ai phật ý”", "scene": ["Bạn đăng lời xin lỗi. Sáu trăm người thả tim; hai trăm người đáp: “Xin lỗi kiểu ‘nếu có’ là không xin lỗi.” Bạn sửa lại một lần nữa, rồi tắt thông báo. Câu hỏi 200k vẫn chưa được trả lời, nhưng không ai còn hỏi nữa."], "insight": "Mệnh lệnh (S₁) rút lui nhưng không nói gì về điều bạn ngại. Lời xin lỗi theo công thức làm cuộc cãi dịu đi mà không giải quyết gì, và dễ thành đề tài mới. Điều thúc bạn hỏi ($) vẫn chưa ai nghe, kể cả chính bạn."}, "eH": {"d": "hysteric", "end": 1, "title": "Mỗi câu trả lời lại sinh câu hỏi mới", "scene": ["Đến khuya bạn vẫn đang trả lời. “Bạn không câu view thì chứng minh đi?” “Chứng minh bằng cách nào?” Một bạn đề nghị bạn chụp màn hình sao kê phong bì. Bạn cười một mình vì chữ “sao kê”, rồi thấy mình không còn cười."], "insight": "Mỗi câu trả lời (S₂) của bạn sinh thêm một câu hỏi, vì điều thúc đẩy đám đông (a) không nằm ở 200k mà ở chỗ ai có quyền phán xét ai. Đó là cái “không bao giờ đủ” của Cuồng loạn, ở dạng tập thể: nhiều $ cùng đòi một S₁ mà chưa ai nắm. Đòi chứng minh không có đáy; ở một điểm nào đó, ngừng trả lời không phải là thua."}, "eC": {"d": "capitalist", "end": 1, "title": "Phần 2, phần 3, phần cuối (chưa phải cuối)", "scene": ["Phần 2 được bốn mươi nghìn lượt xem. Phần 3 là “giải đáp thắc mắc”, phần 4 là “phản hồi anti-fan”. Một hãng dịch vụ cưới gửi hợp đồng. Một đêm bạn nhận ra đã hai tuần mình không nghĩ đến chị đồng nghiệp, và câu hỏi 200k không còn nằm trong video nào."], "insight": "Câu hỏi ban đầu đã thành chất đốt: thiếu hụt ($) biến thành nội dung (S₂), nội dung thành chỉ số (a), chỉ số lại tạo cảm giác thiếu thêm. Không ai ép bạn; vòng lặp tự chạy. Làm nội dung không sai tự thân, và có người làm rất tử tế. Điều đáng hỏi là: còn câu hỏi nào trong đó thuộc về bạn?"}, "eA": {"d": "analyst", "end": 1, "title": "Người duy nhất không bình luận", "scene": ["Chị đồng nghiệp trả lời sau ba phút: “Ủa em mừng bao nhiêu chị có nhớ đâu. Chị chỉ nhớ em tới sớm kê bàn với chị. Mà sao tự nhiên em hỏi vậy?” Bạn đọc ba lần. Bài đăng vẫn còn đó, bốn nghìn bình luận, nhưng bạn thấy nó nhỏ lại."], "insight": "Điều thúc bạn hỏi (a) hóa ra không phải con số mà là nỗi sợ chạm vào một mối quan hệ (S₁ mới: “mình có coi nhẹ chị không”), và người duy nhất có thể trả lời lại không có mặt trong thread. Đây không phải kết cục điển hình: nhiều người sẽ không nhận được câu trả lời dễ chịu thế, và nhiều thread không có ai chịu hỏi lại. Mạng xã hội không phải nhà phân tâm; chỗ trống ở đây chỉ mở ra vì bạn đưa câu hỏi về đúng người."}}, "alt": [{"n": "Người bình luận", "sub": "Cùng bài đăng ấy, nhưng bạn là người gõ bình luận đứng đầu. Bạn chỉ định đùa một câu, và phải quyết định nói gì khi câu ấy nhận hàng nghìn lượt thích.", "start": "x0", "nodes": {"x0": {"d": "master", "scene": ["Trưa thứ Năm, bạn ngồi quán cơm, tay cầm ly trà đá, tay lướt Facebook. Một người lạ vừa đăng: “Hôm qua mình đi đám cưới đồng nghiệp, mừng 200k. Tiệc nhà hàng, khách gần 500 người, mình thấy hơi ngại. Cho mình hỏi mừng vậy có thất lễ không ạ?” Đã mười bốn bình luận, chưa ai nói thẳng.", "Có một chuyện bạn chưa kể ai: tháng trước bạn mừng 500k cho đồng nghiệp dù cuối tháng phải ăn mì gói ba ngày, vì mẹ bạn bảo “mình không thể để người ta chê”. Bạn mở ô bình luận."], "read": "Bạn đang ở chỗ có thể phán một câu như điều hiển nhiên (S₁: “mừng cưới phải sòng phẳng”), và hàng nghìn người lạ sẽ nghe nó như một bản án vì nó đứng đầu bảng. Phía sau là điều bạn không định gõ ($): bạn đã chịu thiệt một lần và thấy khó chịu khi người khác đỡ thiệt hơn mình. Đây là cấu trúc Chủ nhân, nhưng quyền của bạn không đến từ chức vụ: nó đến từ việc bạn vào sớm và người khác bấm thích. Cách bạn viết sẽ quyết định người đăng bài đáp bằng giọng nào.", "q": "Bạn gõ gì?", "choices": [{"t": "“200k mà đi tiệc nhà hàng? Ăn của người ta một suất gần 800k rồi bạn ơi 😂”", "go": "x1u", "fb": "Bạn đùa bằng một phép tính: tri thức (S₂) đứng ở vị trí tác nhân, và người đăng bị đặt vào chỗ phải biện hộ (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Đi đám cưới thì mừng cho phải phép. Không có thì đừng đi, đừng hỏi.”", "go": "x1m", "fb": "Bạn nói như một điều hiển nhiên, không kèm lý do: S₁ đứng ở vị trí tác nhân, và người đăng đáp lại bằng một lệnh khác. Sơ đồ ở lại Chủ nhân."}, {"t": "“Bạn ngại vì số tiền hay vì sợ người ta nghĩ gì? Mình mừng 500k mà vẫn thấy lấn cấn.”", "go": "x1a", "fb": "Bạn hỏi một câu mở và tự để lộ một mẩu chuyện của mình: a ở vị trí tác nhân, $ của người đăng được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "Chụp màn hình bài, đăng vào nhóm “Hóng Drama Cưới Hỏi”: “Có bạn dám hỏi 200k luôn mọi người ơi 🍿”", "go": "x2c", "fb": "Bạn biến bài của người lạ thành nguyên liệu cho nhóm: một vòng lặp lượt thích bắt đầu mà bạn không còn kiểm soát được. Sơ đồ xoay sang Tư bản."}]}, "x1u": {"d": "university", "scene": ["Bình luận của bạn lên đầu trong hai mươi phút, 1,2 nghìn lượt thích. Người đăng trả lời bằng cả một đoạn số liệu: ngồi bàn cuối, ăn ba món, lương 9 triệu nên 200k là gần 2%. Chị ấy tính khá kỹ.", "Bên dưới, người ta chia phe: người dán bảng giá nhà hàng, người nhắc “đọc kỹ bài”. Bạn thấy chị nói cũng có lý, và ngực bạn hơi nóng: 9 triệu mà tính kỹ thế, còn 500k của bạn thì sao?"], "read": "Bạn mở cuộc cãi bằng một phép tính (S₂), và giờ cả hai phía cãi bằng con số. Người đăng bị đặt vào chỗ phải biện hộ (a). Điều bạn vừa nhận ra ($: bạn thấy mình thiệt) là phần không có chỗ trong cuộc cãi con số: bạn đang cãi với một phép tính, nhưng thứ làm bạn nóng là 500k của tháng trước.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Chị tính chi li thế thì có mừng nổi hay không mừng nổi, đừng viện cớ.”", "go": "xU", "fb": "Bạn tiếp tục cãi bằng chứng cứ và nghi ngờ: S₂ giữ ghế tác nhân."}, {"t": "Vào trang cá nhân của chị, thấy ảnh Đà Lạt, bình luận: “Có tiền đi chơi năm ngày mà không có tiền mừng à?”", "go": "xP", "fb": "Bạn chuyển từ số liệu sang con người: một bình luận của bạn đứng ở vị trí tác nhân và cả luồng hướng sang người đăng. Sơ đồ xoay sang Chủ nhân."}, {"t": "Dừng tay. Gõ: “Mình nói hơi quá. Thật ra mình mừng 500k hồi tháng trước và vẫn thấy lấn cấn, nên đọc bài chị mới nóng.”", "go": "x1a", "fb": "Bạn bỏ cuộc cãi con số và nói điều làm mình nóng: a ở vị trí tác nhân, $ của người đăng được mời nói lại. Sơ đồ xoay sang Nhà phân tâm."}]}, "x1m": {"d": "master", "scene": ["Bình luận của bạn đạt tám trăm lượt thích trong mười lăm phút. Người đăng đáp: “Ai không đồng ý thì lướt qua. Mình hỏi để biết, không cần ai dạy đời.” Hai trăm người thả haha vào câu đó, ba trăm người thả haha vào câu của bạn. Có người chụp màn hình cả hai gửi nhóm “Hóng Drama Cưới Hỏi”.", "Bạn thấy mình như người vừa ném viên sỏi xuống ao, còn ao thì đang sôi. Một tài khoản lạ nhắn riêng: “Anh/chị cho em xin quyền chia sẻ bình luận này vào page ạ.”"], "read": "Hai mệnh lệnh va nhau: “đừng hỏi nếu không đủ tiền” (S₁ của bạn) và “đừng dạy đời” (S₁ của người đăng). Không bên nào đưa căn cứ, và hàng nghìn người đứng ngoài thả cảm xúc như khán giả. Bạn là người mở đầu và cũng là người đầu tiên có thể dừng, nhưng 800 lượt thích cho thấy một thứ rất khó bỏ: cảm giác mình đúng và được đông người công nhận, khiến cái $ của bạn bớt đau.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Thêm một câu: “Thớt hỏi mà gắt, hóa ra không cầu thị. Cho mọi người xem thái độ nè.”", "go": "xM", "fb": "Bạn cộng mệnh lệnh lên mệnh lệnh: S₁ giữ ghế tác nhân, và đám đông thành người thi hành bằng lượt thích. Sơ đồ ở lại Chủ nhân."}, {"t": "Bình luận: “Mình hỏi thật, chị gắt hay không không quan trọng. Chị ngại vì tiền hay vì điều gì?”", "go": "x1a", "fb": "Bạn bỏ cuộc đấu mệnh lệnh và hỏi một câu mở: a ở vị trí tác nhân, $ của người đăng được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "x1a": {"d": "analyst", "scene": ["Người đăng đáp, giọng không còn phòng thủ: “Cảm ơn bạn. Mình ngại vì chị đồng nghiệp từng giúp mình rất nhiều, mình sợ chị nghĩ mình coi nhẹ chị. Mà bạn mừng 500k thì có sao không ạ?”", "Câu hỏi quay lại chỗ bạn. Bên dưới, vài người ngừng cãi, một người viết: “Bạn nào kể thêm đi, đọc thấy đỡ cô đơn.” Bạn nhìn ô bình luận trống và nhớ ba ngày ăn mì."], "read": "Người đăng giữ chỗ trống (a), và bạn ($) là người được mời nói. Bạn vừa đổi chỗ với người bị bạn chê: câu “bạn có sao không” lần đầu hướng về phía bạn. Chỗ này dễ mất, chỉ cần một người chen vào chữ “drama” là nó chìm; và nó không bảo đảm bạn sẽ nói ra điều thật.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Có sao chứ. Mình ăn mì ba ngày. Nên đọc bài chị, thấy chị mừng ít mà vẫn thoải mái, mình tức.”", "go": "xA", "fb": "Bạn nói điều thúc mình bình luận bằng chính chữ của nó: $ nói từ chỗ được mời. Sơ đồ ở lại Nhà phân tâm."}, {"t": "“Không sao đâu. Mình chỉ góp ý thôi, chị đừng để bụng.”", "go": "xK", "fb": "Bạn rút lại bằng một lời trấn an: tri thức (S₂) quay lại ghế tác nhân và cánh cửa khép lại. Sơ đồ xoay sang Học thuật."}]}, "x2c": {"d": "capitalist", "scene": ["Bạn chụp màn hình và đăng vào nhóm kèm “🍿”. Mười phút sau, bài của bạn có ba nghìn lượt thích. Admin nhắn: “Bạn ơi đăng thêm drama như này nữa nhé, nhóm sẽ ghim bài bạn.” Có người đã tìm ra Facebook cá nhân của người đăng và dán link vào bình luận.", "Bạn không viết câu nào ác, bạn chỉ chụp và đăng. Mọi thứ còn lại do người khác làm."], "read": "Đây là chu trình Tư bản: cảm giác buồn chán và bị thiệt ($) của bạn gặp một nhóm (S₁), nhóm biến bài của người lạ thành nguyên liệu (S₂) và trả lại chỉ số (a) như phần thưởng, rồi phần thưởng làm bạn muốn thêm. Bạn không nói câu nào ác, nhưng bạn là một mắt xích không thể thiếu: không có người chụp và đăng, nhóm không có gì để sống.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Tìm thêm một bài drama khác để đăng. Admin đang chờ.", "go": "xC", "fb": "Bạn tiếp tục chu trình: mỗi bài kế tiếp cần một thiếu hụt mới để chạy. Sơ đồ ở lại Tư bản."}, {"t": "Gỡ bài, nhắn người đăng gốc: “Mình xin lỗi vì đã chụp bài chị. Chị nên ẩn bài đi, người ta đang tìm trang cá nhân chị.”", "go": "xR", "fb": "Bạn rời chu trình và nói với người thật: a ở vị trí tác nhân, $ của người đăng được nghe. Sơ đồ xoay sang Nhà phân tâm."}]}, "xU": {"d": "university", "end": 1, "title": "Đúng từng con số", "scene": ["Bạn thắng hai vòng số liệu. Người đăng không đổi ý, còn bạn đọc lại bình luận 500k của chính mình và thấy nó nặng hơn cả cuộc cãi. Bạn tắt thông báo trong tâm trạng của người vừa thắng mà không thấy vui."], "insight": "Cuộc cãi bằng số liệu (S₂) không bao giờ chạm vào điều thúc bạn cãi ($: bạn đã chịu thiệt một lần). Bạn thắng ở chỗ đo được và thua ở chỗ không đo được. Ở vai người bình luận bạn thấy điều khó thấy từ ghế người đăng: nhiều lời chê “khách quan” có một mẩu chuyện riêng phía sau."}, "xP": {"d": "master", "end": 1, "title": "Đào bài cũ", "scene": ["Bình luận về ảnh Đà Lạt có hai nghìn lượt thích, và ba người khác cùng đào thêm: ảnh ly cà phê 90k, ảnh chiếc túi. Người đăng im lặng một tiếng rồi biến mất. Bạn nhận ra chủ đề 200k đã chết từ đoạn đầu. Bạn không viết gì ác, bạn chỉ đặt một mũi tên lên một bức ảnh."], "insight": "Câu hỏi “mừng bao nhiêu” (S₂) bị thay bằng “người này là ai”, và bình luận của bạn trở thành S₁ mới: “chị này giả nghèo”. Một câu đủ để đổi hướng cả luồng, và chính bạn cũng không điều khiển được nó nữa. Cái giá ở phía bên kia: một người phải xóa bài vì ảnh đi chơi của mình bị đem làm bằng chứng. Ở ghế của bạn, nó chỉ là một bình luận có hai nghìn lượt thích."}, "xM": {"d": "master", "end": 1, "title": "Thêm một câu", "scene": ["Bình luận của bạn có thêm chín trăm lượt thích. Người đăng không trả lời nữa. Bạn thấy nhẹ nhõm và hơi trống, như vừa ăn xong một bữa không no."], "insight": "Bạn cộng mệnh lệnh lên mệnh lệnh (S₁): “thái độ” thành chủ đề và đám đông thi hành bằng lượt thích. Điều thúc bạn ($, 500k tháng trước) không được nói, và bạn nhận về đúng thứ nó cần: sự công nhận, thứ càng nhận càng cần. Ở vai bạn, “góp ý thẳng” và “ném đá” có thể là cùng một hành vi; khác nhau ở chỗ có người bên kia đang đọc hay không."}, "xK": {"d": "university", "end": 1, "title": "“Chị đừng để bụng”", "scene": ["Người đăng trả lời “dạ cảm ơn bạn”. Bình luận của bạn vẫn đứng đầu với 1,2 nghìn lượt thích, và bạn cũng chẳng xóa nó. Hai ngày sau có người trích nó trong một clip “Những bình luận phũ phàng nhất”."], "insight": "Lời trấn an (S₂) khép cánh cửa; bình luận gốc thì không được thu hồi. Rút lời trong hai giây thì dễ, nhưng bình luận đã tách khỏi bạn. Cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra vẫn ở trong bạn, còn bình luận thì bắt đầu sống đời riêng."}, "xA": {"d": "analyst", "end": 1, "title": "Ba ngày ăn mì", "scene": ["Bạn gõ xong, nhìn nó mười giây rồi bấm gửi. Người đăng trả lời: “Cảm ơn bạn đã nói. Mình không biết bạn vất vả thế. Mình xin lỗi vì câu hỏi của mình làm bạn thấy bị thiệt.” Một người lạ viết thêm: “Mình cũng từng mừng quá sức rồi ngồi hận cả tháng.” Thread đổi hướng, nhưng bình luận đầu tiên của bạn vẫn đứng đầu với 1,2 nghìn lượt thích, và nhiều người chưa kịp đọc phần này."], "insight": "“Mình ăn mì ba ngày” là một S₁ mới bật ra từ chính bạn: câu “ăn của người ta 800k” có thể luôn là câu nói về cái thiệt của bạn, không phải về người đăng. Điều này không xóa được tác động của bình luận đầu, và không phải lần nói thật nào cũng được đón như vậy. Mạng xã hội không phải nhà phân tâm; chỗ trống chỉ mở ra vì có người chịu hỏi lại."}, "xC": {"d": "capitalist", "end": 1, "title": "Admin đang chờ", "scene": ["Bạn đăng thêm hai bài drama trong tuần. Admin tặng bạn huy hiệu “Người đóng góp nổi bật”, một biểu tượng nhỏ bên cạnh tên. Bạn nhớ ra mình ba tuần chưa gọi điện cho mẹ, và không nhớ nổi mình đã mừng cưới ai gần đây."], "insight": "Bạn tạo nguyên liệu (S₂), nhận chỉ số (a), và phần thưởng làm bạn thiếu hơn ($). Huy hiệu không nói dối: bạn tích cực thật. Câu hỏi là tích cực vì điều gì, khi bài của người lạ thành thứ bạn kiếm tương tác và con người phía sau nó biến thành một ảnh chụp màn hình."}, "xR": {"d": "analyst", "end": 1, "title": "Gỡ bài thì dễ, gỡ ảnh chụp thì không", "scene": ["Bạn gỡ bài và nhắn riêng. Chị đáp: “Cảm ơn bạn nhắn, mình ẩn bài rồi. Nhưng ảnh chụp thì đã đi xa rồi.” Chị kể thêm: sáng nay sếp chị hỏi vì sao bài của chị có bốn nghìn bình luận. Bạn nhìn ảnh chụp trong nhóm: nó vẫn còn đó, sáu nghìn lượt thích."], "insight": "Bạn quay ra nói với người thật (a), nhưng ảnh chụp là một thứ đã tách khỏi bạn và người đăng (S₂ tự chạy). Hối hận có thật nhưng muộn. Điều đáng chú ý là điểm quyết định nằm ở lúc bạn bấm “chụp màn hình”, khi mọi thứ vẫn còn là của bạn. Nhắn xin lỗi vẫn tốt, và chưa chắc đã đủ."}}}, {"n": "Người hóng", "sub": "Cùng bài đăng ấy, nhưng bạn không đăng, không bình luận, chỉ lướt. Bạn tự hỏi những việc nhỏ mình làm có tính là gì không.", "start": "h0", "nodes": {"h0": {"d": "capitalist", "scene": ["Hai giờ chiều thứ Năm, bạn ngồi ở công ty, sếp vừa nhận xét bản báo cáo của bạn là “chưa có tâm”. Bạn chưa kể ai. Bạn mở Facebook cho nguôi.", "Bài của một người lạ nổi lên: “Hôm qua mình đi đám cưới đồng nghiệp, mừng 200k. Tiệc nhà hàng, khách gần 500 người, mình thấy hơi ngại. Cho mình hỏi mừng vậy có thất lễ không ạ?” Bình luận đứng đầu: “200k mà đi tiệc nhà hàng? Ăn của người ta một suất gần 800k rồi bạn ơi 😂” có 1,2 nghìn lượt thích. Bên dưới đang cãi nhau như hội chợ."], "read": "Đây là chu trình Tư bản nhìn từ phía người tiêu thụ: cảm giác khó chịu của bạn ($) gặp một dòng cấp (S₁, thuật toán) liên tục bày ra nguyên liệu (S₂, bình luận) để bạn tiêu thụ (a). Không ai hỏi bạn gì và cũng không ai cần bạn nói. Nhưng thứ bạn chạm vào (thả cảm xúc, dừng lại lâu, chia sẻ) lại là thứ nuôi cái vòng này: chú ý của bạn là phần thưởng duy nhất nó cần.", "q": "Bạn làm gì?", "choices": [{"t": "Thả “haha” vào bình luận đầu tiên, bình luận “Hóng 🍿” rồi lướt tiếp.", "go": "h1c", "fb": "Bạn tiêu thụ và tặng lại một chút chú ý: S₂ vẫn đi, bạn vẫn ở trong vòng. Sơ đồ ở lại Tư bản."}, {"t": "Gõ: “Mọi người cãi gì dữ vậy, người ta chỉ hỏi thôi mà. Buông bạn ấy ra đi.”", "go": "h1m", "fb": "Bạn chen vào bằng một câu có tính đạo đức, như một mệnh lệnh: S₁ đứng ở vị trí tác nhân. Sơ đồ xoay sang Chủ nhân."}, {"t": "Nhắn riêng cho người đăng: “Bạn ơi, đọc bình luận chắc bạn mệt. Bạn có ổn không?”", "go": "h1a", "fb": "Bạn rời đám đông và hỏi thẳng một người: a ở vị trí tác nhân, $ của người đăng được mời nói. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "Đóng ứng dụng. Có việc thật phải làm.", "go": "hN", "fb": "Bạn ra lệnh cho chính mình dừng: S₁ của bạn đứng ở vị trí tác nhân. Sơ đồ xoay sang Chủ nhân."}]}, "h1c": {"d": "capitalist", "scene": ["Một cái haha chỉ mất nửa giây. Nhưng bài ấy bắt đầu hiện nhiều hơn trên bảng tin của bạn, và của những người bạn từng bình luận chung. Ba người quen vào bình luận. Bạn nhắn cho bạn thân: “Thấy bài này chưa? 😂” và bạn thân gửi lại ảnh một bình luận khác, trong đó ai đó đã dán link Facebook của người đăng.", "Bạn nhớ ra mình chưa trả lời sếp. Bạn biết thêm một bình luận nữa là thêm năm phút, và bạn bấm mở."], "read": "Chu trình Tư bản bám lấy bạn: cảm giác khó chịu sau lời sếp ($) gặp dòng cấp (S₁), dòng cấp đưa nguyên liệu (S₂), sản phẩm (a) là cái haha vừa cho đi, và cái haha ấy lại nuôi thuật toán. Bạn không làm hại ai, nhưng chú ý của bạn chính là thứ đang trả lương cho cả chuyện này.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Chụp màn hình bình luận có link Facebook, gửi vào nhóm bạn kèm “Hóng 🍿”.", "go": "hC", "fb": "Bạn chuyển nguyên liệu sang vòng khác, nhanh hơn bạn tưởng: S₂ tiếp tục đi mà không cần bạn. Sơ đồ ở lại Tư bản."}, {"t": "Dừng lại. Báo cáo bình luận có link, rồi nhắn riêng cho người đăng: “Bạn nên ẩn bài đi, người ta đang tìm trang cá nhân bạn.”", "go": "h1a", "fb": "Bạn rời vòng lặp và nói với người thật: a ở vị trí tác nhân, $ của người đăng được nghe. Sơ đồ xoay sang Nhà phân tâm."}]}, "h1m": {"d": "master", "scene": ["Bình luận của bạn có bốn mươi lượt thích, nhưng có ba trăm phản hồi: “Thánh mẫu giáng thế đây rồi.” “Bạn thương thì bạn đứng ra mừng giùm.” “Ủa ai hỏi bạn?” Một tài khoản lạ đáp: “Bạn nói thế chắc có quen chủ thớt.”", "Bạn chỉ muốn nói một câu hiền lành. Giờ cả luồng đang nói về bạn."], "read": "Bạn dùng một câu có tính đạo đức, “buông bạn ấy ra đi”, như một mệnh lệnh (S₁) chen vào cuộc cãi. Nhưng bạn không có chỗ đứng để ra lệnh: bạn là người lạ như họ
