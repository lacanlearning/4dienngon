<style>

u{text-decoration:none;color:var(--mute);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-right:5px;font-weight:500}

.phead .hrole{flex:none;margin-left:4px;padding-left:10px;border-left:1px solid rgba(255,255,255,.22);color:var(--rc,var(--acc));font-size:12px;letter-spacing:.02em;white-space:nowrap}
.sw-ic{flex:none;color:var(--acc);font-size:16px;line-height:1.2}

.rolechip:hover,.rolechip:focus-visible,.rolebar .rb-sw:hover,.rolebar .rb-sw:focus-visible,.swapbtn:hover,.swapbtn:focus-visible{color:var(--rc);text-shadow:0 0 9px rgba(var(--rcr),.75),0 0 22px rgba(var(--rcr),.42)}
.rolebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:6px 0 12px;padding:0 0 9px;border-bottom:1px solid rgba(255,255,255,.14)}
.rolebar .rb-k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.rolebar .rb-n{font-size:19px;font-weight:600;line-height:1.2;color:var(--rc);text-shadow:0 0 16px rgba(var(--rcr),.35)}
.rolebar .rb-swg{display:flex;flex-wrap:wrap;gap:4px 18px;margin-left:auto}
.rolebar .rb-sw{font-size:12.5px}
.rolenote{margin:2px 0 10px;font-size:13.5px;line-height:1.5;color:#e6e3f2}

.swapcard .sw-d{margin:7px 0 6px;font-size:13.5px;line-height:1.55;color:#d7d3e6}
.swapbtn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px;font-weight:600}
.swapbtn span::after{content:"→";display:inline-block;margin-left:8px;color:var(--rc);transition:transform .22s var(--ease)}
.swapbtn:hover span::after,.swapbtn:focus-visible span::after{transform:translateX(4px)}
.swapbtn small{font-size:12px;font-weight:400;color:var(--mute);white-space:nowrap;text-shadow:none}
.swapbtn.part{color:#c9c5da}
@media (prefers-reduced-motion:reduce){.swapcard{animation:none}}

<script>
const TK=['S1','S2','$','a'],POSL=['agent','other','truth','product'],FLD={agent:'a',other:'o',truth:'t',product:'p'};
const TE={
 S1:{c:0xf2b84b,l:'S₁',n:'Cái biểu đạt-chủ',txt:'Một mệnh lệnh không cần lý do. Nó có hiệu lực không phải vì nó đúng mà vì nó được nói ra từ chỗ có quyền: “vì bố bảo thế”. Trong phân tích, nó hiện ra như một bức tường: một cái tên, một căn bệnh, cái chết của người thân, một từ khiến mọi liên tưởng dừng lại.',ex:'Một bác sĩ tuyên bố: “Theo kết quả thăm khám, anh bị trầm cảm.” Chữ “trầm cảm” khóa lại những lo âu mơ hồ trước đó của người bệnh và biến chúng thành một căn bệnh có tên. Tương tự, một bệnh nhân bỗng buột miệng: “Tôi là đồ bỏ đi.” Cụm “đồ bỏ đi” đóng vai điểm khâu: những ký ức vụn vặt của anh ta đột nhiên được đọc lại theo một ý nghĩa mới.'},
 S2:{c:0x4fb3ff,l:'S₂',n:'Tri thức',txt:'Thứ “biết cách làm”, xếp thành chuỗi. Đó là bí quyết của người thợ trong tay người nô lệ, là bộ máy quy định của trường học hay công sở, và trong phân tâm là điều ta đã biết mà chưa biết mình biết.',ex:'Bà thợ cả ở xưởng gốm biết lửa phải đượm đến đâu, men phải phủ dày mấy phân; ông chủ xưởng thì không. Cái “biết cách” ấy nằm trong tay người làm, xếp thành chuỗi thao tác. Đó là S₂.'},
 $:{c:0xff6b8b,l:'S',n:'Chủ thể bị chia cắt',txt:'Ai cũng bị chính ngôn ngữ mình nói chẻ đôi: điều ta nói không bao giờ khớp hết với điều ta muốn. Chỗ nứt ấy (sự thiến biểu tượng) chính là chủ thể. Ông chủ thì giấu nó, trường học thì sản sinh ra nó, nhà phân tâm thì đặt nó vào ánh sáng.',ex:'Bạn thề với lòng mình rằng sẽ không bao giờ quay lại với người yêu cũ, nhưng ngay đêm hôm đó bạn lại nhắn tin cho họ. $ là vết nứt giữa lời tuyên bố có ý thức của bạn và hành động vô thức thực sự đang điều khiển bạn.'},
 a:{c:0x7bf0b0,l:'a',n:'Đối tượng a',txt:'Thứ khiến ta ham muốn, chứ không phải thứ ta nhận được: hào quang quanh món đồ, phần “chưa đủ” còn thừa sau mọi thỏa mãn. Khi đứng ở vị trí sản phẩm, Lacan gọi nó là thống lạc dư thừa, mượn từ giá trị thặng dư của Marx; nó thuộc về cái thực, thứ không nói trọn được thành lời. Ở đâu có điều không khớp, ở đó có a.',ex:'Bạn khao khát một chiếc xe hơi thể thao không phải vì động cơ của nó, mà vì hình ảnh “một người thành đạt, tự do” mà nó đại diện. Khi mua được xe, cảm giác thiếu thốn vẫn còn đó, và bạn lại hướng mắt sang một món đồ khác. Chiếc xe chỉ là vật thế chỗ; a là thứ khiến bạn muốn, chứ không phải thứ bạn mua được, nên nó luôn trượt sang món kế tiếp.'}
};
const PO={
 agent:{ang:3*Math.PI/4,n:'Tác nhân',txt:'Người đứng ra nói, người cầm lái (trên trái). Ký hiệu nào ngồi ở đây thì cả diễn ngôn mang giọng của nó: ra lệnh, giảng giải, lắng nghe hay than phiền.',ex:'Cô giáo đứng trước bảng, ông sếp cầm micro trong buổi họp, cô bệnh nhân bước vào phòng và bắt đầu than phiền. Ai đang mở lời trước cả căn phòng thì người đó đang ngồi ghế tác nhân.'},
 other:{ang:Math.PI/4,n:'Cái khác',txt:'Người bị gọi đến và phải bắt tay vào việc (trên phải). Ai đứng ở đây cũng nhận một phần việc: làm theo, học theo hay kể ra.',ex:'Nhân viên cúi đầu ghi lệnh, sinh viên cắm cúi chép bài, bác sĩ lặng lẽ nghe bệnh nhân vặn hỏi. Ai bị lời nói gọi đến và phải làm gì đó đáp lại thì đang ở ghế cái khác.'},
 truth:{ang:5*Math.PI/4,n:'Sự thật',txt:'Cái nền thầm kín giữ cho tác nhân đứng vững (dưới trái). Nó thường bị giấu, kể cả với chính tác nhân.',ex:'Ông chủ cứng rắn trước cả xưởng, nhưng nửa đêm nằm thức nghĩ: “mình có đủ tư cách không?”. Nỗi lo ấy nằm dưới vạch: không ai nghe thấy, và chính ông cũng không dám gọi tên nó.'},
 product:{ang:7*Math.PI/4,n:'Sản phẩm',txt:'Cái thu về và cũng là cái mất đi (dưới phải): phần dư rơi ra khi diễn ngôn chạy, và là chỗ Lacan đặt thống lạc dư thừa (ở diễn ngôn Chủ nhân).',ex:'Người thợ may được trả đủ sống, còn phần giá trị dôi ra sau mỗi chiếc áo bán đi thì về tay chủ. Cái dôi ra ấy là sản phẩm: sinh từ tay thợ mà không về tay thợ.'}
};
const D={
 master:{g:1,n:'Chủ nhân',a:'S1',o:'S2',t:'$',p:'a',tag:'Khuôn gốc của sự phục tùng: “cứ làm đi”',
  d:'Chủ nhân được nghe lời chỉ vì ông ta nói vậy, không cần giải thích. Người nô lệ lao động và nắm hết bí quyết, nhưng chủ nhân chẳng bận tâm máy chạy ra sao, miễn quyền còn vững. Phần dư do lao động làm ra (giá trị thặng dư) về tay ông và đem lại thống lạc dư thừa. Điều ông giấu kỹ nhất: chính ông cũng bị ngôn ngữ chẻ đôi như mọi người.',
  r:['Ra lệnh mà không cần giải thích','Người nô lệ làm việc và nắm hết bí quyết','Nỗi chia cắt bị giấu: sự thật được ngụy trang','Giá trị thặng dư, thống lạc dư thừa chảy về chủ'],ex:'Một ông chủ xưởng gõ nhẹ lên bàn: “cứ làm theo lời tôi”. Người thợ già xoay máy bằng đôi tay đã quen, còn ông chủ chỉ nhìn bảng sản lượng và chưa bao giờ biết máy chạy vì sao. Cuối tháng, phần lợi nhuận dôi ra vào túi ông; còn đêm nào ông cũng thức vì sợ mình không xứng với chiếc ghế ấy, điều không ai được thấy.',dx:['Nỗi sợ thầm kín của ông chủ ($) lọt vào xưởng: ông gắt vì một con ốc lệch, đứng sau lưng thợ cả buổi. Người thợ (S₂) thấy hết, và cả xưởng cùng nín thở theo ông.','Lợi nhuận (a) tăng mà ông chủ lại thấy bất an hơn: ông siết kỷ luật, đẩy chỉ tiêu cao hơn. Sự bất mãn của thợ dội ngược về ông thành những cái nhìn lảng đi và những cuộc đình công nhỏ.']},
 university:{g:2,n:'Học thuật',a:'S2',o:'a',t:'S1',p:'$',tag:'Quyền lực khoác áo tri thức',
  d:'Tri thức ngồi vào ghế chỉ huy và nói “mọi thứ đều có lý do”. Nhưng dưới lớp lý do ấy vẫn là mệnh lệnh của chủ nhân, chỉ là không ai nhận. Con người bị biến thành đối tượng để đo, để dạy, để phân loại; hệ thống sản ra những chủ thể bị chia cắt trong khi gạt chính chỗ chia cắt ấy ra ngoài. Triết học, và loại khoa học tệ nhất, phục vụ chủ nhân theo cách này: chúng cố gom trọn một lĩnh vực vào một bộ bách khoa.',
  r:['Tri thức làm quyền uy: “đây là khoa học”','Con người thành đối tượng để đo, để dạy','Mệnh lệnh ngầm nằm dưới tri thức','Chủ thể bị chia cắt, bị gạt khỏi ham muốn của chính mình'],ex:'Cuốn giáo trình dày cộp, mệnh đề nào cũng kèm chú thích “nghiên cứu cho thấy”. Sinh viên ngồi chép, được đo bằng điểm, và dần quên mất câu hỏi riêng mình mang vào lớp. Còn ý chí thật sự của nhà trường, như chỉ tiêu tuyển sinh hay chính sách, nằm lặng lẽ dưới bìa giáo trình.',dx:['Chỉ tiêu và chính sách (S₁) không bao giờ được nói to, nhưng nó lọt vào lớp học dưới dạng “quy chuẩn mặc nhiên”: bài nào được dạy, em nào được chú ý. Sinh viên (a) cảm nhận được dù thầy chỉ nói về tri thức khách quan.','Sinh viên lo âu, bị chia cắt ($) dội ngược lên tri thức (S₂): họ im lặng, hỏi những câu lạ, hoặc bỏ học, buộc giáo trình thêm chú thích và nhà trường phải đổi chương trình.']},
 analyst:{g:3,n:'Nhà phân tâm',a:'a',o:'$',t:'S2',p:'S1',tag:'Giữ một chỗ trống để ham muốn lên tiếng',
  d:'Nhà phân tâm không khuyên bảo mà làm chỗ trống cho ham muốn của người bệnh. Ông chú ý những chỗ lời nói trượt đi: lỡ lời, hành động hỏng, giấc mơ, nơi sự chia cắt lộ ra. Người bệnh làm việc bằng liên tưởng, và công việc ấy cho ra một cái biểu đạt-chủ mới, một ngõ cụt cần được nối lại với các cái biểu đạt khác. Dưới sự thật là tri thức vô thức, thứ đã có sẵn mà chủ thể chưa nhận: nơi nó đã ở, chủ thể phải đến.',
  r:['Nhà phân tâm làm nguyên nhân của ham muốn','Người bệnh bị chia cắt, được mời lên tiếng','Tri thức vô thức: biết mà chưa biết mình biết','Một cái biểu đạt-chủ mới (la bêtise)'],ex:'Cô nghiên cứu sinh nói suốt nửa giờ về Bakhtin, mạch lạc đến mức ai cũng gật đầu. Rồi cô lỡ miệng gọi giáo sư hướng dẫn là “bố” và cười xòa cho qua. Nhà phân tâm không hỏi thêm gì về Bakhtin; ông chỉ để chữ vừa lỡ ấy treo lơ lửng, không giải thích, không tranh luận lý thuyết.',dx:['Tri thức vô thức (S₂) nằm dưới vạch nhưng tác động lên người bệnh ($) từng ngày: nó lọt ra qua giấc mơ, lỡ lời, một triệu chứng lặp đi lặp lại.','Chữ mới bật ra (S₁) quay về làm lệch chỗ đứng của nhà phân tâm (a): ông phải đổi cách đứng để vẫn giữ chỗ nguyên nhân của ham muốn, thay vì đem giải thích chữ ấy.']},
 hysteric:{g:4,n:'Cuồng loạn',a:'$',o:'S1',t:'a',p:'S2',tag:'Câu hỏi làm chủ nhân lộ chỗ yếu',
  d:'Người cuồng loạn quay sang chủ nhân và đòi: “ông giỏi đến đâu, thử chứng minh bằng tri thức thật xem”, rồi chỉ ra chỗ còn hổng. Lacan cuối cùng gắn cấu trúc này với khoa học ở dạng tốt nhất: như giới hạn của Heisenberg, nó trung thành với điều không khớp. Chính những người cuồng loạn đã đẩy Freud lập ra phân tâm học, và người đi phân tích nào cũng bị cuồng loạn hóa trong quá trình ấy.',
  r:['Chủ thể bị chia cắt, ham muốn tự mâu thuẫn','Chủ nhân bị buộc phải chứng minh bằng tri thức','Đối tượng a: chỗ không khớp là động cơ ngầm','Tri thức mới, nơi người cuồng loạn hưởng thống lạc'],ex:'Bệnh nhân bác từng chẩn đoán của bác sĩ: “không phải căng thẳng, tôi thấy không phải”. Giống những người bệnh đã buộc Freud sửa lại lý thuyết của mình, hay nhà vật lý cứ đẩy một thuyết đến chỗ nó lộ ra giới hạn, như nguyên lý bất định của Heisenberg. Cả hai đều không chịu nhận một câu trả lời giả.',dx:['Cái không khớp, a, âm ỉ dưới vạch và lọt sang người thầy hay bác sĩ (S₁) qua một ánh nhìn, một câu hỏi lệch. Họ thấy mình bị thử dù chưa ai nói ra.','Lời giải thích mới (S₂) vừa nhận xong thì người bệnh ($) lại thấy chưa đủ, và chỗ chia cắt nhô lên thành một câu hỏi mới.']},
 capitalist:{g:5,n:'Tư bản',a:'$',o:'S2',t:'S1',p:'a',tag:'Vòng quay không phanh: mạch kín không rào cản',
  d:'Lacan nói đến diễn ngôn này lẻ tẻ từ cuối thập niên 1960 và chỉ nêu mô hình cụ thể trong bài giảng ở Đại học Milan năm 1972. Hãy xem nó như một biến thể của diễn ngôn Chủ nhân chứ không phải mắt xích thứ năm: cấu trúc chặt của bốn diễn ngôn kia (bốn vị trí, năm mũi tên một chiều, bốn ký hiệu xoay theo thứ tự cố định) bị phá vỡ, và mọi thứ chạy thành một vòng kín. Cách đọc ở đây nghiêng về logic tiêu dùng hơn là phương thức sản xuất.',
  r:['Chủ thể bất mãn ($) ngồi ở ghế chỉ huy','S₂: khoa học, kỹ thuật dò tìm khoảng trống thị trường','S₁: thương hiệu, sản phẩm, thứ sự thật chuyên chế','a: thống lạc dư thừa, quay lại ám ảnh chủ thể'],ex:'Tối chủ nhật bạn thấy bứt rứt mà không rõ vì sao. Quảng cáo hiện lên đúng lúc: chiếc điện thoại mới “sẽ làm mọi thứ khác đi”. Bạn bấm mua; hộp đến, bạn thích ba hôm; rồi một thông báo mới nhảy ra. Vòng quay chạy tiếp.',dx:['','']}
};

const X=a=>(a||[]).map(t=>'<p>'+t+'</p>').join('');
TE.S1.x=['Vì sao là “1”: nó là cái Một đứng ngoài chuỗi và áp đặt lên chuỗi, khác với S₂ là cái nhiều. Nghĩa của nó đến từ vị trí chứ không từ nội dung: “cứ làm theo lời tôi” không phải mệnh đề đúng hay sai mà là hành vi ra lệnh, nên không thể bác bằng lý lẽ.','Gần với điểm khâu (point de capiton): một cái biểu đạt chặn sự trôi nổi của chuỗi và gán nghĩa hồi tố cho cả chuỗi. “Khủng bố” khâu cả một câu chuyện lại; “trầm cảm” bắt đầu tổ chức toàn bộ trải nghiệm của người bệnh. Hai khái niệm hay được nối với nhau nhưng không đồng nhất, và S₁ cũng không phải S(Ⱥ), cái biểu đạt của thiếu hụt trong Cái khác.'];
TE.S2.x=['Là cái nhiều: mạng lưới quy tắc, kỹ năng, quy trình. Theo mạch Hegel, người nô lệ nắm tri thức vì họ làm việc, còn chủ nhân chỉ ra lệnh nên phụ thuộc vào họ. Khi S₂ lên ghế tác nhân (Học thuật), tri thức thành bộ máy quản lý. Vì là chuỗi nên nó không bao giờ khép kín: luôn cần thêm nghiên cứu, thêm chuyên gia.','Ở vị trí sự thật của phân tâm, tri thức không phải thứ đưa từ ngoài vào mà đã nằm trong triệu chứng, lỡ lời, giấc mơ. Phân tích không dạy điều mới, nó để tri thức ấy được chủ thể nhận về.'];
TE.$.x=['Dấu gạch không phải phủ định hay xóa bỏ mà là sự chia cắt: chủ thể không trùng khớp với chính mình, luôn nói nhiều hơn hoặc ít hơn điều muốn nói. Cũng không nhầm $ với cái “tôi” (ego), vốn là hình ảnh ta đồng nhất ở giai đoạn gương. Cái tôi mô tả được (tôi là giáo viên, là cha); $ là chỗ thiếu trong mọi mô tả ấy.','Thiến biểu tượng là cái giá của việc bước vào ngôn ngữ: ta đổi sự trọn vẹn trực tiếp của trải nghiệm lấy từ ngữ, vốn luôn gián tiếp, nên nói “tôi đau” không truyền đi đúng cơn đau. Ham muốn mọc lên từ khoảng hụt đó.'];
TE.a.x=['Là “autre” viết thường (cái khác nhỏ), phân biệt với Autre viết hoa (Cái khác lớn, trật tự biểu tượng). Nó không phải thứ ta muốn mà là thứ khiến ta muốn: hào quang của chiếc điện thoại chứ không phải cái máy. Có rồi thì hào quang tan, vì a chỉ tồn tại như nguyên nhân, không như vật sở hữu được.','Thống lạc dư thừa (plus-de-jouir) mượn từ giá trị thặng dư của Marx: phần thừa ra không về tay người tạo ra nó mà bị hệ thống thu lấy, và chính phần dư ấy giữ cho cỗ máy chạy.'];
PO.agent.x=['Là vị trí cấu trúc chứ không phải một con người: ông chủ đứng ở đây trong diễn ngôn Chủ nhân nhưng ở vị trí cái khác khi bị chất vấn. Tác nhân không biết sự thật nằm dưới mình nên tưởng mình là trung tâm. Trong diễn ngôn Nhà phân tâm, a ở đây là một vẻ ngoài cấu trúc (semblant): nhà phân tâm làm nguyên nhân của ham muốn chứ không phải là nó.'];
PO.other.x=['Cần phân biệt người đối diện cụ thể (autre) với trật tự biểu tượng đứng sau (Autre): ta nói với một cá nhân nhưng luôn qua ngôn ngữ và xã hội. “Làm việc” nghĩa là sản xuất ra sản phẩm của diễn ngôn (nô lệ lao động, sinh viên tiếp thu, bệnh nhân liên tưởng). Họ cũng có thể cản lại bằng lười biếng, im lặng, bỏ học, và đó là phần diễn ngôn không thu nạp được.'];
PO.truth.x=['Không phải “sự thật” theo nghĩa khoa học mà là cái nền tác nhân dựa vào nhưng không thừa nhận. Lacan nói sự thật chỉ có thể được bán nói (mi-dire): nói nửa vời, qua ám chỉ và lỡ lời, vì nói trọn thì diễn ngôn sụp.'];
PO.product.x=['Sản phẩm luôn là chỗ đánh đổi: được cái này thì mất cái kia, và phần dư của nó không bị hệ thống tiêu hóa hết. Phần dư ấy dội về tác nhân qua mũi tên chéo và là nguyên liệu cho diễn ngôn kế tiếp trong vòng quay. Quan hệ giữa sản phẩm và sự thật là chỗ bất lực: sản phẩm không với tới sự thật.'];
const IM={master:'cai trị',university:'giáo dục',analyst:'phân tích',hysteric:'làm cho ham muốn (faire désirer)'};
const CON=[
['Điểm khâu (point de capiton)','Chỗ mà chuỗi biểu đạt đang trôi được “khâu” vào ý nghĩa, và ý nghĩa ấy tác động hồi tố lên cả chuỗi. Chữ “tự do” trôi nổi cho đến khi có người khâu nó vào “tự do tư bản” hay “tự do xã hội chủ nghĩa”. Gắn chặt với S₁.'],
['Thống lạc (jouissance)','Không phải niềm vui thông thường mà là sự hưởng vượt quá nguyên tắc khoái lạc, lẫn với đau và mất mát: thứ ta vẫn “hưởng” khi khổ sở. Phần thưởng ngầm ấy giữ người ta ở lại trong một diễn ngôn. Phần dư của nó, thống lạc dư thừa, mới là thứ Lacan đặt ở vị trí sản phẩm trong diễn ngôn Chủ nhân.'],
['Vẻ ngoài cấu trúc (semblant)','Không phải giả dối mà là “không phải chính nó”: một vai có chức năng cấu trúc. Nhà phân tâm làm a mà không phải a; S₁ đóng vai quyền lực che chỗ thiếu.'],
['Bán nói (mi-dire)','Sự thật chỉ nói được một nửa. Không diễn ngôn nào nói trọn nó, vì phần còn lại thuộc cái thực, và chính vì thế nó rò rỉ qua lỡ lời và triệu chứng.'],
['Bất khả và bất lực','Theo Hội thảo XVII, bất khả nằm ở quan hệ tác nhân → cái khác: cai trị, giáo dục, phân tích (ba nghề “bất khả” của Freud) và làm cho ham muốn ở Cuồng loạn. Bất lực nằm ở quan hệ giữa sản phẩm và sự thật, tức đường đứt nét ở hàng dưới. Lacan không nêu bất khả cho diễn ngôn Tư bản.'],
['Autre và autre','Autre (Cái khác lớn): ngôn ngữ, trật tự biểu tượng, “người ta”. Autre nhỏ: người đối diện cụ thể và cũng là gốc của chữ a. Extimité (thân mật ngoại lai) gọi cái gần nhất bên trong mà lại xa lạ như từ ngoài tới; đối tượng a là ví dụ.'],
['Hegel và Marx','Diễn ngôn Chủ nhân dựa trên quan hệ chủ–tớ của Hegel: chủ nhân hưởng thụ nhưng không biết làm, nên phụ thuộc vào tri thức của nô lệ. Marx cho Lacan mô hình của thống lạc dư thừa: như giá trị thặng dư, phần dư bị chiếm lấy và thành động cơ của hệ thống.']];

other:['S₂ ở đây là người bị gọi vào làm việc. Họ trở thành chỗ chứa tri thức và kỹ năng, nhưng tri thức ấy bị trưng dụng: chủ nhân cần kết quả chứ không cần hiểu nó chạy ra sao.','Bếp trưởng đập tay lên bàn inox: “ba phút nữa phải xong món!”. Phụ bếp vặn lửa nhỏ đúng một nấc, đảo chảo đúng hai nhịp; bếp trưởng chẳng cần biết vì sao món ngon.'],

product:['Sản phẩm là chủ thể bị chia cắt: nhận đầy kiến thức nhưng không biết mình muốn gì, vì chính ham muốn của họ bị tri thức bỏ ra ngoài.','Cậu sinh viên tốt nghiệp loại giỏi nộp hai mươi hồ sơ xin việc, và khi người phỏng vấn hỏi “bạn muốn gì?”, cậu mở miệng mà không thốt ra được chữ nào.']},

other:['$ ở đây là người bệnh được đặt vào chỗ làm việc: nói, liên tưởng. Sự chia cắt của họ không bị che đi mà được đưa ra ánh sáng.','Cô kể: “tôi yêu mẹ lắm”, rồi ngay sau đó: “nhưng tôi ghét phải về nhà”. Nhà phân tâm không nói gì, chỉ nghiêng đầu đúng chỗ hai câu ấy đụng nhau.'],
truth:['S₂ ở chỗ sự thật là tri thức vô thức: điều người bệnh đã biết mà chưa biết mình biết. Phân tâm không áp lý thuyết từ ngoài vào.','Anh quên đúng cuộc hẹn với một người nhất định, lần này đến lần khác, dù ghi lịch cẩn thận. Cái quên ấy “biết” điều anh chưa chịu nhận.'],
product:['S₁ là cái biểu đạt-chủ mới: một chữ bật ra, vô nghĩa và đột ngột, nơi liên tưởng dừng lại. Từ đó có thể bắt đầu một cách khâu nối khác.','Sau nhiều tuần kể chuyện vòng vo, bỗng một chữ bật ra: “tha lỗi”. Người bệnh sững lại, vì hóa ra mọi chuyện bấy lâu đều quay quanh nó.']},

product:['S₂ là tri thức mới sinh ra nhờ bị chất vấn. Nó không bao giờ đủ, và mỗi câu trả lời lại mở ra một câu hỏi mới.','Một thí nghiệm đi ngược thuyết đang dạy trong sách buộc thuyết phải sửa. Rồi bản sửa lại bị thí nghiệm kế tiếp tìm ra một chỗ không khớp mới.']},
capitalist:{
agent:['$ ở ghế tác nhân: chính sự bất mãn thúc cho cỗ máy chạy, không cần ai ra lệnh. Cảm giác “mình thiếu gì đó” được coi như một nhu cầu cần được đáp ứng.','Chiều chủ nhật thấy trống trải, bạn mở ứng dụng mua sắm “cho vui” và cuộn mãi mà không rõ mình đang tìm gì.'],
other:['S₂ là bộ máy khoa học, kỹ thuật, tiếp thị. Nó bị gọi vào việc tìm khoảng trống thị trường và lấp lại bằng sản phẩm mới.','Thuật toán đưa ra đúng đôi giày bạn vừa ngắm ba giây; sau lưng là cả phòng phân tích dữ liệu đang tính xem bạn dừng ở màu nào.'],
truth:['S₁ ở chỗ sự thật là thương hiệu, sản phẩm đóng vai câu trả lời có sẵn: “cứ có cái này là ổn”. Nó chuyên chế vì không ai chất vấn lời hứa ấy.','Quảng cáo hứa “cuộc sống tốt hơn”, không ghi tốt hơn ở chỗ nào. Lời hứa không cần chứng minh; nó chỉ nằm đó làm nền cho mọi thứ.'],
product:['a là thống lạc dư thừa: mua xong thì hào quang tan, còn lại trống rỗng và quay về ám ảnh chủ thể, đẩy họ đi tìm món kế.','Mở hộp điện thoại mới, thích rõ rệt; ba tuần sau mắt bạn đã dõi theo mẫu kế tiếp trên quảng cáo.']}};

const AR={
top:{n:'Mũi tên trên: tác nhân → cái khác',s:'Lời hướng đến · chỗ của bất khả',f:d=>d===D.capitalist?'mũi tên này biến mất, hệ thống không nói với ai mà chỉ chạy.':T(d.a)+' → '+T(d.o),t:['Là mũi tên cơ bản nhất: hành vi nói, lời gọi. Nó không bình đẳng: tác nhân đặt người kia vào chỗ nghe, tuân theo, làm việc, tức là sự tha hóa nền tảng của mọi diễn ngôn.','Lacan đặt bất khả (impossibilité) ở đây, theo Freud là ba nghề “bất khả” (cai trị, giáo dục, phân tích), và ở Cuồng loạn là làm cho ham muốn. Dù cố đến đâu, người kia không bao giờ khớp hoàn toàn với điều tác nhân nhắm tới.'],ex:'Cô giáo giảng đi giảng lại nhưng không thể bảo đảm học sinh hiểu đúng như điều cô nghĩ.'},
bottom:{n:'Mũi tên dưới: sản phẩm → sự thật',s:'Chỗ của bất lực',f:d=>d===D.capitalist?'mũi tên này không được vẽ ở dạng này.':T(d.p)+' → '+T(d.t),t:['Cái được sản xuất ra không với tới sự thật đã sinh ra nó. Lacan gọi đó là bất lực (impuissance).','Vì thế sản phẩm không bao giờ giải quyết được sự thật: diễn ngôn cứ chạy mà nút thắt gốc vẫn nguyên.'],ex:'Ông chủ có thêm bao nhiêu lợi nhuận cũng không hết sợ bị lộ ra là không nắm việc.'},
left:{n:'Mũi tên trái: sự thật → tác nhân',s:'Động cơ thầm kín',f:d=>d===D.capitalist?T(d.a)+' → '+T(d.t)+' (đổi chiều xuống).':T(d.t)+' → '+T(d.a),t:['Sự thật chống đỡ và thúc đẩy tác nhân nhưng tác nhân không biết: nó tưởng mình hành động vì lý do khác. Vạch ngang giữa hai hàng là chỗ sự thật bị dồn nén, nên chỉ được bán nói (mi-dire).','Ở diễn ngôn Tư bản mũi tên này đổi chiều xuống, từ tác nhân tới sự thật, nên không còn gì chặn.'],ex:'Một giám đốc luôn nói “vì kỷ luật”, trong khi nỗi sợ mất quyền mới là cái thúc ông.'},
right:{n:'Mũi tên phải: cái khác → sản phẩm',s:'Lao động',f:d=>T(d.o)+' → '+T(d.p),t:['Cái khác làm việc (lao động, tiếp thu, liên tưởng, chất vấn) và qua đó sinh ra sản phẩm của diễn ngôn. Nhưng sản phẩm thường không thuộc về người làm ra nó: nó bị tác nhân hoặc hệ thống thu lấy, hoặc quay lại thành một cái đánh đổi.'],ex:'Người thợ làm ra hàng; phần giá trị dôi ra về tay chủ, còn họ nhận tiền công.'},
crossT:{n:'Mũi tên chéo: sự thật → cái khác',s:'Dòng chảy ngầm · rò rỉ',f:d=>T(d.t)+' → '+T(d.o),t:['Đi từ hàng dưới lên hàng trên, cắt qua vạch ngăn. Khác với mũi tên ngang phía trên, vốn là lời hướng đến cái khác một cách trực tiếp, nó cho thấy yếu tố bị dồn nén lưu chuyển bên trong diễn ngôn.','Sự thật → cái khác: tác động vô thức của sự thật lên cái khác. Dù bị dồn nén dưới vạch, sự thật vẫn rò qua lỡ lời, triệu chứng hay tiền giả định ngầm, để tác động đến người hay hệ thống được hướng tới.'],ex:''},
crossP:{n:'Mũi tên chéo: sản phẩm → tác nhân',s:'Dòng chảy ngầm · phản hồi',f:d=>T(d.p)+' → '+T(d.a),t:['Mũi tên chéo thứ hai cũng đi từ hàng dưới lên hàng trên, cắt qua vạch.','Sản phẩm → tác nhân: phần dư quay ngược lại tác động lên tác nhân. Cái được sinh ra không biến mất mà dội về, ám ảnh và thúc đẩy (hoặc làm lệch) người đang nói, nên diễn ngôn cứ phải chạy tiếp.'],ex:''},
bar:{n:'Rào cản (vạch ngăn hai hàng)',s:'Sự dồn nén',f:d=>d===D.capitalist?'vạch vẫn còn trong công thức nhưng mất tác dụng chặn (vẽ đứt nét mờ, nhãn “đã thủng”).':'vạch chắn giữa hàng trên và hàng dưới (vẽ nét liền màu cam).',t:['Vạch ngang tách bề mặt ý thức (tác nhân, cái khác) khỏi nền ẩn (sự thật, sản phẩm). Nó là sự kháng cự, ngăn sự thật tác động trực tiếp lên tác nhân. Nhờ nó diễn ngôn mới ổn định và che được sự thật.','Khi rào cản mất tác dụng, như ở diễn ngôn Tư bản, mạch chạy kín và không còn chỗ dừng, nên Lacan nói nó chạy quá nhanh và tự tiêu rụi.'],ex:'Ta biết lờ mờ vì sao mình hay mua sắm mỗi lần buồn, nhưng vạch ngăn ấy giữ cho điều đó không thành lời.'}};

const ARD={
master:{
top:['S₁ → S₂: mệnh lệnh hướng vào tri thức, chủ nhân giao việc cho người biết làm. Bất khả ở đây là cai trị: lệnh không bao giờ khớp trọn với việc làm, vì người làm luôn giữ lại phần biết-làm không chuyển hết cho chủ.','Ông chủ xưởng ra hạn “tuần sau giao 1000 sản phẩm”. Thợ cả chỉ nói đủ để xong việc, còn mẹo chỉnh máy ông giữ lại.'],
bottom:['a → $: bất lực. Phần dư chủ nhân thu về không bao giờ chữa được sự chia cắt của chính ông.','Xưởng lãi kỷ lục, nhưng ông chủ vẫn lo bị khách hàng coi thường.'],
left:['$ → S₁: sự chia cắt bị giấu là động cơ thúc ông ra lệnh. Lệnh càng chắc nịch, chỗ chống đỡ càng mong manh.','Người cha quát “bố bảo thế là thế” vì chính ông không chắc mình đúng.'],
right:['S₂ → a: tri thức của người làm biến thành phần dư. Cái họ làm ra vượt quá điều đủ trả công, và phần vượt ấy thành giá trị thặng dư, thống lạc dư thừa.','Người thợ cải tiến quy trình khiến năng suất tăng; phần tăng thêm được ghi vào lợi nhuận của xưởng.'],

university:{

bottom:['$ → S₁: bất lực. Người học, tức chủ thể chia cắt do hệ thống tạo ra, không với tới được mệnh lệnh ngầm đứng sau tri thức để chất vấn nó.','Sinh viên phản biện được nội dung môn học, nhưng không thể hỏi vì sao chỉ tiêu tuyển sinh lại là 500.'],
left:['S₁ → S₂: mệnh lệnh ngầm (chỉ tiêu, ngân sách) chống đỡ tri thức, và tri thức giả như độc lập với nó.','Bệnh viện áp định mức số ca mỗi buổi; bác sĩ viện dẫn bằng chứng y khoa để biện minh cho khung thời gian ấy.'],
right:['a → $: con người bị làm đối tượng thì ra thành chủ thể chia cắt, biết nhiều mà không biết mình muốn gì.','Học sinh bị xếp loại “giỏi, khá, yếu”; lớn lên em chỉ còn biết mình giỏi hay yếu, chứ không biết mình thích gì.'],
crossT:['S₁ → a: mệnh lệnh ngầm rò xuống người học dưới dạng áp lực thành tích, dù không ai ra lệnh.',null],crossP:['$ → S₂: sản phẩm chia cắt dội ngược lên tri thức, khiến nó luôn thấy mình thiếu và đòi thêm chương trình, thêm khóa học.',null]},
analyst:{

bottom:['S₁ → S₂: bất lực. Chữ mới bật ra không bao giờ đủ để thành tri thức trọn vẹn về chính mình.','Tìm ra chữ “tha lỗi” rồi, người bệnh vẫn không thể nói “giờ tôi hiểu hết mình”.'],
left:['S₂ → a: tri thức vô thức, chưa được chủ thể hóa, là chỗ dựa của nhà phân tâm. Ông không biết hộ, chỉ tin rằng tri thức ấy đã có sẵn nơi người bệnh.','Ông không đoán đáp án mà coi việc người bệnh lặp lại chuyện quên hẹn là điều có nghĩa.'],

crossT:['S₂ → $: tri thức vô thức rò qua vạch vào lời của người bệnh, dưới dạng lỡ lời, giấc mơ, triệu chứng.',null],crossP:['S₁ → a: chữ mới bật ra làm lệch cách nhà phân tâm giữ chỗ nguyên nhân; buổi sau ông phải đứng ở một chỗ khác.',null]},
hysteric:{

bottom:['S₂ → a: bất lực. Tri thức mới sinh ra không chạm tới được nguyên nhân thật của câu hỏi.','Bác sĩ giải thích thêm một triệu chứng, bệnh nhân vẫn thấy “chưa phải chỗ đó”.'],

right:['S₂ → a: bộ máy kỹ thuật, tiếp thị liên tục sản xuất thống lạc dư thừa dưới dạng sản phẩm mới.','Phiên bản mới chỉ khác chút ít, nhưng quảng cáo khiến người ta thấy “phải có”.'],
crossT:['S₁ → S₂: thương hiệu kích hoạt cả bộ máy nghiên cứu và quảng cáo. Mũi tên này giữ nguyên như ở bốn diễn ngôn kia.','Thương hiệu tung chiến dịch “thay đổi cuộc sống”, nhóm quảng cáo và nghiên cứu thị trường chạy theo.'],crossP:['a → $: phần dư quay về làm chủ thể bất mãn hơn, rồi vòng lặp chạy tiếp. Đây là chỗ thấy rõ nhất đối tượng a ám ảnh chủ thể.','Mở hộp xong thấy trống nên bạn đi tìm món kế tiếp.']}};
const ARB=k=>{const a=AR[k],e=ARD[cur]&&ARD[cur][k],g=a.t.map(x=>'<p>'+x+'</p>').join(''),x=e&&(e[1]||(D[cur].dx&&D[cur].dx[k==='crossP'?1:0]));return e?'<p>'+e[0]+'</p><p class="ex"><b style="font-size:13px">Ví dụ.</b> '+x+'</p>'+(ARX[cur]&&ARX[cur][k]?'<p class="ex"><b style="font-size:13px">Ví dụ khác.</b> '+ARX[cur][k]+'</p>':'')+'<p class="note">'+(cur==='capitalist'&&k==='bottom'?'So với bốn diễn ngôn chuẩn:':'Cấu trúc chung của mũi tên này:')+'</p>'+g+(a.ex?'<p class="ex"><b style="font-size:13px">Ví dụ chung.</b> '+a.ex+'</p>':''):g+'<p class="ex"><b style="font-size:13px">Ví dụ.</b> '+a.ex+'</p>'};
AR.bar.t=['Vạch ngang tách bề mặt ý thức (tác nhân, cái khác) khỏi nền ẩn (sự thật, sản phẩm). Nó là sự kháng cự: ngăn sự thật trực tiếp tác động lên tác nhân và ngăn sản phẩm trực tiếp quay lại cái khác.','Nhờ có nó diễn ngôn mới ổn định, tức là che giấu được sự thật. Sự thật chỉ lọt qua dưới dạng lỡ lời, triệu chứng, tiền giả định ngầm, tức hai mũi tên chéo xuyên qua vạch.','Ở diễn ngôn Tư bản, vạch vẫn được viết trong công thức nhưng mất tác dụng chặn: mạch chạy kín, nên Lacan nói nó chạy quá nhanh và tự tiêu rụi.'];
ARD.master.bar=['Vạch giấu $ khỏi S₁: ông chủ không được nhận mình chia cắt. Nó cũng giữ a tách khỏi S₂: phần dư không quay lại tay người làm ra nó.','Trong cuộc họp ông không bao giờ để lộ nỗi sợ, và phần lợi nhuận dôi ra không bao giờ quay lại bảng lương của thợ.'];
ARD.university.bar=['Vạch giấu S₁ dưới S₂: mệnh lệnh không bao giờ được nói như mệnh lệnh. Nó cũng giữ $ tách khỏi a: sự chia cắt của người học không quay lại thành tiếng nói trong hệ thống.','Chỉ tiêu không in trong giáo trình, và nỗi lạc lối của sinh viên không thành nội dung của môn học nào.'];
ARD.analyst.bar=['Vạch giấu S₂ dưới a: tri thức vô thức nằm dưới mặt nạ nên người bệnh chưa biết mình biết. Đây là sự dồn nén mà phân tích từng bước làm lọt, qua lỡ lời và giấc mơ.','Người bệnh quên hẹn lần này đến lần khác; mỗi lần quên là một khe hở của vạch, và nhà phân tâm chú ý đúng chỗ đó.'];
ARD.hysteric.bar=['Vạch giấu a dưới $: chủ thể không nói được vì sao mình thấy thiếu. Nó cũng giữ S₂ tách khỏi S₁, nên tri thức mới không dập tắt được câu hỏi.','Cô không biết gọi tên cái thiếu, và dù được giải thích thêm bao nhiêu, câu hỏi vẫn còn nguyên.'];
ARD.capitalist.bar=['Vạch vẫn nằm trong công thức nhưng không còn chặn: S₁ không bị giấu dưới $ mà hiện rõ thành thương hiệu, và a quay thẳng về $ mà không bị giữ lại. Diễn ngôn mất ổn định vì không còn chỗ dừng và nó chạy quá nhanh đến mức tự thiêu.','Từ cảm giác thiếu đến món hàng chỉ mất vài giây và một cú chạm, không có khoảng dừng nào để hỏi vì sao mình muốn.'];

AR.top.t=['Là mũi tên cơ bản nhất của diễn ngôn: hành vi nói của tác nhân gửi tới cái khác. Cấu trúc này không phải cuộc trò chuyện giữa hai người mà là một liên kết xã hội: nó định ra ai nói, ai nghe, ai làm. Đó là sự tha hóa nền tảng, vì cái khác bị đặt vào một chỗ không do họ chọn.','Lacan liên hệ cấu trúc bất khả với ba nghề Freud gọi là bất khả: cai trị, giáo dục và phân tâm. Không nên biến Cuồng loạn thành “nghề bất khả thứ tư”. Ở Cuồng loạn, $ chất vấn S₁ và đòi câu trả lời, nhưng không câu trả lời nào có thể khép kín ham muốn. Bất khả không chỉ là việc khó; nó là giới hạn cấu trúc của quan hệ tác nhân–cái khác.'];
AR.bottom.t=['Là mũi tên đi từ sản phẩm về sự thật. Bất lực (impuissance) nghĩa là cái diễn ngôn sản xuất ra không đủ sức chạm tới sự thật đã sinh ra nó: sản phẩm không trả lời được cho nguyên nhân của chính mình.','Khác bất khả (cấu trúc của lời gọi), bất lực là cấu trúc của kết quả. Hai thứ cùng giữ diễn ngôn chạy: bất khả khiến nó cố gắng, bất lực khiến nó phải lặp lại.'];
AR.left.t=['Sự thật chống đỡ tác nhân: nó là cái “vì sao” tác nhân đứng ở đó, nhưng nằm dưới vạch nên tác nhân không biết. Lacan nói sự thật chỉ có thể được bán nói (mi-dire), vì nói trọn thì làm sụp chỗ đứng của tác nhân.','Ở diễn ngôn Tư bản mũi tên này đổi chiều xuống, từ tác nhân tới sự thật, nên sự thật không còn là điều bị giấu mà là cái tác nhân chạy thẳng tới.'];
AR.right.t=['Cái khác là bên làm việc: mọi diễn ngôn đều đặt ai đó vào chỗ sản xuất. Điều Lacan nhấn mạnh là cái họ làm ra không trở lại làm cho họ trọn vẹn: sản phẩm bị tách khỏi người làm, đó là hình thức tổng quát của sự tha hóa trong lao động.','Về mặt Marx, giá trị thặng dư gọi tên điều ấy; về mặt Lacan, thống lạc dư thừa gọi tên nó.'];
AR.crossT.t=['Đi từ hàng dưới lên hàng trên, cắt qua vạch ngăn. Khác với mũi tên ngang phía trên, vốn là lời nói công khai, nó là đường của cái không được nói: yếu tố bị dồn nén lưu chuyển bên trong diễn ngôn.','Sự thật → cái khác: dù bị dồn nén dưới vạch, sự thật vẫn tác động lên người nhận qua lỡ lời, triệu chứng, tiền giả định ngầm. Cái khác phản ứng với điều không được nói chứ không chỉ với điều đã nói.'];
AR.crossP.t=['Cũng đi từ dưới lên trên, nhưng theo hướng từ kết quả về người đã tạo ra nó.','Sản phẩm → tác nhân: phần dư không biến mất mà dội về, ám ảnh và thúc đẩy hoặc làm lệch người đang nói. Đây là cơ chế khiến diễn ngôn lặp lại: cái dư của vòng này thành nguyên liệu của vòng sau.'];
AR.bar.t.push('Về lý thuyết, vạch này là vạch của sự dồn nén: trong công thức nó là vạch phân số, đọc “tác nhân trên sự thật”, cái nói ra nằm trên, cái làm cơ sở nằm dưới. Cái ở dưới vạch không bị xóa, mà bị tách khỏi lời nói trong khi vẫn cấu thành nó.');
AR.bar.n='Vạch ngăn / dồn nén (không đồng nhất với hai gạch phân số)';

 ['a · đối tượng a / thống lạc dư thừa (plus-de-jouir)','Objet petit a là nguyên nhân của ham muốn. Plus-de-jouir là thống lạc dư thừa, liên hệ với a khi a xuất hiện ở vị trí sản phẩm trong một số diễn ngôn. Hai khái niệm có liên hệ nhưng không hoán đổi tùy tiện. a cũng không phải món hàng hay “cái Thực” nói chung.'],
 ['Bốn vị trí','Tác nhân/vẻ ngoài cấu trúc (trên-trái), cái khác (trên-phải), sự thật (dưới-trái), sản phẩm (dưới-phải). Vị trí cố định; bốn ký hiệu luân phiên qua chúng theo phép quay một phần tư. “Cái khác” ở đây không đồng nhất máy móc với Autre viết hoa.'],
 ['Năm mũi tên và //','Năm mũi tên: tác nhân → cái khác; sự thật → tác nhân; sự thật → cái khác; cái khác → sản phẩm; sản phẩm → tác nhân. Dưới cùng là sản phẩm // sự thật: bất lực, không phải mũi tên thứ sáu.'],
 ['Bất khả và bất lực','Bất khả (impossibility) là giới hạn cấu trúc của quan hệ tác nhân–cái khác. Bất lực (impotence) là sự đứt đoạn giữa sản phẩm và sự thật: sản phẩm không giải quyết được sự thật đã chống đỡ diễn ngôn. Không được dùng hai thuật ngữ như từ đồng nghĩa.'],
 ['Thứ tự quay','Ở đây dùng quy ước quay theo chiều kim đồng hồ: Chủ nhân → Cuồng loạn → Nhà phân tâm → Học thuật → Chủ nhân. Quay ngược chiều kim đồng hồ thì ra thứ tự Chủ nhân → Học thuật → Nhà phân tâm → Cuồng loạn → Chủ nhân. Hai chiều đều hợp lệ, chỉ cần nói rõ quy ước; đây không phải tiến trình lịch sử hay các giai đoạn phát triển tâm lý.'],
 ['Thống lạc (jouissance)','Không đồng nghĩa với niềm vui hay khoái lạc thông thường. Đây là khái niệm về một kiểu hưởng-thụ gắn với thân thể, lặp lại và phần vượt quá nguyên tắc khoái lạc; không nên đặt thống lạc cố định ở vị trí sản phẩm trong mọi công thức.'],
 ['Vẻ ngoài cấu trúc (semblant)','Không chỉ là giả dối. Trong cách triển khai về sau, tác nhân là vị trí vẻ ngoài cấu trúc: một vị trí được đảm nhận để diễn ngôn vận hành. Nhà phân tâm ở vị trí a/vẻ ngoài cấu trúc không có nghĩa nhà phân tâm “là” đối tượng a.'],
 ['Hegel và Marx','Hegel giúp đọc quan hệ Chủ nhân–người làm và việc tri thức thực hành nằm ở phía người bị sai khiến. Marx cung cấp tương đồng giữa giá trị thặng dư và thống lạc dư thừa. Đây là tương đồng cấu trúc, không phải phép đồng nhất hai hệ lý thuyết.'],
 ['Đọc cùng Écrits','Écrits không trình bày hệ thống matheme bốn diễn ngôn như Seminar XVII. Nhưng các luận điểm về chữ/cái biểu đạt (“Seminar on The Purloined Letter”, “The Instance of the Letter”), chủ thể chia cắt (“The Subversion of the Subject”, “Position of the Unconscious”), đối tượng a (“Overture”), và vị trí nhà phân tâm/sự thật (“The Direction of the Treatment”, “Science and Truth”) tạo nền để đọc diễn ngôn.']

 <p><b>Địa vị lý thuyết.</b> Đây là biến thể hậu kỳ của diễn ngôn Chủ nhân, được Lacan phác họa trong bài giảng Milan năm 1972. Nó không phải “diễn ngôn thứ năm” được tạo ra bằng phép quay một phần tư giống bốn công thức kinh điển; một số tác giả gọi nó là diễn ngôn thứ năm để tiện trình bày, nhưng về cấu trúc nên đánh dấu nó là một biến thể.</p>
 <p><b>Bốn biến đổi so với Chủ nhân:</b> (1) $ và S₁ đổi chỗ; (2) mũi tên bên trái đảo chiều, từ sự thật → tác nhân thành tác nhân → sự thật ($ → S₁); (3) mũi tên ngang phía trên (tác nhân → cái khác) bị xóa, nên không còn bất khả; (4) dấu // ở hàng dưới không còn, nên không còn bất lực. Mũi tên bên phải và hai đường chéo vẫn còn. Hai gạch phân số vẫn được viết trong công thức nhưng không còn chặn.</p>
 <p><b>Vòng khép kín:</b> $ → S₁ (mũi tên trái), S₁ → S₂ (đường chéo 1), S₂ → a (mũi tên phải), a → $ (đường chéo 2). Mỗi vị trí chỉ có đúng một mũi tên vào và một mũi tên ra, nên sản phẩm không dừng ở đâu cả: phần dư a quay thẳng về chủ thể và trở thành đầu vào của lượt kế tiếp.</p>
 <p><b>Vì sao khép kín khác bốn diễn ngôn chuẩn.</b> Ở bốn diễn ngôn chuẩn mạch bị hở ở hai chỗ: lời gọi ở hàng trên không bao giờ khớp (bất khả) và sản phẩm không với tới sự thật (bất lực). Chính hai chỗ hở ấy làm diễn ngôn phải dừng, lặp lại và khởi động lại. Ở biến thể Tư bản cả hai chỗ hở đều không còn, nên sự thiếu hụt luôn được chuyển ngay thành lượt vận hành kế tiếp. Khép kín không có nghĩa nhu cầu được thỏa mãn; nó chỉ có nghĩa là không còn chỗ nào để dừng. Lacan cảnh báo vòng này chạy quá nhanh và có thể tự đốt cạn chủ thể.</p>

function frame(){

    o.g.scale.setScalar((hov===k?1.15:1)*(1+(u<1?.18*Math.sin(Math.PI*u):0)));

  });

    E.col.material.color.setHex(TE[hold[k]].c);E.col.material.opacity=(hot?.22:.08)+.02*Math.sin(t*2)});
  Object.entries(frac3D).forEach(([k,f])=>{
    const hot=hotArr===k;
    f.core.material.color.setHex(hot?0xffffff:0xffd166);
    f.core.scale.y=hot?1.55:1;
    f.glow.material.opacity=hot?.52:.24;
    f.highlight.material.opacity=hot?1:.82;
  });
  const fp=flow.geometry.attributes.position,fc=flow.geometry.attributes.color;
  for(let j=0;j<6;j++)for(let i=0;i<M;i++){
    const u=(i/M+t*.22+j*.13)%1,A=paths[j][0],B=paths[j][1],q=.14+.72*u,idx=(j*M+i)*3,f=Math.sin(Math.PI*u)*pathOn[j];
    fp.array.set([A.x+(B.x-A.x)*q,A.y+(B.y-A.y)*q,.12],idx);fc.array.set([pathCol[j].r*f,pathCol[j].g*f,pathCol[j].b*f],idx)}

    else{q.m.scale.setScalar(1+u*1.9);q.m.material.opacity=(1-u)*.9}}

ỉ nhìn bảng sản lượng và chưa bao giờ biết máy chạy vì sao. Cuối tháng, phần lợi nhuận dôi ra vào túi ông; còn đêm nào ông cũng thức vì sợ mình không xứng với chiếc ghế ấy, điều không ai được thấy.", "university": "Cuốn giáo trình dày cộp, mệnh đề nào cũng kèm chú thích “nghiên cứu cho thấy”. Sinh viên ngồi chép, được đo bằng điểm, và dần quên mất câu hỏi riêng mình mang vào lớp. Còn ý chí thật sự của nhà trường, như chỉ tiêu tuyển sinh hay chính sách, nằm lặng lẽ dưới bìa giáo trình.", "analyst": "Cô nghiên cứu sinh nói suốt nửa giờ về Bakhtin, mạch lạc đến mức ai cũng gật đầu. Rồi cô lỡ miệng gọi giáo sư hướng dẫn là “bố” và cười xòa cho qua. Nhà phân tâm không hỏi thêm gì về Bakhtin; ông chỉ để chữ vừa lỡ ấy treo lơ lửng, không giải thích, không tranh luận lý thuyết.", "hysteric": "Bệnh nhân bác từng chẩn đoán của bác sĩ: “không phải căng thẳng, tôi thấy không phải”. Giống những người bệnh đã buộc Freud sửa lại lý thuyết của mình, hay nhà vật lý cứ đẩy một thuyết đến chỗ nó lộ ra giới hạn, như nguyên lý bất định của Heisenberg. Cả hai đều không chịu nhận một câu trả lời giả.", "capitalist": "Tối chủ nhật bạn thấy bứt rứt mà không rõ vì sao. Quảng cáo hiện lên đúng lúc: chiếc điện thoại mới “sẽ làm mọi thứ khác đi”. Bạn bấm mua; hộp đến, bạn thích ba hôm; rồi một thông báo mới nhảy ra. Vòng quay chạy tiếp."};

const N20={"master": {"agent": ["Vị trí phát ngôn: nơi mệnh lệnh được đặt ra và liên kết xã hội bắt đầu vận hành.", "Sức mạnh nằm ở chỗ đứng để nói, không ở nội dung được nói: cùng một câu, đổi người nói thì mất hiệu lực. Nghịch lý là S₁ không biết mình đang được $ chống đỡ từ bên dưới; nó tin quyền uy là tự thân. Khác với Học thuật, nơi mệnh lệnh phải mượn giọng tri thức, ở đây mệnh lệnh không cần mượn gì.", "Một người cha được cả họ nhờ phân xử chuyện đất đai; ông chỉ nói “cứ thế mà làm”, mọi người gật theo, dù lý lẽ của ông chẳng hơn lý lẽ của ai."], "other": ["Vị trí được gọi đến: nơi tri thức và sức lao động bị huy động để thực thi mệnh lệnh.", "Tri thức bị trưng dụng mà không được tiêu hóa: chủ nhân phụ thuộc vào đúng thứ ông ra lệnh, vì thiếu cái biết-làm (savoir-faire) của người làm thì mệnh lệnh chỉ là âm thanh. Khác với Học thuật, nơi S₂ nói thay cho chủ, ở đây S₂ câm lặng và bị tước quyền đặt mục tiêu. Hệ quả: tri thức tích tụ ở người làm nhưng không bao giờ thành quyền lực của họ.", "Chủ tiệm sửa xe chỉ tay: “xong trước trưa”. Anh thợ già nghe tiếng máy là biết con ốc nào lỏng, nhưng chưa ai hỏi anh nên sắp xếp cái tiệm theo cách nào."], "truth": ["Vị trí nền ẩn: điều chống đỡ tác nhân mà chính tác nhân không nhận ra mình đang dựa vào.", "$ là điểm mù cấu trúc, không phải bí mật tâm lý ông chủ cố giấu: ông không thấy nó vì chính chỗ ông đứng đòi hỏi phải không thấy. Nếu thừa nhận, S₁ sụp, vì quyền uy này sống nhờ vẻ toàn vẹn. So sánh chéo: ở Cuồng loạn, $ đứng ở tác nhân và được phơi ra để chất vấn; ở đây nó bị chôn dưới vạch.", "Một cụ trưởng tộc không bao giờ nói “tôi chưa chắc”; hễ ai gợi ý bàn lại thì cụ cắt ngang. Không hẳn vì cụ độc đoán, mà vì cả vị thế sẽ lung lay nếu cụ để lộ một lần đắn đo."], "product": ["Vị trí kết quả: phần dư của vận hành, không quay lại được nền ẩn để chữa nó.", "a là phần dư không thể quy đổi ra giá trị trao đổi: thống lạc dư thừa (plus-de-jouir) là hạt nhân của cả kinh tế của thống lạc lẫn chính trị, vì người ta làm việc không chỉ vì lương mà vì cái dôi ra chưa ai gọi tên. Khác với Tư bản, nơi a được sản xuất có chủ đích, ở đây a dôi ra như hệ quả ngoài dự tính.", "Mùa gặt, tá điền gánh xong số lúa nộp tô vẫn còn dư vài thúng; điền chủ không ghi vào sổ, nhưng đêm nào cũng nhẩm lại, như thể bao nhiêu cũng chưa đủ."]}, "university": {"agent": ["Vị trí phát ngôn: nơi tri thức đứng ra nói thay cho mọi quyền lực khác.", "S₂ nói nhân danh khách quan, nhưng việc chọn chỉ số nào để đo đã là một quyết định của S₁; vị trí này luôn trình bày lựa chọn như phát hiện. Khác với Chủ nhân, nơi mệnh lệnh nói thẳng “vì tôi bảo”, ở đây mệnh lệnh phải mặc áo “vì dữ liệu cho thấy”.", "Nhà trường bảo giờ học thêm “đã được chứng minh hiệu quả”, nhưng chưa ai hỏi vì sao hiệu quả lại đo bằng điểm thi chứ không bằng việc em còn muốn học hay không."], "other": ["Vị trí bị tác động: nơi con người được xếp thành đối tượng để biết, đo và can thiệp.", "a bị khách thể hóa có phương pháp: đó là bạo lực nhận thức luận (cách biết đã định sẵn cái được biết), không phải bạo lực thô. Khác với Nhà phân tâm, nơi a ở tác nhân như cái gây ham muốn, ở đây a là cái bị nhìn; sự đối xử ấy trông như chăm sóc nên càng khó phản kháng.", "Một cụ già vào viện được ghi là “ca té ngã, nguy cơ cao”; cụ muốn kể cái cầu thang nhà cụ gắn với đời cụ ra sao, nhưng mẫu hồ sơ không có dòng nào cho chuyện ấy."], "truth": ["Vị trí nền ẩn: mệnh lệnh chống đỡ tri thức nhưng không được nói ra như mệnh lệnh.", "S₁ ẩn dưới dạng “giá trị hiển nhiên” (hiệu quả, chất lượng, chuẩn mực), nên nguy hiểm hơn S₁ lộ liễu của Chủ nhân: lệnh lộ liễu còn cãi được, còn giá trị hiển nhiên thì chất vấn nó bị coi là thiếu hiểu biết.", "Không ai viết “hãy khiến giảng viên chạy theo bài báo”, chỉ có tiêu chí “chất lượng công bố quốc tế”; hỏi “chất lượng đối với ai?” thì bị coi là lạc đề."], "product": ["$ ở vị trí sản phẩm: hệ thống đo lường con người, rồi thải ra một chủ thể không khớp với chính thước đo ấy.", "Nghịch lý: chủ thể bị sản sinh bởi chính cái đo lường nó, nên chỉ có thể xuất hiện như “cái không khớp”. Khác với Chủ nhân (nơi bị che), Học thuật phơi ra nhưng lại xử lý nó như “vấn đề kỹ thuật” (thiếu động lực, thiếu kỹ năng), chứ không như hiệu ứng cấu trúc của chính tri thức. Đây là hình thức thống trị đặc thù: không che giấu chủ thể, mà xử lý chủ thể.", "Một nghiên cứu sinh đạt mọi chỉ số, nhưng khi hội đồng hỏi “điều gì khiến em thấy công trình này có ý nghĩa”, em không trả lời được — không phải vì em không có câu trả lời, mà vì câu trả lời ấy không có ô để điền."]}, "analyst": {"agent": ["Vị trí phát ngôn: nơi người nghe đứng làm nguyên nhân gợi ham muốn thay vì áp đặt lời giải.", "Nhà phân tâm chiếm chỗ của a nhưng không phải là a: ông chỉ giữ chỗ trống để ham muốn của người kia dựa vào. Nếu ông tin mình thực sự là đối tượng a, cấu trúc đổ thành thôi miên hay quyền uy cá nhân. So sánh chéo: Chủ nhân cũng nói từ vị trí đặc quyền, nhưng đặc quyền ấy bắt người kia làm việc; ở đây nó để người kia lên tiếng.", "Một học viên khoe mới được đề bạt rồi bật cười; nhà phân tâm chỉ hỏi lại “đề bạt?” rồi im. Tiếng cười tắt dần, và anh bắt đầu nói về chuyện anh chưa từng muốn chức ấy."], "other": ["Vị trí được triệu tập: nơi chủ thể chia cắt được mời nói mà không bị chẩn đoán.", "$ được triệu tập chứ không bị điều tra: sự chia cắt được mời lên tiếng thay vì bị gọi tên. So sánh chéo: ở Học thuật, người ở vị trí này bị quy thành đối tượng a để biết và đo; ở đây chính chỗ không khớp được coi là chất liệu làm việc.", "Chị nói sẽ chuyển việc “để tự do hơn”, rồi lỡ miệng: “ở đó đâu có ai coi giờ giấc của mình”. Không ai sửa chị; câu lỡ ấy được để nguyên trên bàn."], "truth": ["Vị trí nền ẩn: tri thức vô thức chống đỡ cuộc làm việc nhưng chưa thuộc về ai.", "Tri thức vô thức không phải tri thức nhà phân tâm sở hữu: nó nằm ở người bệnh, chưa được chủ thể hóa. Đây là khác biệt căn bản với Học thuật, nơi S₂ ở tác nhân và người giữ tri thức cũng là người nói. Ngộ nhận cần tránh: tưởng nhà phân tâm “biết trước” rồi dẫn người bệnh tới đáp án.", "Một người luôn quên tên đúng một đồng nghiệp cũ từng làm anh xấu hổ; nhà phân tâm chưa từng nghe tên ấy, nhưng chuỗi quên của anh đã vạch sẵn đường đi."], "product": ["Vị trí kết quả: nơi một cái biểu đạt-chủ mới bật ra từ chính lời của người nói.", "S₁ được sản xuất là cái biểu đạt-chủ mới chứ không phải chân lý cuối: nó nổi lên từ cái ngớ ngẩn (la bêtise) của chính người nói, một câu vô nghĩa nhưng có sức nặng vì chuỗi ý nghĩa cũ được sắp lại quanh nó. So sánh chéo: ở Chủ nhân, S₁ đứng đầu chuỗi như điểm xuất phát bị áp đặt; ở đây nó đứng cuối như kết quả của lao động.", "Sau cả buổi nói chuyện công việc, chị bật ra “mình chỉ là người cho mượn”; phòng im lặng, vì chị vừa nghe thấy câu ấy dính vào mọi chuyện chị đã kể."]}, "hysteric": {"agent": ["Vị trí phát ngôn: nơi chủ thể chia cắt cất tiếng bằng câu hỏi để thử quyền uy.", "$ chất vấn có phương pháp, không phải bất lực: đó là chiến lược buộc chủ nhân lộ điểm yếu. Ngộ nhận cần tránh: coi đây là tính cách “hay vặn vẹo”. So sánh chéo: ở Tư bản, $ cũng ở tác nhân nhưng không hỏi ai; câu hỏi của nó đã được hàng hóa trả lời trước khi kịp thành câu hỏi.", "Một nhân viên mới cứ hỏi “quy định này sinh ra để bảo vệ ai?” trong buổi tập huấn; cả phòng thấy khó chịu, và trưởng phòng bất giác phải đọc lại quy định."], "other": ["Vị trí bị chất vấn: nơi quyền uy buộc phải đáp lời và chứng minh mình.", "S₁ bị đặt vào thế phải chứng minh, khác với Chủ nhân, nơi S₁ không cần chứng minh: khi bị hỏi, quyền uy lộ ra rằng nó chỉ đứng được nhờ tri thức nó huy động. Hệ quả: người cuồng loạn không lật đổ chủ nhân mà khiến chủ nhân phải sản xuất tri thức.", "Cả lớp chờ thầy trả lời một câu hóc; thầy lật lại giáo án rồi thú nhận cần về tra thêm. Thầy vẫn là thầy, nhưng cái ghế của thầy đã đổi nghĩa."], "truth": ["Vị trí nền ẩn: cái thiếu không gọi tên được, thứ thúc đẩy câu hỏi.", "a là cái thiếu không thể gọi tên; đây là lý do câu hỏi không bao giờ khép: mọi câu trả lời đều bị cảm thấy “gần đúng nhưng chưa phải”. Cơ chế ẩn: người (function(){

D.university.r[1]="nơi hệ thống tri thức (S₂) biến bất kỳ thực thể nào thành đối tượng để đo lường, phân loại và can thiệp.";D.university.r[3]="hệ thống đo lường áp lên đối tượng (a), và từ đó thải ra một chủ thể không khớp với chính thước đo ấy ($).";
DX.university.other=["a bị khách thể hóa có phương pháp: đó không nhất thiết phải là con người, mà có thể là tự nhiên (các dòng hải lưu, hệ sinh thái) hay kinh tế (các chỉ số thị trường). Nhưng khi đối tượng là con người, quá trình này biến họ thành những “mẩu dữ liệu vô hồn”. Đây là một dạng bạo lực nhận thức luận (cách biết đã định sẵn cái được biết), được ngụy trang dưới vỏ bọc “chăm sóc”, “giáo dục” hay “quản lý khách quan”, khiến việc phản kháng trở nên vô cùng khó khăn.","Một đứa trẻ tò mò hỏi “tại sao trời mưa?”, nhưng cô giáo chỉ bảo “để yên, giờ học Toán”. Câu hỏi ngây thơ của đứa trẻ (a) bị hệ thống giáo trình chuẩn mực (S₂) đè bẹp, biến em thành một “học sinh cần hoàn thành bài tập” thay vì một chủ thể đang khao khát tri thức."];DXX.university.other=DX.university.other.slice();
DX.university.product=["Nghịch lý: chủ thể bị sản sinh bởi chính cái đo lường nó, nên chỉ có thể xuất hiện như “cái không khớp”. Nếu đối tượng (a) là con người, họ sẽ mang cảm giác thường trực về việc mình chưa đủ tốt. Nếu đối tượng (a) là tự nhiên, thì chính những nhà khoa học hay quan chức vận hành hệ thống (S₂) cũng trở thành những chủ thể ($) kiệt quệ, bị kẹt giữa mệnh lệnh vô hình S₁ và một thực tại không thể đo đếm hết. Khác với Chủ nhân (nơi $ bị che giấu), Học thuật phơi bày $ ra, nhưng lại xử lý nó như một “vấn đề kỹ thuật” (thiếu động lực, thiếu kỹ năng, kiệt sức), chứ không nhìn nhận nó như hiệu ứng cấu trúc của chính hệ thống tri thức.","Một sinh viên tốt nghiệp loại ưu nhưng bơ vơ, không biết mình thực sự muốn gì ngoài việc đạt điểm cao. Em ấy là sản phẩm hoàn hảo của hệ thống đo lường, nhưng lại là một chủ thể trống rỗng về mặt ham muốn."];DXX.university.product=DX.university.product.slice();

// ===== v5.4: mô tả chính Chủ nhân / Cuồng loạn / Nhà phân tâm + đối chiếu Học thuật =====
(function(){
D.master.d="Diễn ngôn Chủ nhân là cấu trúc nguyên thủy nhất. Cái biểu đạt-chủ (S₁) chiếm giữ vị trí Tác nhân, vận hành bằng một mệnh lệnh thuần túy không cần lý do, không cần giải thích. Nó không thuyết phục bằng lý lẽ mà áp đặt bằng uy quyền: “Hãy làm đi, vì ta bảo thế”. Đối tượng bị nó tác động là toàn bộ hệ thống tri thức, kỹ thuật và lao động (S₂) – những người nô lệ, những cỗ máy, những quy trình bị đặt vào vị trí Cái khác để thi hành mệnh lệnh. Thế nhưng, ẩn sâu dưới lớp vỏ bọc toàn năng ấy, vị trí Sự thật lại bị chiếm giữ bởi $ (chủ thể bị chia cắt) – sự bất an, sự thiếu hụt và nỗi sợ hãi tột độ của chính kẻ nắm quyền. Kẻ ra lệnh càng lớn tiếng, càng che giấu sâu hơn sự thật rằng mình cũng chỉ là một sinh thể bị ngôn ngữ chẻ đôi. Chính sự vận hành che giấu này đã sản sinh ra a (thống lạc thặng dư, của cải, quyền lực dư thừa). Kẻ nô lệ làm ra sản phẩm, nhưng phần thặng dư lại chảy vào túi chủ nhân. Tuy nhiên, phần thặng dư ấy không bao giờ lấp đầy được sự bất an của chủ nhân; ông ta càng có nhiều, lại càng cảm thấy thiếu, và vòng lặp quyền lực cứ thế tiếp diễn.";
D.hysteric.d="Diễn ngôn Cuồng loạn bắt đầu từ một chủ thể bị chia cắt ($) mang trong mình những câu hỏi không ngừng nghỉ. Kẻ Cuồng loạn không ra lệnh, họ ép vị trí Cái khác (S₁) – dù đó là bác sĩ, giáo sư hay người tình – phải lên tiếng và chứng minh uy quyền của mình: “Tại sao lại thế? Lấy tư cách gì để khẳng định điều đó?”. Nhưng ẩn sâu dưới những câu hỏi dồn dập ấy, ở tận cùng vị trí Sự thật, lại là một sự thiếu hụt không đáy (a) mà chính chủ thể cũng không thể gọi tên. Họ không thực sự tìm kiếm câu trả lời, bởi mọi lời giải thích đều bị cảm thấy là chưa đủ. Bị dồn vào chân tường, kẻ nắm quyền dùng lý lẽ, tìm kiếm bằng chứng, buộc phải sản sinh ra tri thức mới (S₂) để vá víu. Thế nhưng, tri thức ấy chưa bao giờ chạm tới được cái lõi thiếu hụt kia. Sự thỏa mãn của Cuồng loạn không nằm ở việc tìm ra đáp án, mà nằm ở chính hành vi tra vấn bất tận – nơi kẻ nắm quyền bị buộc phải liên tục bộc lộ sự bất lực của chính mình.";
D.analyst.d="Trong Diễn ngôn Nhà phân tâm, Đối tượng a (nhà phân tâm) chiếm giữ vị trí Tác nhân, nhưng nó chỉ là một vẻ ngoài cấu trúc (semblant). Nhà phân tâm không đóng vai trò là một vị thần toàn tri, mà ngược lại, họ chủ động đảm nhận vị trí nguyên nhân của ham muốn – một khoảng trống, một sự im lặng đầy tò mò. Họ không ra lệnh, cũng không đưa ra lời khuyên. Đối tượng bị nó tác động là chủ thể bị chia cắt ($) ở vị trí Cái khác – người bệnh được mời gọi tự do liên tưởng, nói lên những điều vấp váp và mâu thuẫn nhất. Sự thật là S₂ (tri thức vô thức đang vận hành ngầm) chi phối những lời nói và hành vi mà chính bệnh nhân không hề hay biết. Chính sự vận hành kiềm chế này đã sản sinh ra S₁ (một cái biểu đạt-chủ mới). Từ những mảnh vỡ vô thức, một từ khóa, một điểm khâu (point de capiton) bật ra, giúp bệnh nhân nhìn nhận lại toàn bộ câu chuyện của mình. Sản phẩm của phân tâm không phải là một chẩn đoán hoàn chỉnh, mà là một điểm tựa mới để chủ thể có thể tự giải phóng bản thân.";
D.university.tag="Tri thức nói nhân danh sự khách quan, mọi thứ bị quy thành dữ liệu để đo và quản lý, và mệnh lệnh phía sau không được nói ra.";
IM.university="S₂ → a: Không thể quy đối tượng (con người, tự nhiên, nền kinh tế) thành dữ liệu hoàn chỉnh; sự khách quan hóa luôn để lại một phần dư không đo lường được.";IMP.university="$ // S₁: Chủ thể do hệ thống sinh ra, dù là người bị đo hay người vận hành hệ thống, không chạm tới được mệnh lệnh S₁ đang điều khiển nó.";
ARD.university.top[0]="S₂ → a: tri thức hướng vào đối tượng (con người, hệ sinh thái, nền kinh tế…) để biết, đo và phân loại. Bất khả ở đây là giáo dục: không bao giờ nắm hết đối tượng, luôn còn phần không vào được chương trình hay bảng số liệu.";ARD.university.right[0]="a → $: đối tượng bị quy thành dữ liệu sinh ra chủ thể bị chia cắt. Người bị đo thấy mình không khớp thước đo; người vận hành hệ thống cũng kẹt giữa mệnh lệnh ẩn và thực tại không đo hết.";
FRACTION_INFO.university.fracRight.text="Gạch ngăn cách đối tượng bị đo lường (a: con người, hệ sinh thái, nền kinh tế…) với chủ thể bị chia cắt ($) do hệ thống sinh ra, dù là người bị đo hay người vận hành. Sinh viên bị biến thành điểm số (a), và chính sự tha hóa đó khiến họ luôn cảm thấy mình không đủ ($).";
})();

 const tip=document.getElementById('tip');
 const lab=h=>{const u=h.userData||{};if(TE[u.key])return[T(u.key)+' · '+TE[u.key].n,'Bấm để xem ký hiệu'];if(AR[u.arr])return[AR[u.arr].n.split(':')[0],'Bấm để xem giải thích'];if(PO[u.pos])return['Vị trí '+PO[u.pos].n,'Bấm để xem vị trí']};
 cv.addEventListener('pointermove',e=>{
   if(drag){tip.classList.remove('on');return}
   const h=hit(e),L=h&&lab(h);
   if(!L){tip.classList.remove('on');return}
   tip.innerHTML=(L[0]+'<small>'+L[1]+'</small>').replace(/\$/g,'<span class="bs">S</span>');
   const w=tip.offsetWidth;tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tip.style.top=(e.clientY+16)+'px';tip.classList.add('on');
 });

 cv.addEventListener('pointerdown',()=>tip.classList.remove('on'));

 help.innerHTML='<b>Cách dùng</b><ul><li>🖱️<span><b>Kéo</b> để xoay, <b>cuộn</b> để phóng to, <b>bấm</b> vào bất kỳ thành phần nào để xem giải thích.</span></li><li>⌨️<span><kbd>←</kbd> <kbd>→</kbd> đổi diễn ngôn · <kbd>Esc</kbd> quay lại · <kbd>M</kbd> thu gọn bảng · <kbd>B</kbd> lùi một bước trong kịch bản · <kbd>?</kbd> mở/đóng trợ giúp</span></li></ul>';
 help.innerHTML=help.innerHTML.replace(/\$/g,'<span class="bs">S</span>');
 const tog=()=>{help.classList.toggle('on');hb.classList.toggle('on',help.classList.contains('on'))};
 btn('?',tog);const hb=bar.lastChild;hb.setAttribute('aria-label','Trợ giúp');hb.title='Trợ giúp (?)';
 [...bar.children].forEach((b,i)=>{if(i>=5)b.classList.add('act')});
 bar.querySelectorAll('button')[7].classList.remove('act');bar.querySelectorAll('button')[7].classList.add('pl');
 document.addEventListener('click',e=>{if(help.classList.contains('on')&&!e.target.closest('#help')&&e.target!==hb){help.classList.remove('on');hb.classList.remove('on')}});
 addEventListener('keydown',e=>{
   if(e.target.matches('input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;
   if(e.key==='Escape'){if(help.classList.contains('on')){tog()}else if(view.type!=='disc'){panelBack()}}
   else if(e.key==='?'){tog()}
   else if(e.key==='m'||e.key==='M'){P.classList.toggle('min')}
   else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&view.type!=='sc'){const i=ALL.indexOf(cur),n=ALL.length;setDisc(ALL[(i+(e.key==='ArrowRight'?1:n-1))%n])}
 });
})();

const SC=[{"id": "yeu", "title": "Tại sao anh yêu em?", "sub": "Bạn là bạn trai của Linh. Giữa bữa tối, cô ấy bỗng hỏi một câu.", "start": "n0", "nodes": {"n0": {"d": "hysteric", "q": "Bạn đáp thế nào?", "scene": ["Tối thứ Sáu, hai người ăn xong và ngồi lại ở bàn. Linh, người yêu bạn được hai năm, nghịch cái thìa rồi hỏi, không nhìn bạn: “Anh ơi, tại sao anh yêu em?”"], "read": "Linh ($) đặt câu hỏi cho bạn (S₁), người được giả định là biết mình yêu cô ấy vì điều gì, và đòi một câu trả lời (S₂). Đây là cấu trúc Cuồng loạn. Điều khiến cô ấy hỏi (a) chưa chắc nằm trong lý do nào bạn sắp nói. Vị trí này không gắn với giới tính hay tính cách: ai hỏi “tại sao anh/em yêu tôi?” theo cách này cũng đang ở đó. Đó chỉ là điểm xuất phát, chưa phải lỗi của ai.", "choices": [{"t": "“Vì em dễ thương, nấu ăn ngon, hiền, lại hay lo cho anh. Kể ra chắc đến sáng chưa hết đâu.”", "go": "n1u", "fb": "Bạn đáp bằng một danh sách tiêu chí: tri thức (S₂) đứng ở vị trí tác nhân, còn Linh thành một tập thuộc tính được liệt kê (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Yêu là yêu thôi, hỏi gì kỳ vậy. Em cứ tin anh là được.”", "go": "n1m", "fb": "Bạn đáp bằng một lời tuyên bố không kèm lý do: S₁ đứng ở vị trí tác nhân, Linh phải chấp nhận. Sơ đồ xoay sang Chủ nhân."}, {"t": "“Sao tự nhiên em hỏi vậy? Dạo này em đang nghĩ gì à?”", "go": "n1a", "fb": "Bạn không đưa lý do mà giữ một khoảng trống để Linh tự nói tiếp: a ở vị trí tác nhân, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1u": {"d": "university", "scene": ["Bạn kể ra bốn lý do, rất chân thành. Linh gật gật rồi hỏi: “Vậy nếu một ngày em không còn nấu ăn ngon, hoặc có người xinh hơn, anh vẫn yêu em chứ?”"], "read": "Danh sách lý do (S₂) đang nói, Linh bị quy thành một dãy thuộc tính (a). Phía sau là những tiêu chuẩn ít khi được nói ra, như hình dung của bạn về một người yêu “tốt” (S₁). Thuộc tính nào cũng có thể bị thay thế, còn phần không nằm trong danh sách thì chưa có chỗ nào để được gọi tên.", "choices": [{"t": "“Thì anh yêu vì tất cả những điều đó cộng lại chứ sao. Em đừng lo xa.”", "go": "eU", "fb": "Bạn đóng câu hỏi bằng một bản tổng kết lý do."}, {"t": "“Mấy lý do anh kể chắc chưa trúng điều em đang hỏi. Em kể anh nghe, câu đó đến từ đâu vậy?”", "go": "n1a", "fb": "Bạn thừa nhận danh sách chưa đủ và mời Linh nói: vị trí tác nhân chuyển từ tri thức sang một khoảng trống để lắng nghe. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1m": {"d": "master", "scene": ["Bạn nói xong, Linh “ừ” một tiếng rồi lại nghịch cái thìa. Một lát sau cô ấy nói nhỏ: “Nhưng người ta bảo yêu thì phải có lý do chứ… Anh nói vậy là anh cũng không biết, đúng không?”"], "read": "Lời tuyên bố của bạn (S₁) đòi Linh chấp nhận (S₂ làm việc). Bên dưới là điều bạn không nói: chính bạn cũng chưa chắc mình yêu cô ấy vì điều gì ($, nỗi không chắc bị che). Linh vừa ló ra một câu hỏi, nghĩa là lời tuyên bố chưa đủ để cô ấy im.", "choices": [{"t": "“Thôi đừng nghĩ ngợi nữa em. Anh nói yêu là yêu mà.”", "go": "n2h", "fb": "Câu “đừng nghĩ ngợi” đẩy Linh sang chất vấn: cô ấy đặt câu hỏi ngay vào lời tuyên bố của bạn. Sơ đồ xoay sang Cuồng loạn."}, {"t": "“Ừ, anh yêu em. Ăn xong rồi mình rửa bát nhé.”", "go": "eM", "fb": "Bạn khép chuyện lại bằng một câu quen thuộc, Linh không được hỏi thêm."}]}, "n2h": {"d": "hysteric", "scene": ["Linh nhìn bạn: “Anh nói ‘yêu là yêu’. Người yêu cũ của anh chắc cũng được nghe y chang vậy. Thế em khác gì?”"], "read": "Linh ($) chất vấn lời tuyên bố của bạn (S₁) và đòi bạn chứng minh. Lời cô ấy không hẳn đòi một đáp án cụ thể; nó đang thử xem lời “yêu” này đứng trên cái gì.", "choices": [{"t": "“Được, anh nói em nghe vì sao em khác: em kiên nhẫn, em thẳng tính, và em hiểu anh nhất.”", "go": "eH", "fb": "Bạn đáp bằng một lời giải thích mới (S₂) để bảo vệ lời tuyên bố của mình."}, {"t": "“Anh chưa có câu trả lời tử tế, anh nhận. Nhưng em nhắc người cũ, vậy trong lời anh nói có chỗ nào làm em thấy chưa đúng?”", "go": "n1a", "fb": "Bạn chuyển từ bảo vệ lời tuyên bố sang hỏi về chính câu hỏi của Linh. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1a": {"d": "analyst", "scene": ["Bạn hỏi xong thì im lặng. Linh nhìn xuống cái thìa, nói chậm: “Thật ra thì… tuần trước em nghe bạn anh đùa là em ‘người đến sau’, nhưng thôi, chắc không liên quan đâu.”"], "read": "Bạn giữ chỗ trống (a), Linh ($) nói và vấp ở một câu. Cụm “người đến sau” là một chữ trồi lên từ lời cô ấy mà cô ấy gạt đi ngay: tri thức chưa biết (S₂) đang vận hành, và một cái biểu đạt mới (S₁) có thể hình thành.", "choices": [{"t": "“Em vừa nói ‘chắc không liên quan’. Em cứ kể tiếp chuyện ‘người đến sau’ đi, anh nghe.”", "go": "eA", "fb": "Bạn nhắc lại chính chữ Linh vừa gạt đi và để cô ấy nói tiếp, không giải thích thay."}, {"t": "“Em nghĩ nhiều quá. Anh yêu em thật mà, tụi nó đùa cho vui thôi.”", "go": "eK", "fb": "Bạn giải thích thay Linh rồi khép lại bằng một lời trấn an: tri thức (S₂) và lời tuyên bố (S₁) quay lại. Sơ đồ xoay sang Học thuật."}]}, "eU": {"d": "university", "end": 1, "title": "Một danh sách đầy đủ, một câu hỏi còn nguyên", "scene": ["Linh gật đầu, nói “vâng, em hiểu rồi” và đứng dậy dọn bát. Giữa chừng cô ấy dừng lại như định hỏi thêm điều gì, rồi thôi."], "insight": "Danh sách lý do đã làm đúng việc của nó, và phần Linh chưa nói được không có chỗ trong đó. Sản phẩm là một chủ thể ($) rời bàn ăn với cảm giác mình được liệt kê chứ chưa được trả lời. Đây là cách diễn ngôn Học thuật vận hành khi nó là diễn ngôn duy nhất."}, "eM": {"d": "master", "end": 1, "title": "“Yêu là yêu”, và câu hỏi không được hỏi lại", "scene": ["Hai người rửa bát trong im lặng dễ chịu. Linh không hỏi nữa. Mấy tuần sau cô ấy vẫn cười như thường, nhưng bạn nhận ra mình không biết cô ấy đang nghĩ gì."], "insight": "Lời tuyên bố được nhận mà không được hiểu. Phần thu về của bạn (a) là sự yên ổn bề ngoài, nhưng nỗi không chắc của chính bạn ($) vẫn bị che, và câu hỏi của Linh chưa bao giờ được nghe."}, "eH": {"d": "hysteric", "end": 1, "title": "Một câu trả lời, rồi câu hỏi tiếp theo", "scene": ["Bạn kể ra những điều làm Linh khác với mọi người. Linh nghe, gật đầu, rồi hỏi: “Vậy lúc nãy sao anh nói yêu là yêu, không có lý do?”"], "insight": "Mỗi câu trả lời (S₂) sinh thêm một câu hỏi. Điều khiến Linh hỏi (a) không nằm trong những lý do đã nói, nên tri thức mới không bao giờ chạm tới. Đó là cái “không bao giờ đủ” của Cuồng loạn, và nó không phải là bệnh, cũng không phải tính hay đòi hỏi của riêng ai."}, "eA": {"d": "analyst", "end": 1, "title": "Một chữ mới xuất hiện", "scene": ["Linh im một lúc rồi kể: trong buổi tụ tập tuần trước, bạn của bạn đùa cô ấy là “người đến sau”, và từ đó cô ấy cứ tự hỏi mình là một lựa chọn hay chỉ là người xuất hiện đúng lúc."], "insight": "Cụm “người đến sau” là một cái biểu đạt-chủ mới (S₁) bật ra từ lời của chính Linh, không phải do bạn đặt. Nó chưa phải kết luận, mà là điểm tựa để cô ấy nghe lại câu hỏi “tại sao anh yêu em?” của mình: có thể câu hỏi ấy đang hỏi về chỗ đứng của cô ấy chứ không đòi một danh sách lý do. Lưu ý: Nhà phân tâm là một vị trí cấu trúc, một câu hỏi mở của người yêu chưa chắc đã làm phân tâm, và kịch bản này không phải công thức để đáp một câu hỏi trong tình yêu."}, "eK": {"d": "university", "end": 1, "title": "Lời trấn an đúng, câu chuyện biến mất", "scene": ["Linh cười, nói “ừ, chắc vậy”. Cụm “người đến sau” không được nhắc lại, và cô ấy chuyển sang chuyện cuối tuần đi đâu."], "insight": "Lời trấn an hợp lý của bạn (S₂) đóng cánh cửa vừa hé. Linh nhận một đáp án thay vì tự nghe lại điều mình vừa nói. Không phải lúc nào cũng sai, nhưng cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra bị bỏ lại."}}, "me": "Bạn trai của Linh", "alt": [{"n": "Linh", "sub": "Cùng bữa tối ấy, nhưng bạn là Linh, người hỏi. Một câu đùa của bạn anh cứ đeo theo bạn cả tuần, và bạn phải quyết định hỏi anh ra sao.", "start": "r0", "nodes": {"r0": {"d": "hysteric", "scene": ["Tối thứ Sáu, hai người ăn xong và ngồi lại ở bàn. Bạn là Linh, đã yêu anh hai năm.", "Từ tuần trước trong đầu bạn cứ vẳng lại một câu đùa của bạn anh trong buổi tụ tập: bạn là “người đến sau”. Lúc đó ai cũng cười, bạn cũng cười. Anh đang xúc nốt miếng cơm cuối cùng, chẳng biết gì. Bạn nghịch cái thìa, chưa nhìn anh."], "read": "Bạn ($) sắp hỏi anh (S₁), người được giả định là biết vì sao anh yêu bạn. Điều thật sự thúc bạn hỏi (a) là câu đùa kia, và nó chưa nằm trong câu hỏi nào bạn sắp nói. Đây là cấu trúc Cuồng loạn, và lần này bạn là người đứng ở chỗ tác nhân. Chỗ này không gắn với tính cách hay giới tính: ai muốn hỏi mà chưa nói được điều thúc mình hỏi cũng đang đứng ở đó. Cách bạn mở lời sẽ quyết định anh đáp bằng giọng nào.", "q": "Bạn mở lời thế nào?", "choices": [{"t": "“Anh ơi, tại sao anh yêu em? Nghĩ cho kỹ rồi nói em nghe, nói cho đàng hoàng nhé.”", "go": "r1u", "fb": "Bạn đòi lý do một cách rõ ràng, nên anh đáp bằng lý do: tri thức (S₂) đứng ở vị trí tác nhân, bạn thành một danh sách thuộc tính được liệt kê (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Anh có yêu em thật không đấy? Em hỏi chơi thôi, đừng nghĩ nhiều.”", "go": "r1m", "fb": "Bạn hỏi như một câu đùa, nên anh gạt nó đi như một câu đùa: S₁ đứng ở vị trí tác nhân, không kèm lý do. Sơ đồ xoay sang Chủ nhân."}, {"t": "“Anh ơi, tại sao anh yêu em? Tuần này em cứ nghĩ mãi chuyện này.”", "go": "r1a", "fb": "Bạn hỏi và để lộ rằng câu hỏi còn một phần chưa nói. Anh không vội trả lời mà hỏi lại bạn: a ở vị trí tác nhân, $ của bạn được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1u": {"d": "university", "scene": ["Anh đặt đũa xuống, nghĩ một lúc rồi kể thật chăm chú: em dễ thương, em nấu ăn ngon, em hiền, em biết chăm anh lúc anh ốm. Bốn lý do, không lý do nào là nói dối.", "Bạn gật gật. Lẽ ra phải thấy vui, nhưng câu “người đến sau” vẫn nằm yên ở đó, không có chỗ nào trong bốn lý do dành cho nó."], "read": "Danh sách của anh (S₂) đứng ở vị trí tác nhân, và bạn thành một tập thuộc tính được liệt kê (a). Phía sau vẫn là lời tuyên bố chưa ai nói ra (S₁: “anh yêu em”, như một điều đã rõ). Bạn đòi lý do và anh đã đưa đủ lý do, nhưng điều thúc bạn hỏi ($, nỗi không chắc về chỗ đứng của mình) không có ô nào trong danh sách. Không phải anh trả lời sai: câu hỏi bạn đặt ra chỉ đòi được loại câu trả lời này.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Ừ, nghe cũng được. Em cảm ơn anh.”", "go": "rU", "fb": "Bạn nhận danh sách như một câu trả lời: tri thức (S₂) giữ ghế tác nhân, phần chưa nói của bạn ($) không có chỗ."}, {"t": "“Vậy nếu một ngày em không còn nấu ăn ngon, hoặc có người xinh hơn, anh vẫn yêu em chứ?”", "go": "r2h", "fb": "Bạn đặt câu hỏi vào đúng cái nền của danh sách: $ ở vị trí tác nhân, đòi S₁ đưa ra căn cứ sâu hơn. Sơ đồ xoay sang Cuồng loạn."}, {"t": "“Thật ra em hỏi vì tuần trước bạn anh đùa em là ‘người đến sau’. Em cứ nghĩ mãi.”", "go": "rA", "fb": "Bạn bỏ cách hỏi vòng và nói thẳng điều thúc mình hỏi. Chưa ai kịp giải thích thay, một chữ mới đã nằm trên bàn. Sơ đồ xoay sang Nhà phân tâm."}]}, "r1m": {"d": "master", "scene": ["Anh bật cười, gắp thêm miếng rau: “Yêu là yêu chứ sao nữa. Em hỏi kỳ ghê.” Rồi anh quay sang lướt điện thoại.", "Câu đó nghe rất yên tâm. Nhưng bạn thấy mình vừa được trả lời đúng một câu mà người ta có thể nói với bất kỳ ai."], "read": "Câu của anh (S₁) đứng được nhờ chỗ anh đứng, không kèm lý do, và bạn được đặt vào chỗ chấp nhận (S₂). Bạn vừa tự mở đường cho nó: nói “hỏi chơi” nghĩa là đặt câu hỏi ở chỗ dễ gạt đi nhất. Điều thúc bạn hỏi (a) vẫn chưa được nói, và phía sau câu trả lời chắc nịch của anh có thể cũng có một điều anh chưa nói ($).", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Ừ… thôi ăn đi, nguội hết rồi.”", "go": "rM", "fb": "Bạn nhận câu trả lời để giữ bữa ăn yên: S₂ của bạn làm việc cho S₁ của anh. Sơ đồ ở lại Chủ nhân."}, {"t": "“Anh nói ‘yêu là yêu’. Vậy là anh cũng không biết lý do đúng không? Người ta bảo yêu thì phải có lý do chứ.”", "go": "r2h", "fb": "Bạn không nhận câu gạt đi mà đặt câu hỏi vào chính lời tuyên bố của anh: $ ở vị trí tác nhân, S₁ bị đòi căn cứ. Sơ đồ xoay sang Cuồng loạn."}]}, "r1a": {"d": "analyst", "scene": ["Anh đặt đũa xuống, hơi bất ngờ. Anh không trả lời ngay câu bạn hỏi. Anh nhìn bạn: “Tuần này em nghĩ gì mà nhiều thế?”", "Rồi anh chờ, không giục. Cái thìa trong tay bạn dừng lại."], "read": "Anh giữ chỗ trống (a) và bạn ($) là người được mời nói. Bạn đang ở chỗ mà lúc nãy, ở bên kia bàn, anh có thể phải đứng: chỗ của người nói mà chưa biết mình sẽ nói ra điều gì. Chỗ trống này chỉ mở ra vì bạn đã để lộ một mẩu câu hỏi, và nó chưa bảo đảm điều bạn nói ra sẽ được nghe như bạn mong.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Tuần trước bạn anh đùa em là ‘người đến sau’. Em cười cho qua, nhưng em nghĩ mãi.”", "go": "rA", "fb": "Bạn nói điều thúc mình hỏi bằng chính chữ của nó: $ nói từ chỗ được mời. Sơ đồ ở lại Nhà phân tâm."}, {"t": "“Không có gì. Em hỏi cho biết thôi.”", "go": "rK", "fb": "Bạn rút câu hỏi lại ngay khi có người giữ chỗ cho nó: cánh cửa vừa hé khép lại, lần này do chính bạn. Sơ đồ xoay sang Học thuật."}]}, "r2h": {"d": "hysteric", "scene": ["Anh khựng lại một chút, rồi cười gượng, gãi đầu: “Thì… chắc là vẫn yêu chứ. Mà hôm nay em sao vậy? Em hỏi lạ ghê.”", "Bạn nhìn anh tìm câu trả lời trong một cái hộp mà bạn biết nó không nằm ở đó."], "read": "Bạn ($) đang ở chỗ tác nhân và đẩy anh (S₁) vào chỗ phải đưa căn cứ (S₂). Mỗi câu bạn hỏi buộc anh sản xuất thêm tri thức, nhưng điều thúc bạn hỏi (a) không nằm trong câu trả lời nào anh đưa. Câu “em sao vậy?” của anh là một khe hở: anh vừa hỏi ngược lại bạn, và bạn có thể bước vào khe hở ấy hoặc đi tiếp trên con đường cũ. Đây không phải lỗi của bạn, cũng không phải lỗi của anh.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Không có gì. Em hỏi cho biết thôi.”", "go": "rK", "fb": "Bạn khép lại ngay khi anh vừa mở ra: câu “em sao vậy” không được đáp. Sơ đồ xoay sang Học thuật."}, {"t": "“Em nghĩ mãi từ tuần trước: bạn anh đùa em là ‘người đến sau’. Chuyện đó em chưa nói với anh.”", "go": "rA", "fb": "Bạn bước vào khe hở anh vừa mở và nói điều thúc mình hỏi. Sơ đồ xoay sang Nhà phân tâm."}, {"t": "“Anh chưa trả lời em. Người yêu cũ của anh chắc cũng được nghe y chang vậy, đúng không?”", "go": "rH", "fb": "Bạn đi tiếp con đường chất vấn: mỗi câu trả lời (S₂) của anh sẽ sinh thêm một câu hỏi. Sơ đồ ở lại Cuồng loạn."}]}, "rU": {"d": "university", "end": 1, "title": "Bốn lý do, và một câu đùa chưa ai nhắc", "scene": ["Bạn mỉm cười, nói “dạ, em biết rồi” và đứng dậy dọn bát. Anh nhìn theo, hơi nhẹ nhõm như vừa qua một bài thi. Giữa chừng bạn dừng lại như định hỏi thêm điều gì, rồi thôi."], "insight": "Danh sách của anh đã làm đúng việc của nó, và điều thúc bạn hỏi không có chỗ trong đó. Ở vai người hỏi bạn thấy được điều khó thấy từ ghế bên kia: câu “tại sao anh yêu em?” chỉ đòi được một danh sách, còn câu bạn thật sự muốn hỏi (mình là một lựa chọn hay chỉ là người đến sau) chưa hề được đặt ra. Đây là cách diễn ngôn Học thuật vận hành khi nó là diễn ngôn duy nhất, và nó không có nghĩa là anh trả lời sai."}, "rM": {"d": "master", "end": 1, "title": "“Yêu là yêu”, và câu hỏi nằm lại trong bạn", "scene": ["Hai người rửa bát trong im lặng dễ chịu. Anh hát khe khẽ. Mấy tuần sau bạn vẫn cười như thường, nhưng câu “người đến sau” thỉnh thoảng lại quay về vào những lúc bạn không ngờ."], "insight": "Câu trả lời của anh (S₁) được nhận mà không được hỏi lại. Bạn có sự yên ổn bề ngoài (a), nhưng điều thúc bạn hỏi ($) chưa bao giờ được nói ra, và anh cũng không biết nó tồn tại. Điều đáng chú ý là chính cách mở lời của bạn (“hỏi chơi thôi”) đã làm cho câu trả lời kiểu này dễ xảy ra: người hỏi cũng có phần trong việc câu hỏi có được nghe hay không."}, "rK": {"d": "university", "end": 1, "title": "“Em hỏi cho biết thôi”, và câu đùa ở lại với bạn", "scene": ["Anh cười, nói “ừ, chắc vậy” rồi kể chuyện bạn anh rủ đi đá bóng cuối tuần. Cụm “người đến sau” không được nhắc, và bạn cười đúng chỗ."], "insight": "Lần này người đóng cửa không phải anh mà là bạn: câu “không có gì” khép lại đúng lúc có người giữ chỗ cho bạn nói. Không phải lúc nào cũng sai, vì có những điều chưa đến lúc nói ra. Nhưng cái giá là cái biểu đạt-chủ (S₁) vừa chớm hiện ra vẫn nằm trong bạn, còn anh nhận về một đáp án rằng mọi thứ đều ổn."}, "rA": {"d": "analyst", "end": 1, "title": "Một chữ bạn chưa từng nói ra", "scene": ["Anh im một lúc rồi nói chậm: “Nó đùa vô duyên thật. Nhưng em giữ chuyện này cả tuần mà anh không biết.” Anh không vội nói rằng em không phải người đến sau. Anh hỏi: “Nghe câu đó em thấy thế nào?” Bạn nhận ra mình nói được lâu hơn mình tưởng."], "insight": "Cụm “người đến sau” là một cái biểu đạt-chủ mới (S₁) bật ra từ lời của chính bạn, không phải do anh đặt. Nó cho thấy câu “tại sao anh yêu em?” có thể luôn hỏi về chỗ đứng của bạn chứ không đòi một danh sách lý do. Điều này chưa kết luận rằng anh sẽ trả lời được, chỉ khiến câu hỏi nghe khác đi. Lưu ý: Nhà phân tâm là một vị trí cấu trúc; một người bạn đời biết lắng nghe không phải nhà phân tâm, và không phải lần nói ra nào cũng được nghe như vậy."}, "rH": {"d": "hysteric", "end": 1, "title": "Mỗi câu trả lời lại sinh một câu hỏi", "scene": ["Anh thở ra rồi nói thật lòng: em khác chứ, vì em kiên nhẫn, vì em thẳng tính, vì em hiểu anh nhất. Bạn nghe, gật đầu, rồi nghe chính mình hỏi tiếp: “Nhưng ai mà chẳng có thể kiên nhẫn, thẳng tính?” Anh nhìn bạn, mệt và bối rối."], "insight": "Mỗi câu trả lời (S₂) của anh sinh thêm một câu hỏi, vì điều thúc bạn hỏi (a) không nằm trong những lý do ấy. Đó là cái “không bao giờ đủ” của Cuồng loạn: không phải bệnh, cũng không phải tính hay đòi hỏi của riêng ai. Ở vai người hỏi bạn thấy thêm cái giá ở phía bên kia: người bị hỏi dần thấy mình đang bị chất vấn chứ không được nghe, và cuộc nói chuyện kéo dài trong khi điều bạn thật sự muốn nói vẫn chưa được nói."}}}]}, {"id": "hop", "title": "Cuộc họp chỉ tiêu", "sub": "Bạn là trưởng nhóm kinh doanh. Cấp trên đòi tăng 20%.", "start": "n0", "nodes": {"n0": {"d": "master", "q": "Bạn mở lời với nhóm thế nào?", "scene": ["Giám đốc vừa giao: “Quý này doanh thu phải tăng 20%.” Bạn bước vào phòng họp nhóm và mọi người nhìn bạn."], "read": "Giám đốc (S₁) ra lệnh, bạn và nhóm (S₂) phải thi hành. Phía sau lệnh là áp lực từ hội đồng quản trị ($, ít khi được nói ra). Bây giờ đến lượt bạn truyền lệnh xuống.", "choices": [{"t": "“Sếp giao quý này tăng 20%. Anh không bàn lùi. Ai vướng gì thì tự lo cho xong trước thứ Sáu.”", "go": "hm1", "fb": "Bạn truyền nguyên mệnh lệnh xuống mà không giải thích: S₁ ở vị trí tác nhân. Minh lên tiếng chất vấn, và sơ đồ xoay sang Cuồng loạn."}, {"t": "“Anh đã chạy số theo ba quý gần nhất, mức khả thi chỉ khoảng 8%. Mọi người xem bảng này.”", "go": "hu1", "fb": "Bạn nói bằng số liệu và quy trình: S₂ đứng ở vị trí tác nhân, nhóm thành các dòng số (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Anh chưa muốn nói con số vội. Mọi người thấy chỉ tiêu này vướng ở chỗ nào?”", "go": "ha1", "fb": "Bạn không đưa lời giải mà mời nhóm nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "hm1": {"d": "hysteric", "scene": ["Cả phòng im lặng. Minh, nhân viên lâu năm, giơ tay: “Anh dựa vào đâu mà chắc là làm được ạ?”"], "read": "Minh ($) chất vấn uy quyền của bạn (S₁) và đòi bạn đưa lý lẽ (S₂). Câu hỏi của anh không hẳn đang tìm một con số; nó thử xem lệnh này đứng trên cái gì.", "choices": [{"t": "“Dựa vào việc anh là trưởng nhóm, và sếp đã giao. Em cứ làm đi.”", "go": "eMh", "fb": "Bạn lấy chính vị trí làm lý do: uy quyền lại tự chống đỡ nó."}, {"t": "“Nói thật là anh cũng chưa chắc đâu. Em với mọi người thử tính xem, chỗ nào thấy không ổn thì nói luôn.”", "go": "ha1", "fb": "Bạn nhận rằng mình chưa chắc, và để Minh nói tiếp. Sơ đồ xoay sang Nhà phân tâm."}]}, "hu1": {"d": "university", "scene": ["Bạn trình chiếu bảng dự báo. Minh nhìn bảng rồi nói: “Số liệu nói 8%, nhưng mấy khách em gặp tuần rồi đều nói sắp bỏ sang bên khác. Cái đó không có trong bảng.”"], "read": "Mô hình dự báo (S₂) đứng ở vị trí tác nhân, nhóm bị quy thành các dòng số (a). Minh vừa mang vào một phần không đo được, và phía sau bảng vẫn là chỉ tiêu của cấp trên (S₁) chưa ai nói ra.", "choices": [{"t": "“Anh hiểu, nhưng báo cáo chỉ nhận số có trong hệ thống. Em cứ ghi chú riêng giúp anh.”", "go": "eUh", "fb": "Bạn giữ nguyên thước đo: phần không đo được không có chỗ trong báo cáo."}, {"t": "“Mấy khách đó em kể kỹ anh nghe đi. Họ nói gì, em thấy sao?”", "go": "ha1", "fb": "Bạn mời Minh nói về phần mô hình không thấy. Sơ đồ xoay sang Nhà phân tâm."}]}, "ha1": {"d": "analyst", "scene": ["Bạn im lặng, cả phòng nhìn nhau. Minh nói chậm: “…Thật ra em nghĩ vấn đề không ở con số. Mà là ai cũng sợ nói ra là mình không làm được.”"], "read": "Bạn giữ chỗ trống (a), Minh ($) nói và vấp vào một điều cả phòng chưa nói. “Ai cũng sợ nói ra” là tri thức chưa được thừa nhận (S₂), và một cái biểu đạt mới (S₁) có thể bật ra từ đó.", "choices": [{"t": "“Em vừa nói ‘ai cũng sợ nói ra’. Anh muốn nghe thêm đoạn đó. Sợ cái gì, em kể anh nghe.”", "go": "eAh", "fb": "Bạn giữ lại chính chữ Minh vừa nói và mời cả nhóm nói tiếp."}, {"t": "“Cảm ơn Minh, anh ghi nhận. Nhưng họp xong còn phải nộp báo cáo, mình quay lại số liệu đã.”", "go": "eUh", "fb": "Bạn quay lại bảng số: tri thức (S₂) và mệnh lệnh (S₁) quay lại. Sơ đồ xoay sang Học thuật."}]}, "eMh": {"d": "master", "end": 1, "title": "Báo cáo đẹp, Minh nghỉ việc", "scene": ["Cả nhóm làm thêm giờ đến hết quý. Báo cáo đạt 19%. Quý sau Minh nộp đơn nghỉ việc và không ai hỏi vì sao."], "insight": "Mệnh lệnh (S₁) có hiệu lực vì đứng ở chỗ quyền, không vì có lý. Bạn nhận phần dư (a) là con số, nhưng nỗi sợ trước cấp trên ($) của chính bạn chưa được gọi tên, và câu hỏi của Minh biến thành sự ra đi."}, "eUh": {"d": "university", "end": 1, "title": "Bảng đúng, nhóm im lặng", "scene": ["Bạn giữ nguyên báo cáo 8% kèm ghi chú. Phần khách hàng sắp bỏ đi không có ô nào để điền. Cuối quý có hai khách rời đi, và báo cáo chỉ ghi “biến động ngoài dự báo”."], "insight": "Mô hình (S₂) chỉ biết những gì nó đo được. Phần dư (a) mà Minh mang đến không có chỗ trong báo cáo, nên cả nhóm học cách không nói nữa: chủ thể ($) không khớp với thước đo thì tự im."}, "eAh": {"d": "analyst", "end": 1, "title": "Chữ “sợ” được gọi tên", "scene": ["Cả phòng im lặng, rồi lần lượt có người kể: trễ hạn năm ngoái bị trừ thưởng, nên ai cũng báo “ổn” khi chưa ổn. Bạn ghi cụm “báo ổn khi chưa ổn” lên bảng."], "insight": "“Báo ổn khi chưa ổn” là một cái biểu đạt-chủ mới (S₁), không do bạn đặt mà bật ra từ lời của nhóm. Chỉ tiêu 20% vẫn còn đó, nhưng cuộc họp giờ nói về điều đang chi phối việc báo cáo, không chỉ về con số. Đây là một vị trí nói, không phải kỹ thuật bảo đảm thành công."}}}, {"id": "dem", "title": "2 giờ sáng", "sub": "Bạn là chính bạn, tỉnh giấc với điện thoại cạnh gối.", "start": "n0", "nodes": {"n0": {"d": "capitalist", "q": "Bạn làm gì?", "scene": ["2 giờ sáng. Bạn tỉnh giấc, thấy trong người trống trống, không rõ vì sao. Điện thoại nằm cạnh gối."], "read": "Cảm giác trống ($) chưa kịp được gọi tên thì đã có sẵn một thứ để làm với nó. Ở diễn ngôn Tư bản, chủ thể bất mãn đứng ở vị trí tác nhân và mũi tên $ → S₁ không có khoảng dừng.", "choices": [{"t": "Với tay lấy điện thoại, tự nhủ: “Lướt chút rồi ngủ.”", "go": "c1", "fb": "Bạn đi thẳng từ cảm giác thiếu sang hành động, không dừng: $ → S₁. Sơ đồ ở Tư bản."}, {"t": "Úp điện thoại xuống, nằm yên một lúc xem cái trống trong người này là gì.", "go": "c1b", "fb": "Bạn chặn mũi tên $ → S₁ bằng một khoảng dừng. Sơ đồ xoay sang Cuồng loạn."}]}, "c1": {"d": "capitalist", "scene": ["Bạn mở ứng dụng. Thuật toán đưa ra đúng loại video bạn đang muốn xem. Mười phút sau một quảng cáo hiện lên: “Chỉ hôm nay, giảm 50%.”"], "read": "Thuật toán (S₂) không có ai để hỏi, và mỗi video là một phần dư vừa đủ (a) để bạn muốn video sau. Khẩu hiệu thị trường (S₁) nằm bên dưới mà không ai đứng ra nói.", "choices": [{"t": "“Thêm một video nữa thôi.” Cứ lướt tiếp.", "go": "eC1", "fb": "Bạn để vòng chạy tiếp."}, {"t": "Bấm mua món đang giảm giá, tự nhủ: “Rẻ vậy bỏ qua tiếc.”", "go": "eC2", "fb": "Bạn biến cảm giác thiếu thành một món hàng."}, {"t": "Dừng tay, tự hỏi: “Mình đang tìm gì vậy?”", "go": "c1b", "fb": "Bạn ngắt vòng bằng một câu hỏi. Sơ đồ xoay sang Cuồng loạn."}]}, "c1b": {"d": "hysteric", "scene": ["Bạn đặt đ
