. Phản ứng là nhãn dán “thánh mẫu”, một cách làm câu của bạn mất hiệu lực mà không cần trả lời nội dung. Từ chỗ người đứng ngoài, bạn vừa bước vào đúng kiểu cãi mà bạn muốn can thiệp.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Đáp trả: “Mình chỉ nói vậy thôi, các bạn đừng ác với nhau. Mình không quen ai cả.”", "go": "hH", "fb": "Bạn đáp từng câu: mỗi câu trả lời (S₂) lại sinh ra một câu hỏi về động cơ của bạn. Sơ đồ xoay sang Cuồng loạn."}, {"t": "Xóa bình luận, nhắn riêng cho người đăng: “Bạn ơi, đọc bình luận chắc bạn mệt. Bạn có ổn không?”", "go": "h1a", "fb": "Bạn rút khỏi chỗ ra lệnh và nói với người thật: a ở vị trí tác nhân, $ của người đăng được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "h1a": {"d": "analyst", "scene": ["Người đăng trả lời sau vài phút, giọng hơi run: “Cảm ơn bạn đã nhắn. Mình mệt thật. Mình chỉ muốn biết mình có làm chị đồng nghiệp buồn không, không ngờ thành ra thế này. Sếp mình vừa nhắn: ‘Lên phòng chị chút.’” Bạn nhìn con trỏ nhấp nháy.", "Đây là người duy nhất trong ba nghìn bình luận chịu hỏi lại. Bạn nhớ cảm giác ban sáng của mình, khi sếp nói “chưa có tâm”: cũng là một người không được hỏi lại."], "read": "Người đăng ($) nói thật, và bạn đang ở chỗ nghe (a). Bạn không làm gì lớn: một tin nhắn riêng. Điều đáng chú ý là chỗ bạn đứng lúc này giống chỗ bạn đã cần lúc sáng, khi sếp nói “chưa có tâm” mà không ai hỏi lại. Một tin nhắn có thể đủ mở chỗ trống nhưng không sửa được cả thread, và bạn có thể chỉ nghe được một phần.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "Ở lại nói chuyện, rồi kể: “Sáng nay mình cũng bị sếp nói, nên mình hiểu cảm giác không ai hỏi lại.”", "go": "hA", "fb": "Bạn đáp bằng chuyện của chính mình: hai $ gặp nhau mà không cần một S₁ chen vào. Sơ đồ ở lại Nhà phân tâm."}, {"t": "Nhắn cho phải phép: “Bạn cố lên nhé, đừng đọc bình luận nữa.” rồi quay lại bảng tin.", "go": "hK", "fb": "Bạn nhắn một lời động viên hợp lý rồi quay lại dòng cấp: tri thức (S₂) khép cuộc trò chuyện. Sơ đồ xoay sang Học thuật."}]}, "hC": {"d": "capitalist", "end": 1, "title": "Hóng 🍿, một cú chụp màn hình nữa", "scene": ["Ảnh chụp của bạn được chia sẻ ba trăm lần trong nhóm. Ai đó dùng nó dựng một clip “Chủ thớt gặp nạn”. Chiều tối bạn nghe tin: người đăng bị sếp gọi lên phòng, và công ty cô ấy vừa bị tag vào bình luận. Bạn nghĩ: mình chỉ chụp màn hình thôi mà."], "insight": "Nguyên liệu (S₂) tiếp tục đi, và mỗi người chỉ làm một việc rất nhỏ: một haha, một cú chụp, một lần chia sẻ. Không ai trong chuỗi làm điều “ác”, và tổng của chúng là một người bị tag vào công ty. Ở vai người hóng bạn thấy: cảm giác vô can là thật, và nó chính là điều vòng lặp cần để chạy. Đây không phải lời buộc tội; nhiều người cũng chỉ đang giải tỏa một ngày tồi tệ."}, "hH": {"d": "hysteric", "end": 1, "title": "“Không quen ai cả”, và vẫn bị hỏi", "scene": ["Bạn trả lời tới tối. “Không quen mà quan tâm làm gì?” “Bạn đang ăn theo chủ thớt à?” “Seeding.” Bạn gõ: “Mình chỉ muốn mọi người đừng ác.” Ai đó dán lại câu đó kèm meme nhân vật hiền lành quá mức. Bạn tắt thông báo và nhận ra cả buổi chưa nghĩ gì đến bản báo cáo."], "insight": "Mỗi câu trả lời (S₂) của bạn sinh ra một câu hỏi về động cơ của bạn: bạn ($) vào cuộc cãi để can thiệp và bị cuốn vào nó. Cuồng loạn tập thể không cần chủ đề: ai đến gần cũng thành nguyên liệu. Can thiệp công khai bằng đạo đức hiếm khi dừng được một luồng, nó thường thêm một nhánh. Điều đó không có nghĩa lên tiếng là sai, chỉ là chỗ đứng để lên tiếng ở đây yếu hơn bạn tưởng."}, "hA": {"d": "analyst", "end": 1, "title": "Một tin nhắn riêng", "scene": ["Bạn và người đăng nhắn qua lại hai mươi phút. Bạn không giải quyết được gì: bài vẫn ở đó, bình luận vẫn chạy. Nhưng khi cô ấy đi gặp sếp, cô ấy nhắn: “Cảm ơn bạn, tự nhiên đỡ sợ.” Bạn quay lại bản báo cáo và lần đầu trong ngày thấy mình viết nổi."], "insight": "Một tin nhắn riêng (a ở vị trí tác nhân, $ của người đăng nói) không đổi được cả thread, và đó là điều cần nhớ: nó không phải cách “chữa” mạng xã hội. Nhưng nó cho thấy chỗ trống có thể mở ra bằng rất ít, ngay cả từ ghế người hóng, và ở chỗ đó bạn nhận lại một điều: cái $ của chính bạn (lời “chưa có tâm” của sếp) cũng được nói ra một chút. Không đảm bảo lần nào cũng được đáp lại như thế."}, "hK": {"d": "university", "end": 1, "title": "“Cố lên nhé”, rồi lướt tiếp", "scene": ["Bạn nhắn một câu động viên, hai phút sau mở lại bảng tin. Bài có mười hai nghìn bình luận, bạn cuộn đến bình luận thứ ba mươi. Người đăng nhắn lại “cảm ơn bạn”, và bạn không thấy tin nhắn đó trong hai tiếng."], "insight": "Lời động viên (S₂) là tốt, nhưng nó khép cuộc trò chuyện đúng lúc người kia có thể nói thêm. Dòng cấp vẫn là chủ: bạn quay lại nó như một thói quen, và cái $ ban đầu (lời sếp “chưa có tâm”) không bao giờ được nói với ai. Không phải lúc nào cũng đủ sức để ở lại, và đó cũng là lý do mọi thứ trông như hôm nay."}, "hN": {"d": "master", "end": 1, "title": "Đóng ứng dụng, và chiều hôm đó", "scene": ["Bạn làm xong báo cáo trong ba mươi phút, nhanh hơn thường lệ. Năm giờ chiều bạn mở lại Facebook “chỉ xem chút”. Bài ấy đã có chín nghìn bình luận, và đứng đầu là một câu mới: “Ủa chủ thớt xóa bài rồi à?” Bạn không nhớ nhà trai họ gì, chỉ nhớ mình đã muốn gõ một câu."], "insight": "Rời đi là lựa chọn chính đáng, và có hiệu lực thật với bạn: bạn làm việc được. Nó không quyết định số phận cuộc cãi, và câu muốn gõ mà không gõ ($) vẫn ở đó. Có hai kiểu rời đi: rời vì không còn cần, và rời để lát nữa quay lại. Kiểu sau là cách vòng lặp giữ chân bạn mà bạn không thấy mình bị giữ."}}}]}, {"id": "lop", "title": "Học bài thơ này để làm gì ạ?", "sub": "Bạn là cô giáo dạy Văn lớp 11. Giữa tiết, một học sinh giơ tay hỏi một câu không có trong giáo án.", "start": "n0", "me": "Cô giáo", "nodes": {"n0": {"d": "hysteric", "scene": ["Tiết hai, cả lớp đang chép phân tích bài thơ trên bảng. Khoa, em ngồi bàn ba, giơ tay, không đợi cô cho phép: “Cô ơi, học bài thơ này để làm gì ạ? Ra đời có ai hỏi mình thơ đâu.” Vài bạn quay xuống nhìn, một bạn cười khẽ."], "read": "Khoa ($) hỏi cô (S₁), người được giả định là biết vì sao phải học, và đòi một câu trả lời (S₂). Đây là cấu trúc Cuồng loạn, và lần này người đang ngồi ở ghế bị chất vấn là bạn. Điều thật sự thúc em hỏi (a) chưa chắc nằm trong câu “để làm gì”. Chỗ này không gắn với tuổi hay vai trò: ai đứng ở bục giảng cũng có lúc bị hỏi như thế.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Học để thi. Em cứ ghi bài đi, đừng hỏi những câu không cần thiết.”", "go": "n1m", "fb": "Bạn đáp bằng một mệnh lệnh không kèm lý do: S₁ đứng ở vị trí tác nhân và cả lớp phải thi hành. Sơ đồ xoay sang Chủ nhân."}, {"t": "“Chương trình quy định bài này rèn ba kỹ năng: đọc hiểu, lập luận, cảm thụ. Cô phát bảng chuẩn đầu ra cho em xem.”", "go": "n1u", "fb": "Bạn đáp bằng văn bản và quy chuẩn: tri thức (S₂) đứng ở vị trí tác nhân, học sinh thành đối tượng cần đo (a). Sơ đồ xoay sang Học thuật."}, {"t": "“Câu hỏi này em nghĩ từ hôm nay hay từ lâu rồi? Em nói cô nghe với.”", "go": "n1a", "fb": "Bạn không đưa lý do mà giữ một khoảng trống để Khoa nói tiếp: a ở vị trí tác nhân, $ của em được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1m": {"d": "master", "scene": ["Cả lớp cúi xuống chép. Khoa ngồi im, nhưng Lan bàn bên thì thầm đủ để bạn nghe thấy: “Thế là cô cũng không biết.” Khoa ngẩng lên: “Cô bảo để thi, nhưng đề năm ngoái đâu có câu nào về bài này.”"], "read": "“Học để thi” (S₁) có hiệu lực nhờ chỗ bạn đứng chứ không nhờ lý lẽ, và cả lớp bị đặt vào chỗ phải thi hành (S₂). Phía sau là điều bạn không nói ($): áp lực điểm trung bình lớp, và có thể cả sự không chắc của chính bạn về việc bài thơ này để làm gì. Khoa vừa đáp lại bằng một câu hỏi, nghĩa là lệnh chưa đủ để em im.", "q": "Bạn làm gì tiếp?", "choices": [{"t": "“Trật tự! Ai còn nói chuyện thì cô ghi tên.”", "go": "eM", "fb": "Bạn cộng thêm mệnh lệnh: S₁ giữ ghế tác nhân và lớp im vì sợ, không vì thấy có lý. Sơ đồ ở lại Chủ nhân."}, {"t": "“Em nói đúng, cô chưa trả lời em. Để cô nghĩ cho tử tế rồi nói lại, được không?”", "go": "n2h", "fb": "Bạn nhận rằng mình chưa có c n, $ được mời nói. Sơ đồ xoay sang Nhà phân tâm."}]}, "n1a": {"d": "analyst", "scene": ["Bạn im lặng, cả lớp nhìn nhau. Khoa nhìn xuống vở, nói chậm: “Thật ra nhà em có tủ sách cũ của ông ngoại. Em hay đọc thơ trong đó… lén thôi. Mà thôi, chắc không liên quan.”"], "read": "Bạn giữ chỗ trống (a), Khoa ($) nói và vấp ở một chữ. “Lén” là chữ trồi lên rồi bị em gạt đi ngay: tri thức chưa được thừa nhận (S₂) đang vận hành, và một cái biểu đạt mới (S₁) có thể hình thành quanh nó.", "q": "Bạn đáp thế nào?", "choices": [{"t": "“Em nói ‘lén’. Lén ai, hay lén cái gì, em kể cô nghe thêm.”", "go": "eA", "fb": "Bạn nhắc lại đúng chữ em vừa gạt đi và để em nói tiếp, không giải thích thay."}, {"t": "“Đọc thơ là tốt chứ sao. Em cứ phát huy, đừng nghĩ nhiều.”", "go": "eK", "fb": "Bạn khen và khép lại bằng một nhận định thay em: tri thức (S₂) quay lại ghế tác nhân. Sơ đồ xoay sang Học thuật."}]}, "eM": {"d": "master", "end": 1, "title": "Lớp im, câu hỏi biến mất", "scene": ["Cả lớp chép xong trong im lặng. Khoa không giơ tay nữa. Cuối kỳ điểm Văn của lớp nhích lên nửa điểm, còn bạn không biết em đã thôi hỏi hay chỉ thôi hỏi bạn."], "insight": "Lệnh (S₁) có hiệu lực vì đứng ở chỗ quyền, không vì có lý. Phần bạn thu về (a) là một lớp ngoan và con số đẹp, nhưng nỗi không chắc của chính bạn ($) vẫn chưa được nói, và câu hỏi của Khoa chỉ đổi dạng thành sự im lặng. Chỉ giữ trật tự không sai; điều đáng chú ý là nó được dùng thay cho một câu trả lời."}, "eU": {"d": "university", "end": 1, "title": "Làm thêm hai đề, bài thơ vẫn chưa nói gì", "scene": ["Tuần sau Khoa nộp hai đề, đạt điểm tám. Em không hỏi thêm câu nào, và trong tiết đọc thơ tự do em ngồi nhìn ra cửa sổ."], "insight": "Bảng chuẩn và đề tham khảo (S₂) làm đúng việc của chúng: có thước đo, có điểm số. Phần không có ô nào, tức điều bài thơ nói với riêng Khoa ($), không bị phản bác mà chỉ bị bỏ ra ngoài. Đây là cách diễn ngôn Học thuật vận hành khi nó là diễn ngôn duy nhất: không sai, nhưng nó xử lý được kỹ năng chứ chưa nghe được (function(){

const cff=(d,f)=>f(d.a)+'/'+f(d.t)+(d===D.capitalist?' · ':' → ')+f(d.o)+'/'+f(d.p);
function analyze(pos=NB.pos){
  const as=PK.filter(p=>pos[p]),used={};as.forEach(p=>used[pos[p]]=(used[pos[p]]||0)+1);
  const dup=SY.filter(k=>used[k]>1),miss=SY.filter(k=>!used[k]);
  const rk=ALL.map(k=>{const diff=as.filter(p=>D[k][FLD[p]]!==pos[p]);return{k,score:as.length-diff.length,diff}}).sort((x,y)=>y.score-x.score);
  const complete=as.length===4&&!dup.length,ex=complete&&rk.find(r=>r.score===4);

function verdict(f,pos=NB.pos){

  if(A.exact){

    return{title:'Khớp diễn ngôn '+d.n+' · '+cff(d,f),paras:L};
  }
  if(A.complete){
    const top=A.rk.filter(r=>r.score===A.rk[0].score).slice(0,2);
    L.push('Bốn ký hiệu đã được dùng đủ, mỗi ký hiệu một lần, nhưng thứ tự này không trùng với công thức nào trong năm công thức.');
    top.forEach(r=>L.push('Gần nhất: diễn ngôn '+D[r.k].n+' ('+cff(D[r.k],f)+'), khớp '+r.score+'/4. Lệch ở: '+r.diff.map(p=>q(p)+' (bạn đặt '+f(pos[p])+', công thức đặt '+f(D[r.k][FLD[p]])+')').join('; ')+'.'));
    L.push('Có hai hướng: xem lại những vị trí lệch (ai thật sự đứng ra nói? điều gì đang bị giấu?), hoặc nhìn tình huống như một khoảnh khắc trượt giữa hai diễn ngôn thay vì một cấu trúc ổn định.');
    return{title:'Không khớp diễn ngôn nào',paras:L};
  }
  if(A.dup.length)L.push('Ký hiệu '+A.dup.map(f).join(', ')+' đang xuất hiện hai lần. Ở mọi diễn ngôn, mỗi ký hiệu chỉ giữ đúng một vị trí.');
  if(A.as.length===4&&A.miss.length)L.push('Ký hiệu chưa dùng: '+A.miss.map(f).join(', ')+'.');
  const ok=A.rk.filter(r=>!r.diff.length);
  if(ok.length)L.push('Phần đã gán còn tương thích với: '+ok.map(r=>D[r.k].n).join(', ')+'. Gán thêm các vị trí còn lại để thu hẹp.');
  else L.push('Phần đã gán chưa tương thích với diễn ngôn nào. Gần nhất là diễn ngôn '+D[A.best.k].n+' (khớp '+A.best.score+'/'+A.as.length+' vị trí đã gán).');
  return{title:A.dup.length?'Cách gán chưa hợp lệ':'Mới gán '+A.as.length+'/4 vị trí',paras:L};
}
const sym=(k,x,y,z,col)=>{const sb=n=>'S<tspan font-size="'+z*.55+'" dy="'+z*.14+'">'+n+'</tspan>',t=k==='S1'?sb(1):k==='S2'?sb(2):k==='$'?'S':'a';

function dia(light,pos=NB.pos){
  const A=analyze(pos),ref=A.exact||(A.best&&A.best.k),mu=light?'#6a6880':'#a29fb6';

  const XY={agent:[20,14],other:[200,14],truth:[20,114],product:[200,114]};

  PK.forEach(p=>{const[cx,cy]=XY[p],k=pos[p],r=ref&&D[ref][FLD[p]],ok=k&&k===r,st=!k?mu:ok?'#2e9e6b':'#d98a1f';

    if(k){s+=sym(k,cx+16,cy+66,44,dk(TE[k].c))+'<text x="'+(cx+148)+'" y="'+(cy+26)+'" text-anchor="end" font-size="16" font-weight="700" fill="'+st+'">'+(ok?'✓':'≠')+'</text>';
      if(!ok&&r)s+='<text x="'+(cx+148)+'" y="'+(cy+76)+'" text-anchor="end" font-size="12" fill="'+mu+'">công thức: '+PS[r]+'</text>'}

  return s+'</svg>';

function summ(f){
  const L=[],ts=NB.turns.map((t,i)=>({i,A:analyze(t.pos)})).filter(o=>o.A.as.length),A=analyze();
  if(ts.length>1)L.push('Đường đi của tình huống: '+ts.map(o=>'Lượt '+(o.i+1)+' '+(o.A.exact?D[o.A.exact].n:o.A.complete?'chưa khớp công thức':'chưa đủ')).join(' → ')+'.');
  if(NB.me){const k=NB.me!=='outside'&&NB.pos[NB.me];L.push((k?'Ở lượt đang xem, bạn giữ vị trí '+PO[NB.me].n+' với ký hiệu '+f(k)+' ('+TE[k].n+'). ':'')+ME[NB.me])}
  L.push('Một thử nghiệm nhỏ: '+(A.exact?XP[A.exact]:'tách tình huống thành các lượt nói ngắn và gán từng lượt. Chỗ không khớp thường chính là chỗ cuộc trò chuyện đang chuyển diễn ngôn.'));
  const cur=NB.title.trim()||NB.text.trim().slice(0,40),tally={};let n=0;

}

  obj(4,'<</Type/XObject/Subtype/Image/Width '+c.width+'/Height '+c.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>',jpg);

  if(!x)return false;const a=x.dataset.nbx,id=+x.dataset.id;

  else if(a==='new'){NB.title=NB.text='';NB.me=null;NB.t=0;NB.turns=[{q:'',pos:{},notes:{}}];AI=[];persist();build()}
  else if(a==='open'){const z=NB.saved.find(q=>q.id===id);if(z){NB.title=z.title;NB.text=z.text;NB.me=z.me||null;NB.turns=mkTurns(JSON.parse(JSON.stringify(z)));NB.t=0;AI=[];persist();build();P.scrollTop=0}}

  else if(a==='addturn'){NB.turns.push({q:'',pos:{},notes:{}});NB.t=NB.turns.length-1;persist();fillTurn();paint();res()}

  return true;
};

function showTip(el){
  if(!GON)return;clearTimeout(tmr);const g=GM[el.dataset.gl];if(!g)return;
  tip.innerHTML='<div class="gt-h"><b>'+g.vi+'</b><span class="gt-fr">'+g.fr+'</span></div><p class="gt-b">'+g.def+'</p>'+(g.ctx?'<p class="gt-c">'+g.ctx+'</p>':'')+'<div class="gt-f"><span class="lnk" role="button" tabindex="0" data-glopen="'+g.id+'">Mở trong trang tra cứu ›</span></div>';
  tip.classList.add('on');curEl=el;
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let y=r.bottom+10,up=false;if(y+h>innerHeight-8){y=Math.max(8,r.top-h-10);up=true}
  const x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);
  tip.classList.toggle('up',up);tip.style.setProperty('--ax',Math.min(Math.max(18,r.left+r.width/2-x),w-18)+'px');
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(d){clearTimeout(tmr);tmr=setTimeout(()=>{tip.classList.remove('on');curEl=null},d===undefined?140:d)}
const cl=(e,s)=>e.target.closest&&e.target.closest(s);
document.addEventListener('mouseover',e=>{const g=cl(e,'.gl');if(g)showTip(g);else if(cl(e,'#gltip'))clearTimeout(tmr)});
document.addEventListener('mouseout',e=>{if(cl(e,'.gl')||cl(e,'#gltip'))hideTip()});
P.addEventListener('focusin',e=>{const g=cl(e,'.gl');if(g)showTip(g)});
P.addEventListener('focusout',e=>{if(cl(e,'.gl'))hideTip()});
P.addEventListener('scroll',()=>hideTip(0),{passive:true});
addEventListener('resize',()=>hideTip(0));
document.addEventListener('click',e=>{const o=cl(e,'[data-glopen]');if(o){openGl(o.dataset.glopen);return}if(!cl(e,'.gl')&&!cl(e,'#gltip'))hideTip(0)});
// ---- trang tra cứu ----
let GQ='';
function glList(){
  const q=norm(GQ.trim()),L=GL.filter(g=>!q||norm(g.vi+' '+g.fr+' '+g.def+' '+g.al.join(' ')).includes(q));
  document.getElementById('glcount').textContent=L.length+'/'+GL.length+' thuật ngữ';
  document.getElementById('gllist').innerHTML=L.length?L.map(g=>'<div class="glc"><b>'+g.vi+'</b><i class="glfr">'+g.fr+'</i><p>'+g.def+'</p>'+(g.ctx?'<p class="note">'+g.ctx+'</p>':'')+(g.rel?'<div class="glrel">Liên quan: '+g.rel.map(r=>'<span class="gltag" role="button" tabindex="0" data-glq="'+GM[r].vi+'">'+GM[r].vi+'</span>').join('')+'</div>':'')+'</div>').join(''):'<p class="note">Không có thuật ngữ nào khớp “'+esc(GQ)+'”. Thử gõ không dấu hoặc một phần của từ.</p>';
}
function glBuild(){
  P.innerHTML='<div class="phead"><span class="back" role="button" tabindex="0">← '+D[cur].n+'</span><span class="sep">›</span><span class="cur">Thuật ngữ</span><button class="pmin" id="pmin" aria-label="Thu gọn hoặc mở rộng bảng">▾</button></div><div class="pc glpage nbf"><b class="dtitle">Tra cứu thuật ngữ</b><i class="tag">Tên gốc tiếng Pháp và định nghĩa ngắn</i><label class="glsw"><input type="checkbox" id="glon"> Đánh dấu thuật ngữ trong văn bản</label><input id="glq" type="search" maxlength="60" autocomplete="off" aria-label="Tìm thuật ngữ" placeholder="Tìm: semblant, khâu, bất khả… (gõ không dấu cũng được)"><div class="note" id="glcount" style="margin:6px 0 2px"></div><div id="gllist"></div><p class="note">Ở các trang khác, từ có gạch chấm là thuật ngữ: rê chuột vào để xem nhanh (trên điện thoại: chạm vào từ).</p></div>';
  document.getElementById('glq').value=GQ;document.getElementById('glon').checked=GON;glList();
}
function openGl(id){GQ=GM[id].vi;view={type:'gl'};P.classList.remove('min');tip.classList.remove('on');glBuild();P.scrollTop=0}
P.addEventListener('input',e=>{if(e.target.id==='glq'){GQ=e.target.value;glList()}});
P.addEventListener('change',e=>{if(e.target.id==='glon'){GON=e.target.checked;try{localStorage.setItem('lacan-gl-on',GON?'1':'0')}catch(x){}P.classList.toggle('glmin',!GON);hideTip(0)}});
P.addEventListener('click',e=>{
  const g=cl(e,'.gl');
  if(g&&GON){e.stopPropagation();if(matchMedia('(hover:none)').matches){if(tip.classList.contains('on')&&curEl===g)hideTip(0);else showTip(g)}return}
  const t=cl(e,'[data-glq]');if(t){e.stopPropagation();GQ=t.dataset.glq;const i=document.getElementById('glq');if(i)i.value=GQ;glList()}
},true);
P.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&cl(e,'[data-glq]')){e.preventDefault();e.stopPropagation();const t=cl(e,'[data-glq]');GQ=t.dataset.glq;document.getElementById('glq').value=GQ;glList()}},true);
const R1=render;render=function(){if(view.type==='gl'){if(!P.querySelector('#gllist'))glBuild();return}R1()};
btn('Thuật ngữ',()=>{GQ='';view={type:'gl'};P.classList.remove('min');glBuild();P.scrollTop=0});
const b=bar.lastChild;b.classList.add('act');b.title='Tra cứu thuật ngữ';bar.insertBefore(b,bar.children[9]);
P.classList.toggle('glmin',!GON);
MO();annot();
})();

setDisc('master',true);frame();
</script>
</body>
