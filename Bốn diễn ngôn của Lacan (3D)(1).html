<style>
:root{color-scheme:dark;--fg:#e8e6f0;--mute:#9a97ad;--card:rgba(16,18,36,.86);--line:rgba(255,255,255,.14);--acc:#f2b84b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;color:var(--fg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1a1740 0%,#0a0b1c 55%,#05060e 100%)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
h1{margin:0;font-size:20px;font-weight:normal;letter-spacing:.05em}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
#panel{pointer-events:auto;margin-top:10px;width:min(430px,100%);max-height:66vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);font-size:13.5px;line-height:1.45;box-sizing:border-box}
#panel b{color:var(--acc);font-weight:normal;font-size:17px}
.tag{display:block;color:var(--mute);font-size:12px;margin:1px 0 6px}
p{margin:6px 0}
table.m{margin:8px auto 4px;border-collapse:collapse;font-size:30px;font-style:italic}
.m td{text-align:center;padding:2px 18px;cursor:pointer}
.m tr+tr td{border-top:0}
.m td.frac-denom{position:relative;padding-top:14px}
.m .fbar{position:absolute;z-index:3;top:-5px;left:7px;right:7px;height:18px;border-radius:6px;background:transparent;cursor:pointer;display:block}
.m .fbar::after{content:'';position:absolute;left:6px;right:6px;top:7px;height:4px;border-radius:5px;background:var(--acc);box-shadow:0 0 7px rgba(242,184,75,.65)}
.m .fbar:hover::after,.m .fbar:focus::after{height:6px;top:6px;outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
.m small{display:block;font:9px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

.row{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line);cursor:pointer}

.chip{width:26px;text-align:center;font-style:italic;font-size:16px;flex:none}
u{text-decoration:none;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.gen{display:flex;justify-content:space-between;padding:3px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}

.m tr+tr td.nb{border-top:0}
.ex{border-left:2px solid var(--acc);padding-left:8px;color:#d8d4e8}
.note{color:var(--mute);font-size:12px;margin-top:6px}
.back{color:var(--acc);cursor:pointer;margin-top:8px;display:inline-block}
.bs{position:relative;display:inline-block}
.bs::after{content:'';position:absolute;left:48%;top:-9%;width:2px;height:118%;background:currentColor;transform:rotate(24deg);transform-origin:center}
#bar{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(8px)}
details{margin:0 0 4px 34px}summary{cursor:pointer;color:var(--acc);font-size:12px;padding:2px 0}
.intro,.sources{border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:9px 10px;margin:4px 0 10px;background:rgba(255,255,255,.035)}

.sources ul{padding-left:18px;margin:6px 0}

button:hover{border-color:var(--fg)}

<script>
const TK=['S1','S2','$','a'],POSL=['agent','other','truth','product'],FLD={agent:'a',other:'o',truth:'t',product:'p'};
const TE={
 S1:{c:0xf2b84b,l:'S₁',n:'Cái biểu đạt-chủ',txt:'Một mệnh lệnh không cần lý do. Nó có hiệu lực không phải vì nó đúng mà vì nó được nói ra từ chỗ có quyền: “vì bố bảo thế”. Trong phân tích, nó hiện ra như một bức tường: một cái tên, một căn bệnh, cái chết của người thân, một từ khiến mọi liên tưởng dừng lại.',ex:'Trong cuộc họp, sếp gõ nhẹ lên bàn: “thôi, cứ làm theo tôi”, và cả phòng im bặt. Trên ghế phân tích, người bệnh chỉ còn lặp một chữ, “mẹ”, và mọi câu chuyện khác dừng lại như xe đâm vào tường.'},
 S2:{c:0x4fb3ff,l:'S₂',n:'Tri thức',txt:'Thứ “biết cách làm”, xếp thành chuỗi. Đó là bí quyết của người thợ trong tay người nô lệ, là bộ máy quy định của trường học hay công sở, và trong phân tâm là điều ta đã biết mà chưa biết mình biết.',ex:'Lò gốm của một làng nghề: người thợ già nhìn màu lửa là biết men đã chín chưa, rồi truyền lại bằng một cái liếc mắt chứ không bằng sách. Cả chuỗi kinh nghiệm nối nhau từ đời này sang đời khác, như một tấm bản đồ chỉ đường.'},
 $:{c:0xff6b8b,l:'S',n:'Chủ thể bị gạch chéo',txt:'Ai cũng bị chính ngôn ngữ mình nói chẻ đôi: điều ta nói không bao giờ khớp hết với điều ta muốn. Chỗ nứt ấy (sự thiến biểu tượng) chính là chủ thể. Ông chủ thì giấu nó, trường học thì sản sinh ra nó, nhà phân tâm thì đặt nó vào ánh sáng.',ex:'Bạn nói “mình muốn nghỉ việc”, rồi tối đó lại ngồi chỉnh hồ sơ xin thăng chức. Hay anh lỡ miệng gọi cô giáo là “mẹ” rồi đỏ bừng mặt. Điều ta nói và điều ta muốn lệch nhau một nhịp.'},
 a:{c:0x7bf0b0,l:'a',n:'Đối tượng a',txt:'Thứ khiến ta ham muốn, chứ không phải thứ ta nhận được: hào quang quanh món đồ, phần “chưa đủ” còn thừa sau mọi thỏa mãn. Nó là giá trị thặng dư và khoái cảm dư thừa, và thuộc về cái thực, thứ không nói trọn được thành lời. Ở đâu có điều không khớp, ở đó có a.',ex:'Chiếc điện thoại mới sáng bóng sau lớp kính tủ trưng bày. Về đến nhà, hào quang tan như bọt xà phòng, nhưng cảm giác “còn thiếu một thứ gì đó” vẫn nằm lại và kéo mắt bạn sang món tiếp theo.'}
};
const PO={
 agent:{ang:3*Math.PI/4,n:'Tác nhân',txt:'Người đứng ra nói, người cầm lái (trên trái). Ký hiệu nào ngồi ở đây thì cả diễn ngôn mang giọng của nó: ra lệnh, giảng giải, lắng nghe hay than phiền.',ex:'Cô giáo đứng trước bảng, ông sếp cầm micro trong buổi họp, cô bệnh nhân bước vào phòng và bắt đầu than phiền. Ai đang mở lời trước cả căn phòng thì người đó đang ngồi ghế tác nhân.'},
 other:{ang:Math.PI/4,n:'Cái khác',txt:'Người bị gọi đến và phải bắt tay vào việc (trên phải). Ai đứng ở đây cũng nhận một phần việc: làm theo, học theo hay kể ra.',ex:'Nhân viên cúi đầu ghi lệnh, sinh viên cắm cúi chép bài, bác sĩ lặng lẽ nghe bệnh nhân vặn hỏi. Ai bị lời nói gọi đến và phải làm gì đó đáp lại thì đang ở ghế cái khác.'},
 truth:{ang:5*Math.PI/4,n:'Sự thật',txt:'Cái nền thầm kín giữ cho tác nhân đứng vững (dưới trái). Nó thường bị giấu, kể cả với chính tác nhân.',ex:'Ông chủ cứng rắn trước cả xưởng, nhưng nửa đêm nằm thức nghĩ: “mình có đủ tư cách không?”. Nỗi lo ấy nằm dưới vạch: không ai nghe thấy, và chính ông cũng không dám gọi tên nó.'},
 product:{ang:7*Math.PI/4,n:'Sản phẩm',txt:'Cái thu về và cũng là cái mất đi (dưới phải): phần dư rơi ra khi diễn ngôn chạy, và là chỗ Lacan đặt khoái cảm.',ex:'Người thợ may được trả lương cố định; số vải dôi ra thành những chiếc áo bán giá cao rơi vào tay chủ. Cái dôi ra ấy chính là sản phẩm: sinh ra từ tay thợ nhưng không về tay thợ.'}
};
const D={
 master:{g:1,n:'Chủ nhân',a:'S1',o:'S2',t:'$',p:'a',tag:'Khuôn gốc của sự phục tùng: “cứ làm đi”',
  d:'Chủ nhân được nghe lời chỉ vì ông ta nói vậy, không cần giải thích. Người nô lệ lao động và nắm hết bí quyết, nhưng chủ nhân chẳng bận tâm máy chạy ra sao, miễn quyền còn vững. Phần dư do lao động làm ra (giá trị thặng dư) về tay ông và đem lại khoái cảm dư thừa. Điều ông giấu kỹ nhất: chính ông cũng bị ngôn ngữ chẻ đôi như mọi người.',
  r:['Ra lệnh mà không cần giải thích','Người nô lệ làm việc và nắm hết bí quyết','Nỗi chia cắt bị giấu: sự thật được ngụy trang','Giá trị thặng dư, khoái cảm dư thừa chảy về chủ'],ex:'Một ông chủ xưởng gõ nhẹ lên bàn: “cứ làm theo lời tôi”. Người thợ già xoay máy bằng đôi tay đã quen, còn ông chủ chỉ nhìn bảng sản lượng và chưa bao giờ biết máy chạy vì sao. Cuối tháng, phần lợi nhuận dôi ra vào túi ông; còn đêm nào ông cũng thức vì sợ mình không xứng với chiếc ghế ấy, điều không ai được thấy.',dx:['Nỗi sợ thầm kín của ông chủ ($) lọt vào xưởng: ông gắt vì một con ốc lệch, đứng sau lưng thợ cả buổi. Người thợ (S₂) thấy hết, và cả xưởng cùng nín thở theo ông.','Lợi nhuận (a) tăng mà ông chủ lại thấy bất an hơn: ông siết kỷ luật, đẩy chỉ tiêu cao hơn. Sự bất mãn của thợ dội ngược về ông thành những cái nhìn lảng đi và những cuộc đình công nhỏ.']},
 university:{g:2,n:'Học thuật',a:'S2',o:'a',t:'S1',p:'$',tag:'Quyền lực khoác áo tri thức',
  d:'Tri thức ngồi vào ghế chỉ huy và nói “mọi thứ đều có lý do”. Nhưng dưới lớp lý do ấy vẫn là mệnh lệnh của chủ nhân, chỉ là không ai nhận. Con người bị biến thành đối tượng để đo, để dạy, để phân loại; hệ thống sản ra những chủ thể bị chia cắt trong khi gạt chính chỗ chia cắt ấy ra ngoài. Triết học và thứ khoa học tồi tệ nhất phục vụ chủ nhân theo cách này, qua những nỗ lực bách khoa nhằm vét cạn một lĩnh vực.',
  r:['Tri thức làm quyền uy: “đây là khoa học”','Con người thành đối tượng để đo, để dạy','Mệnh lệnh ngầm nằm dưới tri thức','Chủ thể bị chia cắt, bị gạt khỏi ham muốn của chính mình'],ex:'Cuốn giáo trình dày cộp, mệnh đề nào cũng kèm chú thích “nghiên cứu cho thấy”. Sinh viên ngồi chép, được đo bằng điểm, và dần quên mất câu hỏi riêng mình mang vào lớp. Còn ý chí thật sự, như chỉ tiêu tuyển sinh hay chính sách của trường, nằm lặng lẽ dưới tờ bìa như sự thật.',dx:['Chỉ tiêu và chính sách (S₁) không bao giờ được nói to, nhưng nó lọt vào lớp học dưới dạng “quy chuẩn mặc nhiên”: bài nào được dạy, em nào được chú ý. Sinh viên (a) cảm nhận được dù thầy chỉ nói về tri thức khách quan.','Sinh viên lo âu, bị chia cắt ($) dội ngược lên tri thức (S₂): họ im lặng, hỏi những câu lạ, hoặc bỏ học, buộc giáo trình thêm chú thích và nhà trường phải đổi chương trình.']},
 analyst:{g:3,n:'Nhà phân tâm',a:'a',o:'$',t:'S2',p:'S1',tag:'Giữ một chỗ trống để ham muốn lên tiếng',
  d:'Nhà phân tâm không khuyên bảo mà làm chỗ trống cho ham muốn của người bệnh. Ông chú ý những chỗ lời nói trượt đi: lỡ lời, hành động hỏng, giấc mơ, nơi sự chia cắt lộ ra. Người bệnh làm việc bằng liên tưởng, và công việc ấy cho ra một cái biểu đạt-chủ mới, một ngõ cụt cần được nối lại với các cái biểu đạt khác. Dưới sự thật là tri thức vô thức, thứ đã có sẵn mà chủ thể chưa nhận: nơi nó đã ở, chủ thể phải đến.',
  r:['Nhà phân tâm làm nguyên nhân của ham muốn','Người bệnh bị chia cắt, được mời lên tiếng','Tri thức vô thức: biết mà chưa biết mình biết','Một cái biểu đạt-chủ mới (la bêtise)'],ex:'Cô nghiên cứu sinh nói suốt nửa giờ về Bakhtin, mạch lạc đến mức ai cũng gật đầu. Nhà phân tâm không hỏi gì về Bakhtin; ông chỉ để ý lúc cô lỡ lời, một chữ nghe như chuyện cô từng từ chối một lời cầu hôn rồi bỏ nước ra đi. Ông bám vào chỗ lời cô tự vấp, chứ không tranh luận lý thuyết.',dx:['Tri thức vô thức (S₂) nằm dưới vạch nhưng tác động lên người bệnh ($) từng ngày: nó lọt ra qua giấc mơ, lỡ lời, một triệu chứng lặp đi lặp lại.','Chữ mới bật ra (S₁) quay về làm lệch chỗ đứng của nhà phân tâm (a): ông phải đổi cách đứng để vẫn giữ chỗ nguyên nhân của ham muốn, thay vì đem giải thích chữ ấy.']},
 hysteric:{g:4,n:'Cuồng loạn',a:'$',o:'S1',t:'a',p:'S2',tag:'Câu hỏi làm chủ nhân lộ chỗ yếu',
  d:'Người cuồng loạn quay sang chủ nhân và đòi: “ông giỏi đến đâu, thử chứng minh bằng tri thức thật xem”, rồi chỉ ra chỗ còn hổng. Lacan cuối cùng gắn cấu trúc này với khoa học ở dạng tốt nhất: như giới hạn của Heisenberg, nó trung thành với điều không khớp. Chính những người cuồng loạn đã đẩy Freud lập ra phân tâm học, và người đi phân tích nào cũng bị cuồng loạn hóa trong quá trình ấy.',
  r:['Chủ thể bị chia cắt, ham muốn tự mâu thuẫn','Chủ nhân bị buộc phải chứng minh bằng tri thức','Đối tượng a: chỗ không khớp là động cơ ngầm','Tri thức mới, nơi người cuồng loạn hưởng khoái cảm'],ex:'Bệnh nhân bác từng chẩn đoán của bác sĩ: “không phải căng thẳng, tôi thấy không phải”. Giống những người bệnh đã buộc Freud sửa lại lý thuyết của mình, hay nhà vật lý cứ đẩy một thuyết đến chỗ nó lộ ra giới hạn, như nguyên lý bất định của Heisenberg. Cả hai đều không chịu nhận một câu trả lời giả.',dx:['Cái không khớp, a, âm ỉ dưới vạch và lọt sang người thầy hay bác sĩ (S₁) qua một ánh nhìn, một câu hỏi lệch. Họ thấy mình bị thử dù chưa ai nói ra.','Lời giải thích mới (S₂) vừa nhận xong thì người bệnh ($) lại thấy chưa đủ, và chỗ chia cắt nhô lên thành một câu hỏi mới.']},
 capitalist:{g:5,n:'Tư bản',a:'$',o:'S2',t:'S1',p:'a',tag:'Vòng quay không phanh: mạch kín không rào cản',
  d:'Lacan nói đến diễn ngôn này lẻ tẻ từ cuối thập niên 1960 và chỉ nêu mô hình cụ thể trong bài giảng ở Đại học Milan năm 1972. Hãy xem nó như một bản “chế” của diễn ngôn chủ nhân chứ không phải mắt xích thứ năm: cấu trúc chặt của bốn diễn ngôn kia (bốn vị trí, năm mũi tên một chiều, bốn ký hiệu xoay theo thứ tự cố định) bị phá vỡ, và mọi thứ chạy thành một vòng kín. Cách đọc ở đây nghiêng về logic tiêu dùng hơn là phương thức sản xuất.',
  r:['Chủ thể bất mãn ($) ngồi ở ghế chỉ huy','S₂: khoa học, kỹ thuật dò tìm khoảng trống thị trường','S₁: thương hiệu, sản phẩm, thứ sự thật chuyên chế','a: khoái cảm dư thừa, quay lại ám ảnh chủ thể'],ex:'Tối chủ nhật bạn thấy bứt rứt mà không rõ vì sao. Quảng cáo hiện lên đúng lúc: chiếc điện thoại mới “sẽ làm mọi thứ khác đi”. Bạn bấm mua; hộp đến, bạn thích ba hôm; rồi một thông báo mới nhảy ra. Vòng quay chạy tiếp.',dx:['','']}
};

const X=a=>(a||[]).map(t=>'<p>'+t+'</p>').join('');
TE.S1.x=['Vì sao là “1”: nó là cái Một đứng ngoài chuỗi và áp đặt lên chuỗi, khác với S₂ là cái nhiều. Nghĩa của nó đến từ vị trí chứ không từ nội dung: “cứ làm theo lời tôi” không phải mệnh đề đúng hay sai mà là hành vi ra lệnh, nên không thể bác bằng lý lẽ.','Gần với điểm khâu (point de capiton): một cái biểu đạt chặn sự trôi nổi của chuỗi và gán nghĩa hồi tố cho cả chuỗi. “Khủng bố” khâu cả một câu chuyện lại; “trầm cảm” bắt đầu tổ chức toàn bộ trải nghiệm của người bệnh. Hai khái niệm hay được nối với nhau nhưng không đồng nhất, và S₁ cũng không phải S(Ⱥ), cái biểu đạt của thiếu hụt trong Cái khác.'];
TE.S2.x=['Là cái nhiều: mạng lưới quy tắc, kỹ năng, quy trình. Theo mạch Hegel, người nô lệ nắm tri thức vì họ làm việc, còn chủ nhân chỉ ra lệnh nên phụ thuộc vào họ. Khi S₂ lên ghế tác nhân (Học thuật), tri thức thành bộ máy quản lý. Vì là chuỗi nên nó không bao giờ khép kín: luôn cần thêm nghiên cứu, thêm chuyên gia.','Ở vị trí sự thật của phân tâm, tri thức không phải thứ đưa từ ngoài vào mà đã nằm trong triệu chứng, lỡ lời, giấc mơ. Phân tích không dạy điều mới, nó để tri thức ấy được chủ thể nhận về.'];
TE.$.x=['Gạch chéo không phải phủ định hay xóa bỏ mà là sự chia cắt: chủ thể không trùng khớp với chính mình, luôn nói nhiều hơn hoặc ít hơn điều muốn nói. Cũng không nhầm $ với cái “tôi” (ego), vốn là hình ảnh ta đồng nhất ở giai đoạn gương. Cái tôi mô tả được (tôi là giáo viên, là cha); $ là chỗ thiếu trong mọi mô tả ấy.','Thiến biểu tượng là cái giá của việc bước vào ngôn ngữ: ta đổi sự trọn vẹn trực tiếp của trải nghiệm lấy từ ngữ, vốn luôn gián tiếp, nên nói “tôi đau” không truyền đi đúng cơn đau. Ham muốn mọc lên từ khoảng hụt đó.'];
TE.a.x=['Là “autre” viết thường (cái khác nhỏ), phân biệt với Autre viết hoa (Cái khác lớn, trật tự biểu tượng). Nó không phải thứ ta muốn mà là thứ khiến ta muốn: hào quang của chiếc điện thoại chứ không phải cái máy. Có rồi thì hào quang tan, vì a chỉ tồn tại như nguyên nhân, không như vật sở hữu được.','Khoái cảm dư thừa (plus-de-jouir) mượn từ giá trị thặng dư của Marx: phần thừa ra không về tay người tạo ra nó mà bị hệ thống thu lấy, và chính phần dư ấy giữ cho cỗ máy chạy.'];
PO.agent.x=['Là vị trí cấu trúc chứ không phải một con người: ông chủ đứng ở đây trong diễn ngôn Chủ nhân nhưng ở vị trí cái khác khi bị chất vấn. Tác nhân không biết sự thật nằm dưới mình nên tưởng mình là trung tâm. Trong diễn ngôn Nhà phân tâm, a ở đây là một semblance: nhà phân tâm làm nguyên nhân của ham muốn chứ không phải là nó.'];
PO.other.x=['Cần phân biệt người đối diện cụ thể (autre) với trật tự biểu tượng đứng sau (Autre): ta nói với một cá nhân nhưng luôn qua ngôn ngữ và xã hội. “Làm việc” nghĩa là sản xuất ra sản phẩm của diễn ngôn (nô lệ lao động, sinh viên tiếp thu, bệnh nhân liên tưởng). Họ cũng có thể cản lại bằng lười biếng, im lặng, bỏ học, và đó là phần diễn ngôn không thu nạp được.'];
PO.truth.x=['Không phải “sự thật” theo nghĩa khoa học mà là cái nền tác nhân dựa vào nhưng không thừa nhận. Lacan nói sự thật chỉ có thể được bán nói (mi-dire): nói nửa vời, qua ám chỉ và lỡ lời, vì nói trọn thì diễn ngôn sụp.'];
PO.product.x=['Sản phẩm luôn là chỗ đánh đổi: được cái này thì mất cái kia, và phần dư của nó không bị hệ thống tiêu hóa hết. Phần dư ấy dội về tác nhân qua mũi tên chéo và là nguyên liệu cho diễn ngôn kế tiếp trong vòng quay. Quan hệ giữa sản phẩm và sự thật là chỗ bất lực: sản phẩm không với tới sự thật.'];

const CON=[
['Điểm khâu (point de capiton)','Chỗ mà chuỗi biểu đạt đang trôi được “khâu” vào ý nghĩa, và ý nghĩa ấy tác động hồi tố lên cả chuỗi. Chữ “tự do” trôi nổi cho đến khi có người khâu nó vào “tự do tư bản” hay “tự do xã hội chủ nghĩa”. Gắn chặt với S₁.'],
['Khoái cảm (jouissance)','Không phải niềm vui thông thường mà là sự hưởng vượt quá nguyên tắc khoái lạc, lẫn với đau và mất mát: thứ ta vẫn “hưởng” khi khổ sở. Phần thưởng ngầm ấy giữ người ta ở lại trong một diễn ngôn. Lacan đặt nó ở vị trí sản phẩm.'],
['Vẻ ngoài cấu trúc (semblant)','Không phải giả dối mà là “không phải chính nó”: một vai có chức năng cấu trúc. Nhà phân tâm làm a mà không phải a; S₁ đóng vai quyền lực che chỗ thiếu.'],
['Bán nói (mi-dire)','Sự thật chỉ nói được một nửa. Không diễn ngôn nào nói trọn nó, vì phần còn lại thuộc cái thực, và chính vì thế nó rò rỉ qua lỡ lời và triệu chứng.'],
['Bất khả và bất lực','Theo Hội thảo XVII, bất khả nằm ở quan hệ tác nhân → cái khác: cai trị, giáo dục, phân tích (ba nghề “bất khả” của Freud) và làm cho ham muốn ở Cuồng loạn. Bất lực nằm ở quan hệ giữa sản phẩm và sự thật, tức đường đứt nét ở hàng dưới. Lacan không nêu bất khả cho diễn ngôn Tư bản.'],
['Autre và autre','Autre (Cái khác lớn): ngôn ngữ, trật tự biểu tượng, “người ta”. Autre nhỏ: người đối diện cụ thể và cũng là gốc của chữ a. Extimité (thân mật ngoại lai) gọi cái gần nhất bên trong mà lại xa lạ như từ ngoài tới; đối tượng a là ví dụ.'],
['Hegel và Marx','Diễn ngôn Chủ nhân dựa trên quan hệ chủ–tớ của Hegel: chủ nhân hưởng thụ nhưng không biết làm, nên phụ thuộc vào tri thức của nô lệ. Marx cho Lacan mô hình của khoái cảm dư thừa: như giá trị thặng dư, phần dư bị chiếm lấy và thành động cơ của hệ thống.']];

const AR={
top:{n:'Mũi tên trên: tác nhân → cái khác',s:'Lời hướng đến · chỗ của bất khả',f:d=>d===D.capitalist?'mũi tên này biến mất, hệ thống không nói với ai mà chỉ chạy.':T(d.a)+' → '+T(d.o),t:['Là mũi tên cơ bản nhất: hành vi nói, lời gọi. Nó không bình đẳng: tác nhân đặt người kia vào chỗ nghe, tuân theo, làm việc, tức là sự tha hóa nền tảng của mọi diễn ngôn.','Lacan đặt bất khả (impossibilité) ở đây, theo Freud là ba nghề “bất khả” (cai trị, giáo dục, phân tích), và ở Cuồng loạn là làm cho ham muốn. Dù cố đến đâu, người kia không bao giờ khớp hoàn toàn với điều tác nhân nhắm tới.'],ex:'Cô giáo giảng đi giảng lại nhưng không thể bảo đảm học sinh hiểu đúng như điều cô nghĩ.'},
bottom:{n:'Mũi tên dưới: sản phẩm → sự thật',s:'Chỗ của bất lực',f:d=>d===D.capitalist?'mũi tên này không được vẽ ở dạng này.':T(d.p)+' → '+T(d.t),t:['Cái được sản xuất ra không với tới sự thật đã sinh ra nó. Lacan gọi đó là bất lực (impuissance).','Vì thế sản phẩm không bao giờ giải quyết được sự thật: diễn ngôn cứ chạy mà nút thắt gốc vẫn nguyên.'],ex:'Ông chủ có thêm bao nhiêu lợi nhuận cũng không hết sợ bị lộ ra là không nắm việc.'},
left:{n:'Mũi tên trái: sự thật → tác nhân',s:'Động cơ thầm kín',f:d=>d===D.capitalist?T(d.a)+' → '+T(d.t)+' (đổi chiều xuống).':T(d.t)+' → '+T(d.a),t:['Sự thật chống đỡ và thúc đẩy tác nhân nhưng tác nhân không biết: nó tưởng mình hành động vì lý do khác. Vạch ngang giữa hai hàng là chỗ sự thật bị dồn nén, nên chỉ được bán nói (mi-dire).','Ở diễn ngôn Tư bản mũi tên này đổi chiều xuống, từ tác nhân tới sự thật, nên không còn gì chặn.'],ex:'Một giám đốc luôn nói “vì kỷ luật”, trong khi nỗi sợ mất quyền mới là cái thúc ông.'},
right:{n:'Mũi tên phải: cái khác → sản phẩm',s:'Lao động',f:d=>T(d.o)+' → '+T(d.p),t:['Cái khác làm việc (lao động, tiếp thu, liên tưởng, chất vấn) và qua đó sinh ra sản phẩm của diễn ngôn. Nhưng sản phẩm thường không thuộc về người làm ra nó: nó bị tác nhân hoặc hệ thống thu lấy, hoặc quay lại thành một cái đánh đổi.'],ex:'Người thợ làm ra hàng; phần giá trị dôi ra về tay chủ, còn họ nhận tiền công.'},
crossT:{n:'Mũi tên chéo: sự thật → cái khác',s:'Dòng chảy ngầm · rò rỉ',f:d=>T(d.t)+' → '+T(d.o),t:['Đi từ hàng dưới lên hàng trên, cắt qua vạch ngăn. Khác với mũi tên ngang phía trên, vốn là lời hướng đến cái khác một cách trực tiếp, nó cho thấy yếu tố bị dồn nén lưu chuyển bên trong diễn ngôn.','Sự thật → cái khác: tác động vô thức của sự thật lên cái khác. Dù bị dồn nén dưới vạch, sự thật vẫn rò qua lỡ lời, triệu chứng hay tiền giả định ngầm, để tác động đến người hay hệ thống được hướng tới.'],ex:''},

bar:{n:'Rào cản (vạch ngăn hai hàng)',s:'Sự dồn nén',f:d=>d===D.capitalist?'vạch vẫn còn trong công thức nhưng mất tác dụng chặn (vẽ đứt nét mờ, nhãn “đã thủng”).':'vạch chắn giữa hàng trên và hàng dưới (vẽ nét liền màu cam).',t:['Vạch ngang tách bề mặt ý thức (tác nhân, cái khác) khỏi nền ẩn (sự thật, sản phẩm). Nó là sự kháng cự, ngăn sự thật tác động trực tiếp lên tác nhân. Nhờ nó diễn ngôn mới ổn định và che được sự thật.','Khi rào cản mất tác dụng, như ở diễn ngôn Tư bản, mạch chạy kín và không còn chỗ dừng, nên Lacan nói nó chạy quá nhanh và tự tiêu rụi.'],ex:'Ta biết lờ mờ vì sao mình hay mua sắm mỗi lần buồn, nhưng vạch ngăn ấy giữ cho điều đó không thành lời.'}};

const ARD={
master:{

bottom:['a → $: bất lực. Phần dư chủ nhân thu về không bao giờ chữa được sự chia cắt của chính ông.','Xưởng lãi kỷ lục, nhưng ông chủ vẫn lo bị khách hàng coi thường.'],
left:['$ → S₁: sự chia cắt bị giấu là động cơ thúc ông ra lệnh. Lệnh càng chắc nịch, chỗ chống đỡ càng mong manh.','Người cha quát “bố bảo thế là thế” vì chính ông không chắc mình đúng.'],
right:['S₂ → a: tri thức của người làm biến thành phần dư. Cái họ làm ra vượt quá điều đủ trả công, và phần vượt ấy thành giá trị thặng dư, khoái cảm dư thừa.','Người thợ cải tiến quy trình khiến năng suất tăng; phần tăng thêm được ghi vào lợi nhuận của xưởng.'],
crossT:['$ → S₂: nỗi bất an bị giấu của chủ nhân rò qua vạch sang người làm dù không ai nói ra. Người làm đọc nó qua giọng điệu, cái cau mày, và cư xử theo.',null],crossP:['a → S₁: phần dư dội ngược lên chủ nhân. Có rồi vẫn thấy thiếu, nên ông thèm thêm và ra lệnh nặng hơn.',null]},
university:{

bottom:['$ → S₁: bất lực. Người học, tức chủ thể chia cắt do hệ thống tạo ra, không với tới được mệnh lệnh ngầm đứng sau tri thức để chất vấn nó.','Sinh viên phản biện được nội dung môn học, nhưng không thể hỏi vì sao chỉ tiêu tuyển sinh lại là 500.'],
left:['S₁ → S₂: mệnh lệnh ngầm (chỉ tiêu, ngân sách) chống đỡ tri thức, và tri thức giả như độc lập với nó.','Bệnh viện áp định mức số ca mỗi buổi; bác sĩ viện dẫn bằng chứng y khoa để biện minh cho khung thời gian ấy.'],
right:['a → $: con người bị làm đối tượng thì ra thành chủ thể chia cắt, biết nhiều mà không biết mình muốn gì.','Học sinh bị xếp loại “giỏi, khá, yếu”; lớn lên em chỉ còn biết mình giỏi hay yếu, chứ không biết mình thích gì.'],
crossT:['S₁ → a: mệnh lệnh ngầm rò xuống người học dưới dạng áp lực thành tích, dù không ai ra lệnh.',null],crossP:['$ → S₂: sản phẩm chia cắt dội ngược lên tri thức, khiến nó luôn thấy mình thiếu và đòi thêm chương trình, thêm khóa học.',null]},
analyst:{

bottom:['S₁ → S₂: bất lực. Chữ mới bật ra không bao giờ đủ để thành tri thức trọn vẹn về chính mình.','Tìm ra chữ “tha lỗi” rồi, người bệnh vẫn không thể nói “giờ tôi hiểu hết mình”.'],
left:['S₂ → a: tri thức vô thức, chưa được chủ thể hóa, là chỗ dựa của nhà phân tâm. Ông không biết hộ, chỉ tin rằng tri thức ấy đã có sẵn nơi người bệnh.','Ông không đoán đáp án mà coi việc người bệnh lặp lại chuyện quên hẹn là điều có nghĩa.'],

crossT:['S₂ → $: tri thức vô thức rò qua vạch vào lời của người bệnh, dưới dạng lỡ lời, giấc mơ, triệu chứng.',null],crossP:['S₁ → a: chữ mới bật ra làm lệch cách nhà phân tâm giữ chỗ nguyên nhân; buổi sau ông phải đứng ở một chỗ khác.',null]},
hysteric:{

bottom:['S₂ → a: bất lực. Tri thức mới sinh ra không chạm tới được nguyên nhân thật của câu hỏi.','Bác sĩ giải thích thêm một triệu chứng, bệnh nhân vẫn thấy “chưa phải chỗ đó”.'],
left:['a → $: cái không khớp là động cơ ngầm của lời chất vấn; chính chủ thể cũng không biết nó là gì.','Người yêu luôn chiều chuộng, cô vẫn thấy thiếu, nên cô hỏi “anh có yêu em không?”.'],

crossT:['a → S₁: cái không khớp rò sang người đối diện, khiến chủ nhân cảm thấy mình bị thử dù câu hỏi chưa thốt ra.',null],crossP:['S₂ → $: tri thức mới dội ngược lại chủ thể, và từ đó nảy ra câu hỏi tiếp theo.',null]},

bottom:['Mũi tên này không được vẽ. Phần dư a không dừng ở bất lực mà có đường quay thẳng về $ qua mũi tên chéo, nên không có chỗ nghỉ (cách đọc theo mạch kín của file).','Mua xong thì hết thích, và không có lúc nào dừng lại để hỏi vì sao; mắt đã dõi theo mẫu kế tiếp.'],
left:['$ → S₁: chủ thể bất mãn tìm thẳng tới thương hiệu, sản phẩm như câu trả lời có sẵn, không qua rào cản nào.','Buồn là mở ứng dụng mua sắm; chán là mở mạng xã hội.'],
right:['S₂ → a: bộ máy kỹ thuật, tiếp thị liên tục sản xuất khoái cảm dư thừa dưới dạng sản phẩm mới.','Phiên bản mới chỉ khác chút ít, nhưng quảng cáo khiến người ta thấy “phải có”.'],

ARD.master.bar=['Vạch giấu $ khỏi S₁: ông chủ không được nhận mình chia cắt. Nó cũng giữ a tách khỏi S₂: phần dư không quay lại tay người làm ra nó.','Trong cuộc họp ông không bao giờ để lộ nỗi sợ, và phần lợi nhuận dôi ra không bao giờ quay lại bảng lương của thợ.'];
ARD.university.bar=['Vạch giấu S₁ dưới S₂: mệnh lệnh không bao giờ được nói như mệnh lệnh. Nó cũng giữ $ tách khỏi a: sự chia cắt của người học không quay lại thành tiếng nói trong hệ thống.','Chỉ tiêu không in trong giáo trình, và nỗi lạc lối của sinh viên không thành nội dung của môn học nào.'];
ARD.analyst.bar=['Vạch giấu S₂ dưới a: tri thức vô thức nằm dưới mặt nạ nên người bệnh chưa biết mình biết. Đây là sự dồn nén mà phân tích từng bước làm lọt, qua lỡ lời và giấc mơ.','Người bệnh quên hẹn lần này đến lần khác; mỗi lần quên là một khe hở của vạch, và nhà phân tâm chú ý đúng chỗ đó.'];
ARD.hysteric.bar=['Vạch giấu a dưới $: chủ thể không nói được vì sao mình thấy thiếu. Nó cũng giữ S₂ tách khỏi S₁, nên tri thức mới không dập tắt được câu hỏi.','Cô không biết gọi tên cái thiếu, và dù được giải thích thêm bao nhiêu, câu hỏi vẫn còn nguyên.'];
ARD.capitalist.bar=['Vạch vẫn nằm trong công thức nhưng không còn chặn: S₁ không bị giấu dưới $ mà hiện rõ thành thương hiệu, và a quay thẳng về $ mà không bị giữ lại. Diễn ngôn mất ổn định vì không còn chỗ dừng và nó chạy quá nhanh đến mức tự thiêu.','Từ cảm giác thiếu đến món hàng chỉ mất vài giây và một cú chạm, không có khoảng dừng nào để hỏi vì sao mình muốn.'];

AR.top.t=['Là mũi tên cơ bản nhất của diễn ngôn: hành vi nói của tác nhân gửi tới cái khác. Cấu trúc này không phải cuộc trò chuyện giữa hai người mà là một liên kết xã hội: nó định ra ai nói, ai nghe, ai làm. Đó là sự tha hóa nền tảng, vì cái khác bị đặt vào một chỗ không do họ chọn.','Lacan liên hệ cấu trúc bất khả với ba nghề Freud gọi là bất khả: cai trị, giáo dục và phân tâm. Không nên biến Cuồng loạn thành “nghề bất khả thứ tư”. Ở Cuồng loạn, $ chất vấn S₁ và đòi câu trả lời, nhưng không câu trả lời nào có thể khép kín ham muốn. Bất khả không chỉ là việc khó; nó là giới hạn cấu trúc của quan hệ tác nhân–cái khác.'];
AR.bottom.t=['Là mũi tên đi từ sản phẩm về sự thật. Bất lực (impuissance) nghĩa là cái diễn ngôn sản xuất ra không đủ sức chạm tới sự thật đã sinh ra nó: sản phẩm không trả lời được cho nguyên nhân của chính mình.','Khác bất khả (cấu trúc của lời gọi), bất lực là cấu trúc của kết quả. Hai thứ cùng giữ diễn ngôn chạy: bất khả khiến nó cố gắng, bất lực khiến nó phải lặp lại.'];
AR.left.t=['Sự thật chống đỡ tác nhân: nó là cái “vì sao” tác nhân đứng ở đó, nhưng nằm dưới vạch nên tác nhân không biết. Lacan nói sự thật chỉ có thể được bán nói (mi-dire), vì nói trọn thì làm sụp chỗ đứng của tác nhân.','Ở diễn ngôn Tư bản mũi tên này đổi chiều xuống, từ tác nhân tới sự thật, nên sự thật không còn là điều bị giấu mà là cái tác nhân chạy thẳng tới.'];
AR.right.t=['Cái khác là bên làm việc: mọi diễn ngôn đều đặt ai đó vào chỗ sản xuất. Điều Lacan nhấn mạnh là cái họ làm ra không trở lại làm cho họ trọn vẹn: sản phẩm bị tách khỏi người làm, đó là hình thức tổng quát của sự tha hóa trong lao động.','Về mặt Marx, giá trị thặng dư gọi tên điều ấy; về mặt Lacan, khoái cảm dư thừa gọi tên nó.'];
AR.crossT.t=['Đi từ hàng dưới lên hàng trên, cắt qua vạch ngăn. Khác với mũi tên ngang phía trên, vốn là lời nói công khai, nó là đường của cái không được nói: yếu tố bị dồn nén lưu chuyển bên trong diễn ngôn.','Sự thật → cái khác: dù bị dồn nén dưới vạch, sự thật vẫn tác động lên người nhận qua lỡ lời, triệu chứng, tiền giả định ngầm. Cái khác phản ứng với điều không được nói chứ không chỉ với điều đã nói.'];
AR.crossP.t=['Cũng đi từ dưới lên trên, nhưng theo hướng từ kết quả về người đã tạo ra nó.','Sản phẩm → tác nhân: phần dư không biến mất mà dội về, ám ảnh và thúc đẩy hoặc làm lệch người đang nói. Đây là cơ chế khiến diễn ngôn lặp lại: cái dư của vòng này thành nguyên liệu của vòng sau.'];
AR.bar.t.push('Về lý thuyết, vạch này là vạch của sự dồn nén: trong công thức nó là vạch phân số, đọc “tác nhân trên sự thật”, cái nói ra nằm trên, cái làm cơ sở nằm dưới. Cái ở dưới vạch không bị xóa, mà bị tách khỏi lời nói trong khi vẫn cấu thành nó.');
AR.bar.n='Vạch ngăn / dồn nén (không đồng nhất với hai gạch phân số)';

const DXX={
master:{agent:['Theo Lacan, S₁ là cái biểu đạt không có biểu đạt nào đứng cạnh để quy định nghĩa: nó chặn sự trượt của chuỗi và đặt một điểm tựa. Ở ghế tác nhân nó hoạt động như hành vi nói, nên quyền lực của nó nằm ở việc được thốt ra từ chỗ ấy chứ không ở nội dung.','Chủ tọa tuyên “bản án có hiệu lực”: lời ấy không mô tả gì, nó làm cho bản án có hiệu lực.'],other:['S₂ là chuỗi tri thức, trong đó có cái biết-làm (savoir-faire) mà theo mạch Hegel nằm ở người nô lệ. Ở ghế cái khác, tri thức bị chuyển thành lao động phục vụ chủ; chủ nhân nắm quyền nhưng không nắm tri thức, nên phụ thuộc vào đúng cái mình ra lệnh.','Thuyền trưởng chỉ hướng đi, nhưng chỉ người thợ máy biết con tàu còn chạy nổi không.'],truth:['Sự thật của chủ nhân là chủ thể bị chia cắt: ông cũng bị ngôn ngữ cắt ra như mọi người, nhưng ghế S₁ đòi ông làm như thể mình nguyên vẹn. Sự chắc chắn của ông là vẻ ngoài (semblance) che chỗ thiếu.','Vị vua cần nghi lễ đăng cơ hoành tráng, vì ngai vàng không tự nó đủ chứng minh ông là vua.'],product:['a là phần dư của lao động, Lacan gọi là khoái cảm dư thừa, tương ứng giá trị thặng dư của Marx. Nó không phải một vật mà là cái còn thừa sau khi mọi thứ đã được quy đổi, và là cái giữ ham muốn của chủ nhân luôn mở.','Nhà sưu tầm có cả bộ vẫn săn món còn thiếu; chính món thiếu ấy mới khiến ông mê.']},
university:{agent:['Khi S₂ chiếm ghế tác nhân, tri thức không còn là cái biết-làm của nô lệ mà thành bộ máy khép kín tự nhận là trung lập. Nó nói nhân danh chính nó, và câu hỏi “ai ra lệnh?” bị đẩy xuống dưới vạch.','Tổng đài tự động nói “theo quy định của hệ thống, yêu cầu không thể xử lý”; không có ai ở đó để cãi.'],other:['Ở ghế cái khác, a là con người bị coi như đối tượng của tri thức: thứ tri thức muốn nắm trọn nhưng luôn còn dư. Ham muốn và khoái cảm riêng của họ không có chỗ trong hệ thống, nên bị quy thành số liệu.','Bệnh nhân là “giường số 12”: bệnh án ghi được mọi chỉ số, trừ nỗi sợ khi nằm đó.'],truth:['S₁ dưới vạch là mệnh lệnh của chủ nhân vẫn đang vận hành nhưng bị che. Tri thức cần một ý chí để chạy, nên phải có S₁ làm chỗ dựa mà không được thừa nhận nó.','Một quyết định có từ trước được trình bày thành “nghiên cứu cho thấy cần thiết”.'],product:['Chủ thể do diễn ngôn này sinh ra bị tước chỗ để ham muốn, vì mọi thứ đã được tri thức quy định sẵn. Nó là chủ thể bị chia cắt giữa cái biết và cái muốn.','Một người làm đúng mọi bước hồ sơ xin việc “đúng chuẩn” mà không biết mình muốn làm gì.']},
analyst:{agent:['a ở ghế tác nhân là vị trí của cái gây ham muốn: nhà phân tâm không nói từ cái tôi hay từ tri thức mà giữ chỗ nguyên nhân để chủ thể gặp ham muốn của chính mình. Đó là semblance: ông giữ chỗ chứ không phải là a.','Người dẫn đường trong hang tối chỉ im lặng giơ đèn để người đi nhìn thấy lối của chính mình.'],other:['Chủ thể chia cắt được đặt vào chỗ làm việc: quy tắc nói mọi điều nảy ra (liên tưởng tự do) khiến sự chia cắt hiện ra ở những chỗ lời nói không khớp.','Kể về “cuộc họp suôn sẻ”, anh luôn khựng ở một chi tiết rồi chuyển sang chuyện khác.'],truth:['Sự thật của phân tâm là tri thức vô thức: tri thức không có chủ thể biết nó. Vì thế phân tích không thêm tri thức mới mà để tri thức ấy nói qua triệu chứng, giấc mơ.','Một người sợ cầu thang mà không biết vì sao; nỗi sợ đã “biết” điều ấy trước chính họ.'],product:['S₁ là cái biểu đạt-chủ mà chủ thể gặp ở cuối đoạn đường liên tưởng: không có nghĩa nhưng đã định hình cách họ sống, và có thể được khâu lại theo cách khác. Lacan gắn nó với cái ngớ ngẩn: không phải khôn ngoan mà là cái ngớ ngẩn đã làm chủ cuộc đời.','Người luôn tự gọi mình là “đứa thừa” nhận ra một biệt danh thời nhỏ đã theo mình đến giờ.']},
hysteric:{agent:['Chủ thể chia cắt tự đưa mình ra như một triệu chứng sống: ham muốn của họ không phải sở hữu mà là giữ cho ham muốn luôn mở. Theo Lacan, người cuồng loạn cần một chủ nhân để bắt ông ta lộ ra chỗ mình không biết.','Cô nhân viên liên tục hỏi trưởng phòng “anh thấy thế nào?”, để xem ông có thật sự biết không.'],other:['Người được hướng đến bị đặt vào ghế chủ nhân: S₁ phải chứng tỏ có tri thức đứng sau uy quyền. Trò chơi là làm chủ nhân lộ ra rằng ông chỉ là cái biểu đạt chứ không phải cái biết.','Học trò hỏi vặn cho đến khi thầy phải nhận “chỗ này thầy cũng chưa rõ”.'],truth:['Dưới vạch, a là cái thiếu làm nguyên nhân: câu hỏi của chủ thể thật ra là câu hỏi về cái thiếu trong chính mình mà họ không gọi tên được. Nó nuôi ham muốn như một ham muốn không bao giờ thỏa.','Người chuyển việc liên tục: việc nào cũng “gần đúng”, và cái thiếu luôn nằm ở chỗ khác.'],product:['Tri thức do cuồng loạn sinh ra là tri thức của cái không khớp, và đó là mô hình của khoa học hiện đại: mỗi lần đặt câu hỏi cho tự nhiên lại thêm một chuỗi S₂, nhưng không bao giờ chạm được a.','Vật lý tìm ra hạt mới trả lời một câu hỏi, rồi câu hỏi tiếp theo về hạt ấy mở ra.']},
capitalist:{agent:['Chủ thể bất mãn đứng ở chỗ động cơ: chính sự thiếu hụt thành nguồn cấp cho hệ thống. Khác với chủ nhân, nó không bị che; nó được khuyến khích lộ ra và được đo đếm.','Ứng dụng hỏi “hôm nay bạn thấy thế nào?”, rồi gợi ý sản phẩm hợp tâm trạng ấy.'],other:['Tri thức thành khoa học-kỹ thuật tự vận hành cùng ham muốn của thị trường, không còn hướng đến một chủ nhân. Lacan nói trong chế độ này mọi người bị “vô sản hóa” khỏi tri thức về chính mình.','Một công ty bán “giải pháp giấc ngủ” dựa trên nghiên cứu giấc ngủ do chính họ tài trợ.'],truth:['S₁ ở nền là thương hiệu, hay giá trị tối cao “thị trường”: không còn là một người mà là mệnh lệnh vô nhân, cứ tiêu dùng, cứ tăng trưởng. Nó chuyên chế vì không còn ghế chủ nhân nào để chất vấn.','Khẩu hiệu thể thao “cứ làm đi” không bảo bạn làm gì, chỉ ra lệnh làm.'],product:['a ở đây là vật gây thèm do hệ thống tự sản xuất: những món hàng đóng vai a. Chúng không bao giờ thỏa vì a thật không phải món hàng.','Chiếc túi phiên bản giới hạn: thích nhất lúc chờ mở bán, nhạt đi ngay khi đã cầm.']}};

 ['a · đối tượng a / khoái cảm dư thừa','Objet petit a là nguyên nhân của ham muốn. Plus-de-jouir là khoái cảm dư thừa, liên hệ với a khi a xuất hiện ở vị trí sản phẩm trong một số diễn ngôn. Hai khái niệm có liên hệ nhưng không hoán đổi tùy tiện. a cũng không phải món hàng hay “cái Thực” nói chung.'],
 ['Bốn vị trí','Tác nhân/vẻ ngoài cấu trúc (trên-trái), cái khác (trên-phải), sự thật (dưới-trái), sản phẩm (dưới-phải). Vị trí cố định; bốn ký hiệu luân phiên qua chúng theo phép quay một phần tư. “Cái khác” ở đây không đồng nhất máy móc với Autre viết hoa.'],
 ['Năm mũi tên và //','Năm mũi tên: tác nhân → cái khác; sự thật → tác nhân; sự thật → cái khác; cái khác → sản phẩm; sản phẩm → tác nhân. Dưới cùng là sản phẩm // sự thật: bất lực, không phải mũi tên thứ sáu.'],
 ['Bất khả và bất lực','Bất khả (impossibility) là giới hạn cấu trúc của quan hệ tác nhân–cái khác. Bất lực (impotence) là sự đứt đoạn giữa sản phẩm và sự thật: sản phẩm không giải quyết được sự thật đã chống đỡ diễn ngôn. Không được dùng hai thuật ngữ như từ đồng nghĩa.'],
 ['Thứ tự quay','Ở đây dùng quy ước quay theo chiều kim đồng hồ: Chủ nhân → Cuồng loạn → Nhà phân tâm → Học thuật → Chủ nhân. Quay ngược chiều kim đồng hồ thì ra thứ tự Chủ nhân → Học thuật → Nhà phân tâm → Cuồng loạn → Chủ nhân. Hai chiều đều hợp lệ, chỉ cần nói rõ quy ước; đây không phải tiến trình lịch sử hay các giai đoạn phát triển tâm lý.'],
 ['Khoái cảm · khoái cảm','Không đồng nghĩa với pleasure/niềm vui thông thường. Đây là khái niệm về một kiểu hưởng-thụ gắn với thân thể, lặp lại và phần vượt quá nguyên tắc khoái lạc; không nên đặt khoái cảm cố định ở vị trí sản phẩm trong mọi công thức.'],
 ['Vẻ ngoài cấu trúc · vẻ ngoài cấu trúc','Không chỉ là giả dối. Trong cách triển khai về sau, tác nhân là vị trí vẻ ngoài cấu trúc: một vị trí được đảm nhận để diễn ngôn vận hành. Nhà phân tâm ở vị trí a/vẻ ngoài cấu trúc không có nghĩa nhà phân tâm “là” đối tượng a.'],
 ['Hegel và Marx','Hegel giúp đọc quan hệ Chủ nhân–người làm và việc tri thức thực hành nằm ở phía người bị sai khiến. Marx cung cấp tương đồng giữa giá trị thặng dư và khoái cảm dư thừa. Đây là tương đồng cấu trúc, không phải phép đồng nhất hai hệ lý thuyết.'],
 ['Đọc cùng Écrits','Écrits không trình bày hệ thống matheme bốn diễn ngôn như Seminar XVII. Nhưng các luận điểm về chữ/cái biểu đạt (“Seminar on The Purloined Letter”, “The Instance of the Letter”), chủ thể chia cắt (“The Subversion of the Subject”, “Position of the Unconscious”), object a (“Overture”), và vị trí nhà phân tâm/sự thật (“The Direction of the Treatment”, “Science and Truth”) tạo nền để đọc diễn ngôn.']

 <p><b>Địa vị lý thuyết.</b> Đây là biến thể hậu kỳ của diễn ngôn Chủ nhân, được Lacan phác họa trong bài giảng Milan năm 1972. Nó không phải “diễn ngôn thứ năm” được tạo ra bằng phép quay một phần tư giống bốn công thức kinh điển; một số tác giả gọi nó là diễn ngôn thứ năm để tiện trình bày, nhưng về cấu trúc nên đánh dấu nó là một biến thể.</p>

function diag(d){return d===D.capitalist?CAP:''}
const cf=d=>T(d.a)+'/'+T(d.t)+' → '+T(d.o)+'/'+T(d.p);
function render(){
  const d=D[cur];let h='';
  if(view.type==='disc'){
    h='<b>'+d.g+' · Diễn ngôn '+d.n+'</b><i class="tag">'+d.tag+'</i>'+mat(d)+'<p>'+d.d+'</p>'+(IM[cur]?'<p class="note" style="margin-top:0"><b>Bất khả:</b> '+IM[cur]+'<br><b>Bất lực:</b> '+IMP[cur]+'</p>':'')+'<p class="ex"><b style="font-size:13px">Ví dụ minh họa.</b> '+d.ex+'</p>';
    POSL.forEach((pos,i)=>{h+='<div class="row" data-pos="'+pos+'"><span class="chip" style="color:'+hex(TE[d[FLD[pos]]].c)+'">'+T(d[FLD[pos]])+'</span><span><u>'+PO[pos].n+'</u>'+d.r[i]+'</span></div>'+DXH(cur,pos)});
    h+=diag(d)+ARL();h+='<p class="note" style="margin-top:10px"><b>Bốn công thức chuẩn · quy ước quay theo chiều kim đồng hồ</b><br>Chủ nhân → Cuồng loạn → Nhà phân tâm → Học thuật → Chủ nhân. Đây là phép hoán vị cấu trúc, không phải tiến trình lịch sử hay các giai đoạn phát triển.</p>';
    ORDER.forEach(k=>{h+='<div class="gen'+(k===cur?' on':'')+'" data-disc="'+k+'"><span>'+D[k].g+' '+D[k].n+'</span><span style="font-style:italic">'+cf(D[k])+'</span></div>'});
    h+='<p class="note"><b>Biến thể ngoài vòng quay:</b></p><div class="gen'+(cur==='capitalist'?' on':'')+'" data-disc="capitalist"><span>Biến thể · '+D.capitalist.n+'</span><span style="font-style:italic">'+cf(D.capitalist)+'</span></div>';
    h+='<p class="note">Theo dõi S₁ khi quay theo chiều kim đồng hồ: tác nhân (Chủ nhân) → cái khác (Cuồng loạn) → sản phẩm (Nhà phân tâm) → sự thật (Học thuật). Chiều quay ngược cũng cho các hoán vị còn lại; điều quan trọng là luôn nói rõ quy ước.</p>';
    h+=`<div class="intro"><b>Trước khi đọc</b><p>Đây không phải bốn kiểu tính cách hay bốn chẩn đoán, mà là bốn cách con người nói chuyện và ràng buộc nhau: trong lớp học, công sở, phòng khám, cuộc cãi vã. Vị trí thì đứng yên, còn bốn ký hiệu S₁, S₂, $, a lần lượt đổi chỗ. Một người hay một tổ chức có thể trượt từ diễn ngôn này sang diễn ngôn khác tùy lúc.</p><p><b>Cách đọc:</b> hàng trên là lời gọi đi từ tác nhân tới cái khác (chỗ của bất khả). Hàng dưới là sản phẩm // sự thật (chỗ của bất lực): ở đó không có mũi tên, chỉ có dấu //.</p></div>`;
  }else if(view.type==='term'){
    const k=view.key,t=TE[k],pos=POSL.find(p=>hold[p]===k),i=POSL.indexOf(pos);
    h='<b style="color:'+hex(t.c)+'">'+T(k)+' · '+t.n+'</b><p>'+t.txt+'</p><p class="ex"><b style="font-size:13px">Ví dụ.</b> '+t.ex+'</p>'+X(t.x)+'<p>Ở đây nó giữ vị trí <i>'+PO[pos].n+'</i>: '+d.r[i]+'.</p><p>'+DX[cur][pos][0]+'</p><p class="ex"><b style="font-size:13px">Ví dụ.</b> '+DX[cur][pos][1]+'</p><p class="note" style="margin-top:8px">Nó đi qua các vị trí:</p>';
    ALL.forEach(dk=>{h+='<div class="gen'+(dk===cur?' on':'')+'" data-disc="'+dk+'"><span>'+D[dk].n+'</span><span>'+PO[where(dk,k)].n+'</span></div>'});
    h+='<span class="back">← quay lại diễn ngôn</span>';
  }else if(view.type==='arr'){
    const a=AR[view.key];
    const detail=(view.key==='fracLeft'||view.key==='fracRight')?FRACTION_PANEL(view.key):ARB(view.key);
    h='<b>'+a.n+'</b><i class="tag">'+a.s+'</i><p class="note" style="margin-top:0">Trong diễn ngôn '+d.n+': '+a.f(d)+'</p>'+detail+ARL()+'<span class="back">← quay lại diễn ngôn</span>';
  }else if(view.type==='cons'){
    h='<b>Khái niệm nền tảng</b><i class="tag">Những ý đứng sau sơ đồ</i>'+CON.map(c=>'<p><b style="font-size:14px">'+c[0]+'</b><br>'+c[1]+'</p>').join('')+BOOKMAP+SOURCEMAP+'<span class="back">← quay lại diễn ngôn</span>';
  }else{
    const pos=view.key;
    h='<b>'+PO[pos].n+'</b><p>'+PO[pos].txt+'</p><p class="ex"><b style="font-size:13px">Ví dụ.</b> '+PO[pos].ex+'</p>'+X(PO[pos].x)+'<p class="note">Ai chiếm vị trí này:</p>';
    ALL.forEach(dk=>{const tk=D[dk][FLD[pos]];h+='<div class="gen'+(dk===cur?' on':'')+'" data-disc="'+dk+'"><span>'+D[dk].n+'</span><span style="color:'+hex(TE[tk].c)+';font-style:italic">'+T(tk)+'</span></div>'});
    h+='<span class="back">← quay lại diễn ngôn</span>';
  }
  P.innerHTML=h.replace(/\$/g,'<span class="bs">S</span>');
}
P.addEventListener('mouseover',e=>{const x=e.target.closest('[data-pos]');hotPos=x?x.dataset.pos:null});
P.addEventListener('mouseleave',()=>hotPos=null);
P.addEventListener('click',e=>{
  const dk=e.target.closest('[data-disc]');if(dk){setDisc(dk.dataset.disc);return}
  const ar=e.target.closest('[data-arr]');if(ar){view={type:'arr',key:ar.dataset.arr};render();return}
  if(e.target.closest('.back')){view={type:'disc'};render();return}
  const ps=e.target.closest('[data-pos]');if(ps){view={type:'pos',key:ps.dataset.pos};render()}
});
P.addEventListener('keydown',e=>{
  const ar=e.target.closest('[data-arr]');

});

let yaw=.35,pitch=.5,dist=9.8,drag=false,moved=0,lx=0,ly=0;
const cv=R.domElement,ray=new THREE.Raycaster(),mp=new THREE.Vector2();
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.006;pitch=Math.max(-.3,Math.min(1.5,pitch+dy*.006));lx=e.clientX;ly=e.clientY}
  else{const h=hit(e);hov=h&&h.userData.key||null;hotArr=h&&h.userData.arr||null;hotPos=h&&h.userData.pos||(P.matches(':hover')?hotPos:null);cv.style.cursor=h?'pointer':'grab'}
});
cv.addEventListener('pointerup',e=>{drag=false;if(moved<5){const h=hit(e);if(h){view=h.userData.arr?{type:'arr',key:h.userData.arr}:h.userData.key?{type:'term',key:h.userData.key}:{type:'pos',key:h.userData.pos};render()}}});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(5,Math.min(18,dist+e.deltaY*.008))},{passive:false});
function hit(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
  const r=ray.intersectObjects(TK.map(k=>OB[k].m).concat(pick));return r.length?r[0].object:null}
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const tmp=new THREE.Color();
function frame(){
  const t=clk.getElapsedTime();
  if(auto&&!drag)yaw+=.0022;
  cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0);
  root.rotation.x=-.5;stars.rotation.y=t*.012;stars.rotation.x=t*.004;
  TK.forEach((k,i)=>{
    const o=OB[k],u=o.delta?Math.min(1,(t-o.t0)/o.dur):1,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    o.ang=o.start+o.delta*e;
    const p=pp(o.ang);p.z=.35+Math.sin(t*1.4+i*1.7)*.07+(o.delta?Math.sin(Math.PI*u)*.9:0);
    o.g.position.copy(p);
    if(u>=1&&!o.done){o.done=true;pulse(p,TE[k].c,t)}
    o.g.scale.setScalar((hov===k?1.15:1)*(1+(u<1?.18*Math.sin(Math.PI*u):0)));
    o.sat.rotation.set(1.1,t*.6,t*(1+i*.3));
    o.glow.material.opacity=.5+.15*Math.sin(t*2+i)+(u<1?.25:0);
    o.ta.copyWithin(3,0,(N-1)*3);o.ta[0]=p.x;o.ta[1]=p.y;o.ta[2]=p.z;o.tr.geometry.attributes.position.needsUpdate=true;
  });
  POSL.forEach(k=>{const E=PE[k],hot=hotPos===k;E.ring.material.color.setHex(TE[hold[k]].c);E.ring.rotation.z=t*.3;E.ring.scale.setScalar(1+(hot?.12:0)+.03*Math.sin(t*2));
    E.col.material.color.setHex(TE[hold[k]].c);E.col.material.opacity=(hot?.22:.08)+.02*Math.sin(t*2)});
  Object.entries(frac3D).forEach(([k,f])=>{
    const hot=hotArr===k;
    f.core.material.color.setHex(hot?0xffffff:0xffd166);
    f.core.scale.y=hot?1.55:1;
    f.glow.material.opacity=hot?.52:.24;
    f.highlight.material.opacity=hot?1:.82;
  });
  const fp=flow.geometry.attributes.position,fc=flow.geometry.attributes.color;
  for(let j=0;j<6;j++)for(let i=0;i<M;i++){
    const u=(i/M+t*.22+j*.13)%1,A=paths[j][0],B=paths[j][1],q=.14+.72*u,idx=(j*M+i)*3,f=Math.sin(Math.PI*u)*pathOn[j];
    fp.array.set([A.x+(B.x-A.x)*q,A.y+(B.y-A.y)*q,.12],idx);fc.array.set([pathCol[j].r*f,pathCol[j].g*f,pathCol[j].b*f],idx)}
  fp.needsUpdate=fc.needsUpdate=true;
  for(let i=pulses.length-1;i>=0;i--){const q=pulses[i],u=(t-q.t)/1.2;
    if(u>1){root.remove(q.m);q.m.geometry.dispose();q.m.material.dispose();pulses.splice(i,1)}
    else{q.m.scale.setScalar(1+u*1.9);q.m.material.opacity=(1-u)*.9}}
  R.render(scene,cam);requestAnimationFrame(frame);
}

.", "truth": "Người chuyển việc liên tục: việc nào cũng “gần đúng”, cái thiếu luôn ở chỗ khác.", "product": "Vật lý tìm ra hạt mới trả lời một câu hỏi, rồi câu hỏi tiếp theo về nó mở ra."}, "capitalist": {"agent": "Ứng dụng hỏi “hôm nay bạn thấy sao?”, rồi gợi ý món hợp tâm trạng ấy.", "other": "Công ty bán “giải pháp giấc ngủ” dựa trên nghiên cứu do chính họ tài trợ.", "truth": "Khẩu hiệu “cứ làm đi” không bảo bạn làm gì, chỉ ra lệnh làm.", "product": "Chiếc túi giới hạn: thích nhất lúc chờ mở bán, nhạt đi ngay khi đã cầm."}},G={"master": {"bottom": "Xưởng lãi kỷ lục, vậy mà ông chủ vẫn giật mình mỗi khi điện thoại reo, sợ ai đó phát hiện mình không xứng với chiếc ghế.", "crossT": "Ông không nói gì, nhưng thợ nhìn mắt ông đã biết hôm nay nên im lặng và làm nhanh tay hơn.", "crossP": "Quý này lãi thêm, ông liền ghi vào bảng chỉ tiêu quý sau một con số cao hơn nữa.", "bar": "Trên bục họp ông chủ nói rành rọt; dưới câu nói ấy là nỗi sợ không ai nghe thấy. Mỗi nửa của cặp ấy cần nửa kia để đứng vững."}, "university": {"bottom": "Bảng điểm làm em lo đến mất ngủ, nhưng em không thể hỏi vì sao điểm số lại quyết định giá trị của mình; không có ai ở đó để hỏi.", "crossT": "Chỉ tiêu tuyển sinh được ký từ trước nên cả lớp bị đo bằng những môn dễ đếm; em giỏi vẽ hay giỏi nói chuyện không có ô nào.", "crossP": "Khảo sát cho thấy sinh viên kiệt sức, nhà trường liền thêm một bảng khảo sát nữa và một khóa “cân bằng cuộc sống” vào lịch học.", "bar": "Bảng chỉ số hiệu suất (KPI) được trình bày như thước đo trung lập; thứ hạng của trường mới là điều đứng sau và quyết định thước đo nào được chọn."}, "analyst": {"bottom": "Chữ “thừa” làm người bệnh nhẹ người, nhưng hôm sau nó lại gợi thêm ba ký ức mới; chữ ấy không đóng được hồ sơ nào.", "crossT": "Anh kể chuyện nào cũng chen vào một câu giống nhau, “ừ thì cũng chẳng sao”, mà không nhận ra mình đang lặp lại.", "crossP": "Từ khi chữ “thừa” bật ra, nhà phân tâm nghe mọi câu của người bệnh kỹ hơn ở những chỗ có chữ ấy.", "bar": "Nhà phân chấm theo bảng tiêu chí đánh giá (rubric) và dần nhìn bản thân qua từng tiêu chí.", "crossT": "Nhân viên thấy áp lực chỉ số hiệu suất dù sếp bảo “cứ làm tốt việc mình”.", "crossP": "Mỗi khảo sát cho thấy nhân viên kiệt sức, công ty lại thêm một chương trình “chăm sóc tinh thần”.", "bar": "Biên bản ghi mọi quyết định theo “căn cứ khoa học”, không ghi ai đã quyết trước."}, "analyst": {"top": "Người bệnh hỏi “bác sĩ có nghĩ em điên không?”; nhà phân tâm hỏi lại “điên là gì với em?”.", "bottom": "Phân tích nhiều năm, người ta vẫn không biết hết mình, chỉ biết mình hay lặp lại điều gì.", "left": "Nhà phân tâm chú ý chỗ người bệnh liên tục nhầm tên cha thành tên chú.", "right": "Kể bốn buổi liền về công việc, buổi thứ năm anh bất ngờ gọi cấp trên là “bố”.", "crossT": "Anh quên chìa khóa đúng ngày hẹn gặp người cũ.", "crossP": "Sau khi chữ “thừa” bật ra, nhà phân tâm chú ý mọi lần người bệnh dùng lại chữ ấy.", "bar": "Người bệnh nói “chuyện đó không quan trọng” đúng lúc nó sắp quan trọng nhất."}, "hysteric": {"top": "Học trò hỏi “nếu thầy đúng, vì sao thí nghiệm này không ra kết quả?”; không câu trả lời nào làm em ngừng hỏi.", "bottom": "Mỗi lời giải thích thêm chỉ làm khoảng trống dịch đi một chút.", "left": "Người bạn chê hết nhà hàng này đến nhà hàng khác, thật ra thấy thiếu một điều không gọi tên được.", "right": "Chuyên gia bị chất vấn phải mở lại số liệu rồi tìm thêm bằng chứng.", "crossT": "Thầy thấy mình bị thử ngay khi một học sinh im lặng nhìn mình.", "crossP": "Một câu trả lời hay khiến sinh viên nghĩ ra ba câu hỏi mới.", "bar": "Cô nói “không có gì”, nhưng cả phòng hiểu rằng có."}, "capitalist": {"top": "Mạng xã hội không hỏi bạn muốn gì; nó hiển thị thứ nó đoán là bạn muốn.", "bottom": "Chuỗi phim tự chuyển tập kế tiếp, không để ta kịp hỏi mình có muốn xem tiếp không.", "left": "Buồn thì “ăn món đáng giá”, bực thì “mua gì đó cho mình”.", "right": "Hãng công nghệ ra bản mỏng hơn, đủ hào quang để người ta thấy cần đổi.", "crossT": "Hãng đồng hồ tung chiến dịch “ const E1={"S1": "Trong cuộc họp, sếp gõ nhẹ lên bàn: “thôi, cứ làm theo tôi”, và cả phòng im bặt. Trên ghế phân tích, người bệnh chỉ còn lặp một chữ, “mẹ”, và mọi câu chuyện khác dừng lại như xe đâm vào tường.", "S2": "Lò gốm của một làng nghề: người thợ già nhìn màu lửa là biết men đã chín chưa, rồi truyền lại bằng một cái liếc mắt chứ không bằng sách. Cả chuỗi kinh nghiệm nối nhau từ đời này sang đời khác.", "$": "Bạn nói “mình muốn nghỉ việc”, rồi tối đó lại ngồi chỉnh hồ sơ xin thăng chức. Hay anh lỡ miệng gọi cô giáo là “mẹ” rồi đỏ bừng mặt. Điều ta nói và điều ta muốn lệch nhau một nhịp.", "a": "Chiếc điện thoại mới sáng bóng sau lớp kính tủ trưng bày. Về đến nhà, hào quang tan như bọt xà phòng, nhưng cảm giác “còn thiếu một thứ gì đó” vẫn nằm lại và kéo mắt bạn sang món tiếp theo."},E2={"agent": "Cô giáo đứng trước bảng, ông sếp cầm micro trong buổi họp, cô bệnh nhân bước vào phòng và bắt đầu than phiền. Ai đang mở lời trước cả căn phòng thì người đó đang ngồi ghế tác nhân.", "other": "Nhân viên cúi đầu ghi lệnh, sinh viên cắm cúi chép bài, bác sĩ lặng lẽ nghe bệnh nhân vặn hỏi. Ai bị lời nói gọi đến và phải làm gì đó đáp lại thì đang ở ghế cái khác.", "truth": "Ông chủ cứng rắn trước cả xưởng, nhưng nửa đêm nằm thức nghĩ: “mình có đủ tư cách không?”. Nỗi lo ấy nằm dưới vạch: không ai nghe thấy, và chính ông cũng không dám gọi tên nó.", "product": "Người thợ may được trả lương cố định; số vải dôi ra thành những chiếc áo bán giá cao rơi vào tay chủ. Cái dôi ra ấy chính là sản phẩm: sinh ra từ tay thợ nhưng không về tay thợ."},E3={"master": "Một ông chủ xưởng gõ nhẹ lên bàn: “cứ làm theo lời tôi”. Người thợ già xoay máy bằng đôi tay đã quen, còn ông chủ chỉ nhìn bảng sản lượng và chưa bao giờ biết máy chạy vì sao. Cuối tháng, phần lợi nhuận dôi ra vào túi ông; còn đêm nào ông cũng thức vì sợ mình không xứng với chiếc ghế ấy, điều không ai được thấy.", "university": "Cuốn giáo trình dày cộp, mệnh đề nào cũng kèm chú thích “nghiên cứu cho thấy”. Sinh viên ngồi chép, được đo bằng điểm, và dần quên mất câu hỏi riêng mình mang vào lớp. Còn ý chí thật sự, như chỉ tiêu tuyển sinh hay chính sách của trường, nằm lặng lẽ dưới tờ bìa như sự thật.", "analyst": "Cô nghiên cứu sinh nói suốt nửa giờ về Bakhtin, mạch lạc đến mức ai cũng gật đầu. Nhà phân tâm không hỏi gì về Bakhtin; ông chỉ để ý lúc cô lỡ lời, một chữ nghe như chuyện cô từng từ chối một lời cầu hôn rồi bỏ nước ra đi. Ông bám vào chỗ lời cô tự vấp, chứ không tranh luận lý thuyết.", "hysteric": "Bệnh nhân bác từng chẩn đoán của bác sĩ: “không phải căng thẳng, tôi thấy không phải”. Giống những người bệnh đã buộc Freud sửa lại lý thuyết của mình, hay nhà vật lý cứ đẩy một thuyết đến chỗ nó lộ ra giới hạn, như nguyên lý bất định của Heisenberg. Cả hai đều không chịu nhận một câu trả lời giả.", "capitalist": "Tối chủ nhật bạn thấy bứt rứt mà không rõ vì sao. Quảng cáo hiện lên đúng lúc: chiếc điện thoại mới “sẽ làm mọi thứ khác đi”. Bạn bấm mua; hộp đến, bạn thích ba hôm; rồi một thông báo mới nhảy ra. Vòng quay chạy tiếp."};

const N20={"master": {"agent": ["Vị trí phát ngôn: nơi mệnh lệnh được đặt ra và liên kết xã hội bắt đầu vận hành.", "Sức mạnh nằm ở chỗ đứng để nói, không ở nội dung được nói: cùng một câu, đổi người nói thì mất hiệu lực. Nghịch lý là S₁ không biết mình đang được $ chống đỡ từ bên dưới; nó tin quyền uy là tự thân. Khác với Học thuật, nơi mệnh lệnh phải mượn giọng tri thức, ở đây mệnh lệnh không cần mượn gì.", "Một người cha được cả họ nhờ phân xử chuyện đất đai; ông chỉ nói “cứ thế mà làm”, mọi người gật theo, dù lý lẽ của ông chẳng hơn lý lẽ của ai."], "other": ["Vị trí được gọi đến: nơi tri thức và sức lao động bị huy động để thực thi mệnh lệnh.", "Tri thức bị trưng dụng mà không được tiêu hóa: chủ nhân phụ thuộc vào đúng thứ ông ra lệnh, vì thiếu cái biết-làm (savoir-faire) của người làm thì mệnh lệnh chỉ là âm thanh. Khác với Học thuật, nơi S₂ nói thay cho chủ, ở đây S₂ câm lặng và bị tước quyền đặt mục tiêu. Hệ quả: tri thức tích tụ ở người làm nhưng không bao giờ thành quyền lực của họ.", "Chủ tiệm sửa xe chỉ tay: “xong trước trưa”. Anh thợ già nghe tiếng máy là biết con ốc nào lỏng, nhưng chưa ai hỏi anh nên sắp xếp cái tiệm theo cách nào."], "truth": ["Vị trí nền ẩn: điều chống đỡ tác nhân mà chính tác nhân không nhận ra mình đang dựa vào.", "$ là điểm mù cấu trúc, không phải bí mật tâm lý ông chủ cố giấu: ông không thấy nó vì chính chỗ ông đứng đòi hỏi phải không thấy. Nếu thừa nhận, S₁ sụp, vì quyền uy này sống nhờ vẻ toàn vẹn. So sánh chéo: ở Cuồng loạn, $ đứng ở tác nhân và được phơi ra để chất vấn; ở đây nó bị chôn dưới vạch.", "Một cụ trưởng tộc không bao giờ nói “tôi chưa chắc”; hễ ai gợi ý bàn lại thì cụ cắt ngang. Không hẳn vì cụ độc đoán, mà vì cả vị thế sẽ lung lay nếu cụ để lộ một lần đắn đo."], "product": ["Vị trí kết quả: phần dư của vận hành, không quay lại được nền ẩn để chữa nó.", "a là phần dư không thể quy đổi ra giá trị trao đổi: khoái cảm dư thừa (plus-de-jouir) là hạt nhân của cả kinh tế của khoái cảm lẫn chính trị, vì người ta làm việc không chỉ vì lương mà vì cái dôi ra chưa ai gọi tên. Khác với Tư bản, nơi a được sản xuất có chủ đích, ở đây a dôi ra như hệ quả ngoài dự tính.", "Mùa gặt, tá điền gánh xong số lúa nộp tô vẫn còn dư vài thúng; điền chủ không ghi vào sổ, nhưng đêm nào cũng nhẩm lại, như thể bao nhiêu cũng chưa đủ."]}, "university": {"agent": ["Vị trí phát ngôn: nơi tri thức đứng ra nói thay cho mọi quyền lực khác.", "S₂ nói nhân danh khách quan, nhưng việc chọn chỉ số nào để đo đã là một quyết định của S₁; vị trí này luôn trình bày lựa chọn như phát hiện. Khác với Chủ nhân, nơi mệnh lệnh nói thẳng “vì tôi bảo”, ở đây mệnh lệnh phải mặc áo “vì dữ liệu cho thấy”.", "Nhà trường bảo giờ học thêm “đã được chứng minh hiệu quả”, nhưng chưa ai hỏi vì sao hiệu quả lại đo bằng điểm thi chứ không bằng việc em còn muốn học hay không."], "other": ["Vị trí bị tác động: nơi con người được xếp thành đối tượng để biết, đo và can thiệp.", "a bị khách thể hóa có phương pháp: đó là bạo lực nhận thức luận (cách biết đã định sẵn cái được biết), không phải bạo lực thô. Khác với Nhà phân tâm, nơi a ở tác nhân như cái gây ham muốn, ở đây a là cái bị nhìn; sự đối xử ấy trông như chăm sóc nên càng khó phản kháng.", "Một cụ già vào viện được ghi là “ca té ngã, nguy cơ cao”; cụ muốn kể cái cầu thang nhà cụ gắn với đời cụ ra sao, nhưng mẫu hồ sơ không có dòng nào cho chuyện ấy."], "truth": ["Vị trí nền ẩn: mệnh lệnh chống đỡ tri thức nhưng không được nói ra như mệnh lệnh.", "S₁ ẩn dưới dạng “giá trị hiển nhiên” (hiệu quả, chất lượng, chuẩn mực), nên nguy hiểm hơn S₁ lộ liễu của Chủ nhân: lệnh lộ liễu còn cãi được, còn giá trị hiển nhiên thì chất vấn nó bị coi là thiếu hiểu biết.", "Không ai viết “hãy khiến giảng viên chạy theo bài báo”, chỉ có tiêu chí “chất lượng công bố quốc tế”; hỏi “chất lượng đối với ai?” thì bị coi là lạc đề."], "product": ["$ ở vị trí sản phẩm: hệ thống đo lường con người, rồi thải ra một chủ thể không khớp với chính thước đo ấy.", "Nghịch lý: chủ thể bị sản sinh bởi chính cái đo lường nó, nên chỉ có thể xuất hiện như “cái không khớp”. Khác với Chủ nhân (nơi bị che), Học thuật phơi ra nhưng lại xử lý nó như “vấn đề kỹ thuật” (thiếu động lực, thiếu kỹ năng), chứ không như hiệu ứng cấu trúc của chính tri thức. Đây là hình thức thống trị đặc thù: không che giấu chủ thể, mà xử lý chủ thể.", "Một nghiên cứu sinh đạt mọi chỉ số, nhưng khi hội đồng hỏi “điều gì khiến em thấy công trình này có ý nghĩa”, em không trả lời được — không phải vì em không có câu trả lời, mà vì câu trả lời ấy không có ô để điền."]}, "analyst": {"agent": ["Vị trí phát ngôn: nơi người nghe đứng làm nguyên nhân gợi ham muốn thay vì áp đặt lời giải.", "Nhà phân tâm chiếm chỗ của a nhưng không phải là a: ông chỉ giữ chỗ trống để ham muốn của người kia dựa vào. Nếu ông tin mình thực sự là đối tượng a, cấu trúc đổ thành thôi miên hay quyền uy cá nhân. So sánh chéo: Chủ nhân cũng nói từ vị trí đặc quyền, nhưng đặc quyền ấy bắt người kia làm việc; ở đây nó để người kia lên tiếng.", "Một học viên khoe mới được đề bạt rồi bật cười; nhà phân tâm chỉ hỏi lại “đề bạt?” rồi im. Tiếng cười tắt dần, và anh bắt đầu nói về chuyện anh chưa từng muốn chức ấy."], "other": ["Vị trí được triệu tập: nơi chủ thể chia cắt được mời nói mà không bị chẩn đoán.", "$ được triệu tập chứ không bị điều tra: sự chia cắt được mời lên tiếng thay vì bị gọi tên. So sánh chéo: ở Học thuật, người ở vị trí này bị quy thành đối tượng a để biết và đo; ở đây chính chỗ không khớp được coi là chất liệu làm việc.", "Chị nói sẽ chuyển việc “để tự do hơn”, rồi lỡ miệng: “ở đó đâu có ai coi giờ giấc của mình”. Không ai sửa chị; câu lỡ ấy được để nguyên trên bàn."], "truth": ["Vị trí nền ẩn: tri thức vô thức chống đỡ cuộc làm việc nhưng chưa thuộc về ai.", "Tri thức vô thức không phải tri thức nhà phân tâm sở hữu: nó nằm ở người bệnh, chưa được chủ thể hóa. Đây là khác biệt căn bản với Học thuật, nơi S₂ ở tác nhân và người giữ tri thức cũng là người nói. Ngộ nhận cần tránh: tưởng nhà phân tâm “biết trước” rồi dẫn người bệnh tới đáp án.", "Một người luôn quên tên đúng một đồng nghiệp cũ từng làm anh xấu hổ; nhà phân tâm chưa từng nghe tên ấy, nhưng chuỗi quên của anh đã vạch sẵn đường đi."], "product": ["Vị trí kết quả: nơi một cái biểu đạt-chủ mới bật ra từ chính lời của người nói.", "S₁ được sản xuất là cái biểu đạt-chủ mới chứ không phải chân lý cuối: nó nổi lên từ cái ngớ ngẩn (la bêtise) của chính người nói, một câu vô nghĩa nhưng có sức nặng vì chuỗi ý nghĩa cũ được sắp lại quanh nó. So sánh chéo: ở Chủ nhân, S₁ đứng đầu chuỗi như điểm xuất phát bị áp đặt; ở đây nó đứng cuối như kết quả của lao động.", "Sau cả buổi nói chuyện công việc, chị bật ra “mình chỉ là người cho mượn”; phòng im lặng, vì chị vừa nghe thấy câu ấy dính vào mọi chuyện chị đã kể."]}, "hysteric": {"agent": ["Vị trí phát ngôn: nơi chủ thể chia cắt cất tiếng bằng câu hỏi để thử quyền uy.", "$ chất vấn có phương pháp, không phải bất lực: đó là chiến lược buộc chủ nhân lộ điểm yếu. Ngộ nhận cần tránh: coi đây là tính cách “hay vặn vẹo”. So sánh chéo: ở Tư bản, $ cũng ở tác nhân nhưng không hỏi ai; câu hỏi của nó đã được hàng hóa trả lời trước khi kịp thành câu hỏi.", "Một nhân viên mới cứ hỏi “quy định này sinh ra để bảo vệ ai?” trong buổi tập huấn; cả phòng thấy khó chịu, và trưởng phòng bất giác phải đọc lại quy định."], "other": ["Vị trí bị chất vấn: nơi quyền uy buộc phải đáp lời và chứng minh mình.", "S₁ bị đặt vào thế phải chứng minh, khác với Chủ nhân, nơi S₁ không cần chứng minh: khi bị hỏi, quyền uy lộ ra rằng nó chỉ đứng được nhờ tri thức nó huy động. Hệ quả: người cuồng loạn không lật đổ chủ nhân mà khiến chủ nhân phải sản xuất tri thức.", "Cả lớp chờ thầy trả lời một câu hóc; thầy lật lại giáo án rồi thú nhận cần về tra thêm. Thầy vẫn là thầy, nhưng cái ghế của thầy đã đổi nghĩa."], "truth": ["Vị trí nền ẩn: cái thiếu không gọi tên được, thứ thúc đẩy câu hỏi.", "a là cái thiếu không thể gọi tên; đây là lý do câu hỏi không bao giờ khép: mọi câu trả lời đều bị cảm thấy “gần đúng nhưng chưa phải”. Cơ chế ẩn: người hỏi không biết mình đang tìm gì, nên không câu trả lời nào làm họ dừng được. Khác với Chủ nhân, nơi sự thật là $ phải giấu, ở đây sự thật là cái thiếu mà không ai có để đưa.", "Một người đi từ nghề này sang nghề khác, nơi nào cũng bảo “gần rồi, nhưng chưa phải”; nếu có ai đưa cho anh công việc “hoàn hảo”, có lẽ anh vẫn tìm ra lý do để thấy nó thiếu."], "product": ["Vị trí kết quả: tri thức mới do bị chất vấn sinh ra, luôn chưa đủ.", "S₂ được sản xuất nhưng không bao giờ đủ: đó là mô hình vận hành của khoa học, mỗi lý thuyết sinh ra từ câu hỏi rồi đẻ ra câu hỏi mới. So sánh chéo: ở Nhà phân tâm, sản phẩm là S₁, một cái biểu đạt bất ngờ; ở Cuồng loạn, sản phẩm là S₂, một chuỗi tri thức dài ra. Ngộ nhận cần tránh: coi “không bao giờ đủ” là thất bại, khi nó chính là động cơ.", "Một nhóm bạn sửa mãi bản kế hoạch du lịch vì lần nào cũng có người hỏi “thế nếu mưa thì sao?”; bản kế hoạch dày dần, cả nhóm hiểu chuyến đi rõ hơn, dù chưa ai coi bản nào là xong."]}, "capitalist": {"agent": ["Vị trí phát ngôn: nơi chủ thể bất mãn đứng ra, thay cho một người ra lệnh.", "$ không bị che mà được khuyến khích lộ ra: thống trị bằng cách khai thác bất mãn. So sánh chéo: ở Chủ nhân, $ nằm dưới vạch và phải bị giấu để quyền uy đứng vững; ở Tư bản, sự chia cắt được đem ra ánh sáng và biến thành nhiên liệu. Cái được mời bày tỏ lại chính là cái bị sử dụng.", "Một ứng dụng tập luyện hỏi “hôm nay bạn thấy thế nào?”; chọn “mệt” thì nhận gói nghỉ dưỡng, chọn “hăng hái” thì nhận gói nâng cấp. Trả lời gì cũng thành dữ liệu để bán."], "other": ["Vị trí được huy động: nơi bộ máy tri thức-kỹ thuật vận hành mà không cần người ra lệnh.", "Bộ máy tự vận hành không cần chủ nhân: khác biệt căn bản với Học thuật, nơi S₂ còn mang giọng của một ai đó ở tác nhân. Ở Tư bản, S₂ không nói với ai, nó chỉ chạy. Hệ quả: không còn địa chỉ để gửi khiếu nại, vì khâu ra quyết định đã được chia cho thuật toán.", "Tài xế giao hàng bị trừ điểm vì đến trễ hai phút do kẹt xe; gọi tổng đài chỉ nghe “hệ thống tự tính”, và chính nhân viên cũng không biết ai đặt ngưỡng hai phút."], "truth": ["Vị trí nền ẩn: mệnh lệnh vô danh nâng đỡ guồng máy mà không bị gọi tên.", "Mệnh lệnh vô nhân (tăng trưởng, tối ưu hóa) nguy hiểm vì không có ai để chất vấn: ở Chủ nhân còn có người ra lệnh, ở Học thuật còn có chuyên gia nói thay; ở đây mệnh lệnh đã hòa vào không khí. Cơ chế ẩn: người ta tự áp mệnh lệnh ấy lên mình và gọi đó là lựa chọn.", "Cô nhân viên tự đặt báo thức 5 giờ sáng để “học thêm cho kịp”; không sếp nào bắt, nhưng nếu ngủ quên cô thấy mình có lỗi như vừa bỏ nhiệm vụ."], "product": ["Vị trí kết quả: phần dư được sản xuất liên tục rồi quay về làm nhiên liệu.", "a được sản xuất có chủ đích: đây là hình thức tiêu dùng của khoái cảm dư thừa. Khác với Chủ nhân, nơi a dôi ra ngoài dự tính, ở đây guồng máy được thiết kế để tạo ra thiếu hụt, nên vòng này không có điểm dừng tự nhiên: càng tiêu càng thiếu, càng thiếu càng tiêu.", "Một người chơi game trả tiền mở thẻ nhân vật hiếm; có đúng thẻ mình muốn thì vui được một tối, sáng hôm sau đã thấy thông báo thẻ mới ra mắt."]}};
for(const k in N20){D[k].r=POSL.map(p=>N20[k][p][0]);POSL.forEach(p=>{DX[k][p]=[N20[k][p][1],N20[k][p][2]];DXX[k][p]=[N20[k][p][1],N20[k][p][2]]})}
const FN={"master": {"L": ["Gạch chặn $ chạm tới S₁: ông chủ không thể nhận mình bị chia cắt, vì nhận thì mệnh lệnh mất sức nặng. Rào càng kín, lệnh càng cứng; chính độ cứng ấy là dấu vết của chỗ bị che.", "Bà chủ quán nhớ ra mình tính thiếu tiền nhập hàng, vẫn quát nhân viên “chị tính sai rồi”; nhận lỗi một lần thì cả quán sẽ thấy quyền của bà chỉ là cái vỏ."], "R": ["Gạch chặn phần dư a quay lại S₂: cái người làm sinh ra vượt quá điều cần thiết không trở về tay họ. Nhờ vậy, sự lệ thuộc của chủ nhân vào người làm không bị nhìn thấy.", "Một mẻ men đẹp bất ngờ ra lò làng gốm; mẻ ấy đứng tên chủ lò, còn người pha men chưa lần nào được hỏi anh đã làm thế nào."]}, "university": {"L": ["Gạch giữ mệnh lệnh S₁ khỏi lộ thẳng trong giọng của tri thức S₂, nên chỉ tiêu trông như kết luận khoa học. Rào mỏng đi thì ai cũng thấy “chuẩn” chỉ là ý muốn của ai đó.", "Một phòng thí nghiệm chỉ nhận đề tài “có khả năng thương mại hóa”, nhưng báo cáo ghi “dữ liệu cho thấy hướng ưu tiên”; không ai thấy chỗ khâu."], "R": ["Gạch ngăn $ quay lại a: nỗi lạc lối của người bị đo không đi ngược vào hệ thống để thành tiếng nói, nên họ chỉ còn cách tự trách mình.", "Một bạn thực tập bị chấm “chưa đạt kỹ năng mềm”, khóc ở cầu thang; biểu mẫu phản hồi cuối kỳ chỉ có ô chấm sao, không chỗ cho nỗi hoang mang ấy."]}, "analyst": {"L": ["Gạch ngăn tri thức vô thức S₂ tác động thẳng lên nhà phân tâm đang giữ chỗ a: ông không có đáp án sẵn nên không thể dẫn dắt. Rào này cũng bảo vệ người bệnh khỏi lời giải áp đặt.", "Người bệnh hỏi “thế rốt cuộc em bị gì?”, nhà phân tâm đáp “em nghe thấy mình vừa nói gì chưa?”; ông không giấu đáp án nào trong túi."], "R": ["Gạch ngăn S₁ vừa bật ra quay thẳng lại người nói: chữ mới chưa thành ý nghĩa chung cuộc, nên người nói phải nghe lại nó qua nhiều buổi.", "Buổi trước anh buột miệng chữ “ở nhờ”; những tuần sau anh kể về nhà, quán cà phê, công việc, và chữ ấy cứ trở lại cho đến buổi thứ năm anh mới tự nhận ra."]}, "hysteric": {"L": ["Gạch ngăn cái thiếu a tác động thẳng lên chủ thể đang hỏi: cô không biết mình đang tìm gì, nên câu hỏi mới giữ được sức bền.", "Cô đổi sở thích liên tục, từ học đàn sang vẽ rồi nấu ăn; lần nào cũng nói “thích lắm”, nhưng chưa lần nào kể được vì sao bỏ."], "R": ["Gạch ngăn tri thức mới S₂ quay lại làm yên chủ nhân S₁: câu trả lời vừa sinh ra đã bị hỏi tiếp, nên quyền uy không bao giờ được nghỉ.", "Hội đồng đã trả lời xong ba lần phản biện, nhưng lần thứ tư vẫn có người giơ tay; bản báo cáo dày thêm mà chưa ai thấy yên."]}, "capitalist": {"L": ["Gạch vẫn được viết nhưng không còn chặn: S₁ không bị giấu mà hiện rõ thành khẩu hiệu, $ tìm tới nó thẳng. Không có khoảng dừng thì không có chỗ để nghi ngờ.", "Vừa bị sếp chê, bạn thấy quảng cáo “khóa nâng cấp bản thân” ngay trong bản tin; chưa kịp hỏi mình thấy thiếu gì, tay đã bấm đăng ký."], "R": ["Gạch không còn chặn a: phần dư quay thẳng về $ và khởi động vòng mới ngay. Vì thế vòng chạy nhanh đến mức tự thiêu.", "Người cuộn xem video ngắn: mỗi video là một phần dư vừa đủ để nhớ video sau; hai giờ trôi qua mà không lúc nào dừng lại hỏi mình đang tìm gì."]}};

AR.fracLeft.s='Rào cản giữa tác nhân và sự thật';AR.fracLeft.t=["Gạch phân số là rào cản giữa hàng trên và hàng dưới, giữa bề mặt ý thức (tác nhân, cái khác) và nền ẩn (sự thật, sản phẩm). Ở cột trái, đó là sự kháng cự ngăn sự thật tác động thẳng lên tác nhân.", "Chính nhờ rào cản, diễn ngôn mới ổn định, tức là che giấu được sự thật. Khi rào cản biến mất như trong diễn ngôn Tư bản, diễn ngôn mất ổn định: nó chạy quá nhanh và tự thiêu."];
AR.fracRight.s='Rào cản giữa cái khác và sản phẩm';AR.fracRight.t=["Gạch phân số là rào cản giữa hàng trên và hàng dưới, giữa bề mặt ý thức (tác nhân, cái khác) và nền ẩn (sự thật, sản phẩm). Ở cột phải, đó là sự kháng cự ngăn sản phẩm quay thẳng lại cái khác.", "Chính nhờ rào cản, diễn ngôn mới ổn định, tức là che giấu được sự thật. Khi rào cản biến mất như trong diễn ngôn Tư bản, diễn ngôn mất ổn định: nó chạy quá nhanh và tự thiêu."];
